name: Football 13:00 previous-day review PushPlus
on:
  schedule:
    - cron: '0 5 * * *'
  pull_request:
    paths:
      - '.github/workflows/football-review-push-1300.yml'
      - 'scripts/football_jc_review_push.py'
      - 'analysis/football_jc_single_final_review.py'

permissions:
  contents: read

jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render the existing official 22-match review without sending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=football-jc-review-2100-20261108
          gh release download "$tag" --pattern "$tag.zip"
          python -B scripts/football_jc_review_push.py --archive "$tag.zip" \
            --day 2026-11-08 --repo "$GITHUB_REPOSITORY" --preview review-preview.html
          python - <<'PY'
          from pathlib import Path
          html = Path("review-preview.html").read_text(encoding="utf-8")
          assert html.count("最终比分") == 22
          assert all(label in html for label in ("竞彩胜平负", "竞彩让球胜平负", "竞彩总进球数", "未中", "完整复盘归档"))
          PY
          if python -B scripts/football_jc_review_push.py --archive "$tag.zip" \
            --day 2026-11-07 --repo "$GITHUB_REPOSITORY" --preview wrong-day.html; then
            echo "::error::Review sender accepted a different scoring day"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: football-review-1300-preview
          path: review-preview.html
          retention-days: 14

  send:
    if: github.event_name == 'schedule' && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Send one verified previous-day review and archive API acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          FOOTBALL_PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN || secrets.FOOTBALL_PUSHPLUS_TOKEN }}
        run: |
          python -B scripts/football_jc_capture_slot.py --send-window 1300
          day="$(TZ=Asia/Shanghai date --date=yesterday +%F)"
          tag="football-jc-review-2100-${day//-/}"
          claim="$tag-push-1300.claim.json"
          receipt="$tag-push-1300.accepted.json"
          endpoint="repos/$GITHUB_REPOSITORY/releases/tags/$tag"
          if ! gh api "$endpoint" --jq '.assets[].name' > assets.txt 2> release-error.txt; then
            if grep -Fq 'HTTP 404' release-error.txt; then
              echo "::notice::No verified 21:00 football review is archived for $day"
              exit 0
            fi
            cat release-error.txt >&2
            exit 1
          fi
          if grep -Fxq "$receipt" assets.txt; then
            echo "FOOTBALL_REVIEW_ALREADY_ACCEPTED $day"
            exit 0
          fi
          if grep -Fxq "$claim" assets.txt; then
            echo "::warning::Football review was already claimed for $day. API acceptance is unconfirmed."
            exit 0
          fi
          test -n "$FOOTBALL_PUSHPLUS_TOKEN"
          gh release download "$tag" --pattern "$tag.zip"
          args=(--archive "$tag.zip" --day "$day" --repo "$GITHUB_REPOSITORY" --preview review-preview.html)
          python -B scripts/football_jc_review_push.py "${args[@]}"
          python -B scripts/football_jc_capture_slot.py --send-window 1300
          printf '{"review_day_beijing":"%s","scheduled_slot_beijing":"13:00","run_id":"%s"}\n' "$day" "$GITHUB_RUN_ID" > "$claim"
          # Release asset names are unique. Upload without clobber before calling PushPlus.
          gh release upload "$tag" "$claim"
          python -B scripts/football_jc_review_push.py "${args[@]}" --receipt "$receipt"
          gh release upload "$tag" "$receipt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: football-review-1300-delivery
          path: |
            review-preview.html
            football-jc-review-2100-*-push-1300.accepted.json
          if-no-files-found: ignore
          retention-days: 14
