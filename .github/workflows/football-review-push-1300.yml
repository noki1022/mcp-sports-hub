name: Football 13:00 previous-day review PushPlus
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.cloudflare_slot_utc != '' && format('Cloudflare | slot={0}', inputs.cloudflare_slot_utc) || github.workflow }}
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      cloudflare_slot_utc:
        description: 'Original Cloudflare cron timestamp in UTC'
        required: false
        type: string
  pull_request:
    paths:
      - '.github/workflows/football-review-push-1300.yml'
      - 'scripts/football_jc_review_push.py'
      - 'analysis/sport_match_final_review_html.py'
      - 'analysis/sport_match_final_grade.py'
      - 'analysis/sport_match_final_registry.py'
      - 'ops/football_latest_review.py'
      - 'tests/test_football_latest_review.py'

permissions:
  contents: read

jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rehearse per-match selection, verified scoring and PushPlus preview without sending
        run: python -B -m unittest discover -s tests -p test_football_latest_review.py -v
  send:
    concurrency:
      group: football-review-1300
      cancel-in-progress: false
    env:
      CLOUDFLARE_SLOT_UTC: ${{ inputs.cloudflare_slot_utc }}
      POSTGAME_CRON: ${{ github.event.schedule }}
    if: github.ref == 'refs/heads/main' && github.run_attempt == '1' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.cloudflare_slot_utc != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate original scheduler slot
        run: python -B scripts/sports_postgame_slot.py football-review
      - name: Send one verified previous-day review and archive API acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          FOOTBALL_PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN || secrets.FOOTBALL_PUSHPLUS_TOKEN }}
        run: |
          day="$(TZ=Asia/Shanghai date --date=yesterday +%F)"
          tag="football-jc-review-latest-${day//-/}"
          claim="$tag-push-1300.claim.json"
          receipt="$tag-push-1300.accepted.json"
          endpoint="repos/$GITHUB_REPOSITORY/releases/tags/$tag"
          if ! gh api "$endpoint" --jq '.assets[].name' > assets.txt 2> release-error.txt; then
            if grep -Fq 'HTTP 404' release-error.txt; then
              echo "::notice::No verified per-match football review is archived for $day"
              exit 0
            fi
            cat release-error.txt >&2
            exit 1
          fi
          if grep -Fxq "$receipt" assets.txt; then
            echo "FOOTBALL_REVIEW_ALREADY_ACCEPTED $day"
            exit 0
          fi
          if grep -Fxq "$claim" assets.txt; then
            echo "::warning::Football review was already claimed for $day. API acceptance is unconfirmed."
            exit 0
          fi
          test -n "$FOOTBALL_PUSHPLUS_TOKEN"
          gh release download "$tag" --pattern "$tag.zip"
          args=(--archive "$tag.zip" --day "$day" --repo "$GITHUB_REPOSITORY" --preview review-preview.html)
          python -B scripts/football_jc_review_push.py "${args[@]}"
          python -B scripts/sports_postgame_slot.py football-review
          printf '{"review_day_beijing":"%s","scheduled_slot_beijing":"13:00","run_id":"%s"}\n' "$day" "$GITHUB_RUN_ID" > "$claim"
          # Release asset names are unique. Upload without clobber before calling PushPlus.
          gh release upload "$tag" "$claim"
          python -B scripts/football_jc_review_push.py "${args[@]}" --receipt "$receipt"
          gh release upload "$tag" "$receipt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: football-review-1300-delivery
          path: |
            review-preview.html
            football-jc-review-latest-*-push-1300.accepted.json
          if-no-files-found: ignore
          retention-days: 14
