name: Football 13:00 previous-day review PushPlus
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.cloudflare_slot_utc != '' && format('Cloudflare | slot={0}', inputs.cloudflare_slot_utc) || github.workflow }}${{ inputs.prepare_for_utc && format(' | prepare={0}', inputs.prepare_for_utc) || '' }}
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      prepare_for_utc:
        description: 'Original UTC business slot; runner preparation only, never an early capture or retry'
        required: false
        type: string
      cloudflare_slot_utc:
        description: 'Original Cloudflare cron timestamp in UTC'
        required: false
        type: string
  pull_request:
    paths:
      - '.github/workflows/football-review-push-1300.yml'
      - 'scripts/football_jc_review_push.py'
      - 'analysis/sport_match_final_review_html.py'
      - 'analysis/sport_match_final_grade.py'
      - 'analysis/sport_match_final_registry.py'
      - 'analysis/sports_verified_result_sources.py'
      - 'ops/football_latest_review.py'
      - 'tests/test_football_latest_review.py'
      - 'tests/test_football_review_delivery_preflight.py'

permissions:
  actions: read
  contents: read

jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rehearse per-match selection, verified scoring and PushPlus preview without sending
        run: |
          python -B -m unittest discover -s tests -p test_football_latest_review.py -v
          python -B -m unittest discover -s tests -p test_football_review_delivery_preflight.py -v
  send:
    concurrency:
      group: football-review-1300
      cancel-in-progress: false
    env:
      CLOUDFLARE_SLOT_UTC: ${{ inputs.cloudflare_slot_utc }}
      POSTGAME_CRON: ${{ github.event.schedule }}
    if: github.ref == 'refs/heads/main' && github.run_attempt == '1' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.cloudflare_slot_utc != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare original runner and wait without collecting or sending early
        id: runner_preparation
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARE_FOR_UTC: ${{ inputs.prepare_for_utc || '' }}
          PREWARM_CRON: ${{ github.event.schedule || inputs.recovery_cron || '' }}
          PREWARM_DAY: ${{ inputs.recovery_day || '' }}
          PREWARM_TARGET_DATE: ${{ inputs.target_date || '' }}
          PREWARM_REPORT_SLOT: ${{ inputs.report_slot || '' }}
          CLOUDFLARE_SLOT_UTC: ${{ inputs.cloudflare_slot_utc || '' }}
        run: python3 -B scripts/sports_runner_prewarm.py football-review
      - name: Validate original scheduler slot
        if: steps.runner_preparation.outputs.skip != 'true'
        run: python -B scripts/sports_postgame_slot.py football-review
      - name: Send one verified previous-day review and archive API acceptance
        if: steps.runner_preparation.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FOOTBALL_PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN || secrets.FOOTBALL_PUSHPLUS_TOKEN }}
        run: |
          day="$(TZ=Asia/Shanghai date --date=yesterday +%F)"
          tag="football-jc-review-latest-${day//-/}"
          claim="$tag-push-1300.claim.json"
          receipt="$tag-push-1300.accepted.json"
          endpoint="repos/$GITHUB_REPOSITORY/releases/tags/$tag"
          if ! gh api "$endpoint" --jq '.assets[].name' > assets.txt 2> release-error.txt; then
            if grep -Fq 'HTTP 404' release-error.txt; then
              echo "::error::FOOTBALL_REVIEW_BLOCKED_NO_VERIFIED_ARCHIVE $day; no retrospective predictions or delivery receipt created"
              exit 1
            fi
            cat release-error.txt >&2
            exit 1
          fi
          if grep -Fxq "$receipt" assets.txt; then
            echo "FOOTBALL_REVIEW_ALREADY_ACCEPTED $day"
            exit 0
          fi
          if grep -Fxq "$claim" assets.txt; then
            echo "::warning::Football review was already claimed for $day. API acceptance is unconfirmed."
            exit 0
          fi
          test -n "$FOOTBALL_PUSHPLUS_TOKEN"
          gh release download "$tag" --pattern "$tag.zip"
          archive="$tag.zip"
          refreshed="$tag-send-${GITHUB_RUN_ID}.zip"
          python -B ops/football_latest_review.py --recheck-archive "$archive" --out "$refreshed"
          if [ -f "$refreshed" ]; then
            archive="$refreshed"
          fi
          args=(--archive "$archive" --day "$day" --repo "$GITHUB_REPOSITORY" --preview review-preview.html)
          python -B scripts/football_jc_review_push.py "${args[@]}"
          if [ "$archive" = "$refreshed" ]; then
            gh release upload "$tag" "$refreshed"
          fi
          python -B scripts/sports_postgame_slot.py football-review
          printf '{"review_day_beijing":"%s","scheduled_slot_beijing":"13:00","run_id":"%s"}\n' "$day" "$GITHUB_RUN_ID" > "$claim"
          # Release asset names are unique. Upload without clobber before calling PushPlus.
          gh release upload "$tag" "$claim"
          python -B scripts/football_jc_review_push.py "${args[@]}" --receipt "$receipt"
          gh release upload "$tag" "$receipt"
      - uses: actions/upload-artifact@v4
        if: (always()) && steps.runner_preparation.outputs.skip != 'true'
        with:
          name: football-review-1300-delivery
          path: |
            review-preview.html
            football-jc-review-latest-*-push-1300.accepted.json
            football-jc-review-latest-*-push-1300.failed.json
          if-no-files-found: ignore
          retention-days: 14
