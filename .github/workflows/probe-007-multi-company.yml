name: One-shot audit 007 basketball company IDs from the working Crown feed
on:
  push:
    branches: [main]
    paths: ['ops/probe-007-multi-20261030.txt']
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Probe dated company IDs with public robots check and validate distinct quotes
        run: |
          python3 - <<'PY'
          import sys,hashlib,urllib.parse,time,json,re
          sys.path.insert(0,"scripts")
          from titan007_join_daily import public_get
          from titan007_join_beijing_verified import market_entries
          day='2026-10-31'
          for cid in [3,1,2,8,9,10,19,20,24,31,30,49]:
            url="https://bf.titan007.com/nba_Oddsdata.aspx?"+urllib.parse.urlencode({"date":day,"id":str(cid),"h":"12","m":"00"})
            try:
              raw=public_get(url,limit=250000)
              obj,reject=market_entries(raw)
              first={g:(m["full_spread"]["current"]["line"],m["full_total"]["current"]["line"])
                for g,m in obj.items() if g in ("728165","728166","728167")}
              if cid==30:
                import xml.etree.ElementTree as ET
                sample=[(n.text or "")[:120] for n in ET.fromstring(raw).findall(".//match/m") if (n.text or "").startswith("728165,")]
                print("007_CHINA_LOTTERY_RAW_ROW",sample[:2],flush=True)
              print("007_CANDIDATE",json.dumps({"id":cid,"rows":len(obj),"digest":hashlib.sha256(raw).hexdigest()[:12],
               "matched":first,"reject":reject},ensure_ascii=False),flush=True)
            except Exception as exc:
              print("007_CANDIDATE_ERROR",cid,type(exc).__name__,str(exc)[:120],flush=True)
            time.sleep(.3)
          url="https://m.titan007.com/lq/handicap/728852.htm"
          try:
            raw=public_get(url,limit=180000).decode("utf-8","replace")
            m=re.findall(r'<tr\\b[^>]*>.*?</tr>',raw,re.S|re.I)
            print("007_REFERENCE_PAGE",len(raw),"rows",len(m),"showDetail_sample",re.findall(r'showDetail\\([^)]{1,110}\\)',raw)[:15],flush=True)
            for row in m[:22]:
              cell=re.sub("<[^>]*>"," ",row);cell=re.sub(r"\\s+"," ",cell).strip()
              print("007_COMPANY_ROW",cell[:90],"click",re.search(r'showDetail\\([^)]*\\)',row).group(0) if re.search(r'showDetail\\([^)]*\\)',row) else "none",flush=True)
          except Exception as e:print("007_REFERENCE_ERROR",type(e).__name__,str(e)[:120],flush=True)
          PY

      - name: Probe three 007 Jingcai basketball pages and public data references
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,urllib.robotparser,urllib.parse,re,json,html
          root="https://cp.titan007.com"
          ua="NBA-007-Jingcai-Research/1.0"
          rp=urllib.robotparser.RobotFileParser()
          try:
            req=urllib.request.Request(root+"/robots.txt",headers={"User-Agent":ua})
            with urllib.request.urlopen(req,timeout=13) as res:
              robots=res.read(90000).decode("utf-8","replace")
            rp.parse(robots.splitlines())
            print("JC_ROBOTS", "FETCH_OK",len(robots))
          except urllib.error.HTTPError as ex:
            print("JC_ROBOTS_HTTP",ex.code)
            if ex.code in (404,410):rp.parse([])
            else:raise
          for tid in (111,112,114):
            url=root+"/buy/JingCaiBasket.aspx?"+urllib.parse.urlencode({"TypeID":str(tid),"OddsType":"2"})
            if not rp.can_fetch(ua,url):
              print("JC_PAGE_BLOCKED_BY_ROBOTS",tid)
              continue
            try:
              req=urllib.request.Request(url,headers={"User-Agent":ua,"Accept":"text/html,*/*;q=0.8"})
              with urllib.request.urlopen(req,timeout=20) as res:
                buf=res.read(350001)
                typ=res.headers.get("Content-Type","")
                status=res.status
              if len(buf)>350000:
                print("JC_PAGE_TOO_LARGE",tid)
                continue
              candidates=[buf.decode(k,"replace") for k in ("utf-8","gb18030")]
              body=max(candidates,key=lambda x:sum(w in x for w in ("让分","大小","胜负","篮","竞彩","NBA")))
              text=re.sub(r"(?is)<script.*?</script>|<style.*?</style>"," ",body)
              text=html.unescape(re.sub(r"(?s)<[^>]*>"," ",text))
              text=re.sub(r"\\s+"," ",text).strip()
              scripts=re.findall(r"(?i)<script[^>]+src=[\\\"']([^\\\"']+)",body)
              links=re.findall(r"(?i)(?:ajax|\.ashx|\.aspx|\.json|\.js)[^\\\"'<> ]{0,90}",body)
              print("JC_PAGE",json.dumps({"type":tid,"status":status,"bytes":len(buf),"content_type":typ,
                "tables":len(re.findall(r"(?i)<table\\b",body)),
                "rows":len(re.findall(r"(?i)<tr\\b",body)),
                "text_start":text[:600],"scripts":scripts[:22],"possible_endpoints":links[:18]},ensure_ascii=False),flush=True)
            except Exception as ex:
              print("JC_PAGE_ERROR",tid,type(ex).__name__,str(ex)[:180],flush=True)
          PY
