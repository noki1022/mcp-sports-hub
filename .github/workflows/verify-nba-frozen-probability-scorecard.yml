name: Verify locked NBA model scoring Brier logloss without odds
on:
  pull_request:
    branches: [main]
    paths:
      - 'analysis/nba_frozen_probability_scorecard.py'
      - 'analysis/nba_model_report.py'
      - '.github/workflows/nba-two-market-nightly-2200.yml'
      - '.github/workflows/verify-nba-frozen-probability-scorecard.yml'
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python3 -m py_compile analysis/nba_frozen_probability_scorecard.py analysis/nba_model_report.py
          python3 analysis/nba_frozen_probability_scorecard.py --self-test
          python3 - <<'PY'
          from pathlib import Path
          a=Path("analysis/nba_model_report.py").read_text()
          b=Path(".github/workflows/nba-two-market-nightly-2200.yml").read_text()
          assert '"nba_game_id": game.get("nba_game_id")' in a
          assert '--scores nba_final_review_scores.json' in b
          assert '--out "reports/five-market-settled/$REVIEW_DAY/independent_model_scorecard.json"' in b
          assert "env.RUN_REPORT == 'true'" in b
          print("NBA_FROZEN_SCORECARD_FINAL_GATE_WIRING_PASS")
          PY
