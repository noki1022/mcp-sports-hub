name: Verify Beijing NBA delivery watchdog and hourly idempotency
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/nba_delivery_health.py'
      - 'scripts/nba_delivery_recovery.py'
      - '.github/workflows/nba-delivery-health-watchdog.yml'
      - '.github/workflows/titan007-final-hourly.yml'
      - '.github/workflows/verify-nba-delivery-health.yml'
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify read-only acceptance audit with no send or dispatch
        run: |
          python3 -m py_compile scripts/nba_delivery_health.py
          python3 scripts/nba_delivery_health.py --self-test
          python3 -m pip install --quiet PyYAML==6.0.2
          python3 scripts/validate_nba_schedules.py
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          w=Path('.github/workflows/nba-delivery-health-watchdog.yml')
          s=w.read_text()
          assert 'contents: read' in s
          assert 'actions: write' not in s
          assert 'PUSHPLUS_TOKEN' not in s
          assert '--send' not in s and 'nba_delivery_recovery.py' not in s
          assert '  schedule:' not in s
          assert not Path('scripts/nba_delivery_recovery.py').exists()
          assert not Path('scripts/nba_schedule_fallback_push.py').exists()
          doc=yaml.safe_load(s)
          assert doc['jobs']
          for job in doc['jobs'].values():
              for step in job['steps']:
                  assert bool('run' in step)!=bool('uses' in step)
          print('READ_ONLY_DELIVERY_MONITOR_NO_RESEND_PASS')
          PY
