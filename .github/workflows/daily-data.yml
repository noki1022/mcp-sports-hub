name: Daily basketball data
on:
  workflow_dispatch:
  schedule:
    # 22:00 Beijing opening-window capture and 05:30 pregame-window capture.
    - cron: '0 14 * * *'
    - cron: '30 21 * * *'
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run collectors when credentials are configured
        env:
          APIZERO_API_KEY: ${{ secrets.APIZERO_API_KEY }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          ODD: ${{ secrets.ODD }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python scripts/collect_daily.py
          latest=$(find data/odds -maxdepth 1 -name "*_the_odds_api.json" -type f | sort | tail -1)
          if [ -n "$latest" ]; then
            python analysis/historical_odds_validator.py --infile "$latest" --outfile "${latest%.json}_validated.json"
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/odds
          git diff --cached --quiet || git commit -m "Save daily NBA odds snapshot"
          git push
