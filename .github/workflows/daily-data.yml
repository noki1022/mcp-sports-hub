name: Daily basketball data
on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *'
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run collectors when credentials are configured
        env:
          APIZERO_API_KEY: ${{ secrets.APIZERO_API_KEY }}
          ODD: ${{ secrets.ODD }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python scripts/collect_daily.py || echo "Collector not enabled: credentials or endpoint not configured"
