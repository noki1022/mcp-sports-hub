name: Verify retired NBA 21:30 automatic report disabled
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/nba-priority-2130.yml'
      - '.github/workflows/titan007-three-analysis.yml'
      - 'scripts/validate_nba_schedules.py'
      - '.github/workflows/verify-nba-priority-2130.yml'
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No automatic 21:30 report; single 21:00 canonical scoring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old=Path('.github/workflows/nba-priority-2130.yml').read_text()
          hourly=Path('.github/workflows/titan007-three-analysis.yml').read_text()
          score=Path('analysis/nba_final_review_gate.py').read_text()
          assert '  schedule:' not in old
          assert '- cron: "0 13 * * *"' in hourly
          assert '- cron: "30 13 * * *"' not in hourly
          assert '"2100"/"nba_five_market_forecast.json"' in score
          print('NBA_2130_DISABLED_2100_ONLY_PASS')
          PY
