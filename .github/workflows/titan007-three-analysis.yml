name: Titan007 daily three analysis before lottery cutoff
on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Next-day Beijing tipoff date YYYY-MM-DD; default is tomorrow in Asia/Shanghai"
        required: false
        type: string
  schedule:
    # 12:00, 14:00, 15:00, 18:00, 21:00 Beijing; 06:00 removed.
    - cron: "0 4 * * *"
    # Retry opportunities when GitHub drops/delays the 12:00 scheduled event.
    - cron: "15 4 * * *"
    - cron: "30 4 * * *"
    # Beijing 14:00 full-board report, plus delayed recovery triggers.
    - cron: "0 6 * * *"
    - cron: "15 6 * * *"
    - cron: "30 6 * * *"
    # Full-board dynamic market and model reviews: 15:00/18:00 Beijing, recover at :15/:30.
    - cron: "0 7 * * *"
    - cron: "15 7 * * *"
    - cron: "30 7 * * *"
    - cron: "0 10 * * *"
    - cron: "15 10 * * *"
    - cron: "30 10 * * *"
    - cron: "0 13 * * *"
permissions:
  contents: write
concurrency:
  group: titan007-three-analysis-${{ github.ref }}
  cancel-in-progress: false
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      REQUESTED_DATE: ${{ inputs.target_date || '' }}
      SCHEDULE_EXPR: ${{ github.event.schedule || '' }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked NBA numerical dependency
        run: python3 -m pip install --disable-pip-version-check --quiet "numpy==2.2.6"
      - name: Select next-day display date
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import os,re
          from datetime import datetime,timedelta
          from zoneinfo import ZoneInfo
          x=os.environ.get('REQUESTED_DATE','').strip()
          if x:
              if not re.fullmatch(r'\d{4}-\d{2}-\d{2}',x): raise ValueError('invalid target date')
              target=x
          else:
              target=(datetime.now(ZoneInfo('Asia/Shanghai')).date()+timedelta(days=1)).isoformat()
          print('TARGET_DATE='+target)
          PY
      - name: Join independent UTC fixture to 007 dated NBA markets
        run: |
          for attempt in 1 2 3; do
            if python3 scripts/titan007_join_beijing_verified.py --date "$TARGET_DATE" --out titan007_three_joined.json; then exit 0; fi
            sleep 8
          done
          exit 1
      - name: Lock the noon official NBA slate or enforce the locked cohort
        run: |
          git pull --ff-only origin main
          mkdir -p "reports/noon-cohorts/$TARGET_DATE"
          if [ "$SCHEDULE_EXPR" = "0 4 * * *" ] || [ "$SCHEDULE_EXPR" = "15 4 * * *" ] || [ "$SCHEDULE_EXPR" = "30 4 * * *" ]; then
            python3 scripts/nba_noon_slate.py freeze --joined titan007_three_joined.json --out "reports/noon-cohorts/$TARGET_DATE/1200.json"
            git add "reports/noon-cohorts/$TARGET_DATE/1200.json"
            if ! git diff --cached --quiet; then
              git config user.name github-actions[bot]
              git config user.email 41898282+github-actions[bot]@users.noreply.github.com
              git commit -m "Freeze next-day official NBA slate at noon"
              for i in 1 2 3; do
                if git push origin HEAD:main; then break; fi
                git pull --rebase origin main
                if [ "$i" -eq 3 ]; then exit 1; fi
              done
            fi
          else
            if [ ! -f "reports/noon-cohorts/$TARGET_DATE/1200.json" ]; then
              archive="reports/daily/$TARGET_DATE/1200/titan007_three_joined.json"
              if [ ! -f "$archive" ]; then
                echo "NO_NOON_ARCHIVE_FOR_RECOVERY" >&2
                exit 1
              fi
              python3 scripts/nba_noon_slate.py recover --joined titan007_three_joined.json --archive "$archive" --out "reports/noon-cohorts/$TARGET_DATE/1200.json"
              git add "reports/noon-cohorts/$TARGET_DATE/1200.json"
              git config user.name github-actions[bot]
              git config user.email 41898282+github-actions[bot]@users.noreply.github.com
              git commit -m "Recover verified archived noon cohort $TARGET_DATE"
              for i in 1 2 3; do
                if git push origin HEAD:main; then break; fi
                git pull --rebase origin main
                if [ "$i" -eq 3 ]; then exit 1; fi
              done
            fi
            python3 scripts/nba_noon_slate.py enforce --joined titan007_three_joined.json --lock "reports/noon-cohorts/$TARGET_DATE/1200.json" --out nba_same_slate.json
          fi

        run: |
          python3 - <<'PY'
          import json,os
          from datetime import datetime
          from pathlib import Path
          d=json.loads(Path('titan007_three_joined.json').read_text())
          target=os.environ['TARGET_DATE']
          assert d['requested_display_date']==target
          assert d['date_standard']=='Asia/Shanghai derived from UTC start'
          assert len({g['nba_game_id'] for g in d['nba_cba_games']})==len(d['nba_cba_games'])
          for game in d['nba_cba_games']:
            assert datetime.fromisoformat(game['start_time_beijing']).date().isoformat()==target
            assert game['display_date']==target
            assert game['game_id'].isdigit()
          if not d['nba_cba_games']:
            raise RuntimeError('SCHEDULE_RETRIEVED_BUT_NO_VERIFIED_007_MARKETS')
          print('BEIJING_MARKETS_ACCEPTED',len(d['nba_cba_games']),
                'MISSING',d['nba_markets_missing'])
          PY
      - name: Generate odds-blind NBA prediction artifact
        run: |
          python3 analysis/nba_prediction_adapter.py --self-test
          python3 analysis/nba_prediction_adapter.py --joined titan007_three_joined.json --out nba_independent_predictions_gate.json
      - name: Collect official injury status, fail closed if unavailable
        run: |
          python3 -m pip install --disable-pip-version-check --quiet "pdfplumber==0.11.7"
          python3 analysis/nba_official_injury.py --date "$TARGET_DATE" --out nba_official_injuries.json || echo "OFFICIAL_INJURY_UNAVAILABLE_NO_INFERRED_HEALTH"
          python3 analysis/nba_injury_context.py --joined titan007_three_joined.json --injuries nba_official_injuries.json --out nba_injury_context.json
      - name: Render mobile report and market analysis
        run: |
          python3 scripts/titan007_report.py --joined titan007_three_joined.json --html titan007_three_report.html --csv titan007_three_report.csv
          python3 analysis/titan007_daily_market.py --joined titan007_three_joined.json --out titan007_three_market.json
          python3 analysis/market_decision_gate.py --market titan007_three_market.json --predictions nba_independent_predictions_gate.json --out titan007_three_decision.json
          python3 analysis/market_value_policy.py --self-test
          python3 analysis/market_value_policy.py --market-decision titan007_three_decision.json --out market_value_policy.json
          python3 analysis/nba_model_report.py --joined titan007_three_joined.json --predictions nba_independent_predictions_gate.json --out-json nba_model_analysis.json --out-html nba_model_analysis.html --injury-context nba_injury_context.json
          python3 analysis/market_movement_tracker.py --current titan007_three_joined.json --history-root reports/daily/$TARGET_DATE --out titan007_three_movement.json
      - name: Capture full-board point-in-time snapshot and compare prior slots
        run: |
          git pull --ff-only origin main
          python3 analysis/titan007_hourly_history.py capture --current titan007_three_joined.json --root reports/hourly --daily-root reports/daily --out-movement titan007_slot_movement.json
          python3 analysis/nba_hourly_dynamic_review.py --movement titan007_slot_movement.json --model nba_model_analysis.json --injury nba_injury_context.json --out nba_slot_dynamic_review.json
      - name: Enforce analyzed same-capture market and independent model
        run: |
          python3 scripts/verify_nba_capture_analysis.py --joined titan007_three_joined.json --movement titan007_slot_movement.json --model nba_model_analysis.json --dynamic nba_slot_dynamic_review.json --out nba_capture_audit.json
      - name: Publish point-in-time snapshots for next run
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/hourly/
          if ! git diff --cached --quiet; then
            git commit -m "Save fixed-slot NBA market snapshots $TARGET_DATE"
            for n in 1 2 3; do
              if git push; then exit 0; fi
              git pull --rebase origin main
            done
            exit 1
          fi
      - name: Audit market B and fusion C without directional assumptions
        run: |
          python3 analysis/nba_market_bc_diagnostics.py --joined titan007_three_joined.json --movement titan007_slot_movement.json --model nba_model_analysis.json --out nba_market_bc_diagnostics.json
      - name: Resolve canonical report slot and check already sent
        id: dedup
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          expr=os.environ.get('SCHEDULE_EXPR','')
          slots={'0 4 * * *':'1200',
                 '15 4 * * *':'1200','30 4 * * *':'1200',
                 '0 6 * * *':'1400','15 6 * * *':'1400','30 6 * * *':'1400',
                 '0 7 * * *':'1500','15 7 * * *':'1500','30 7 * * *':'1500',
                 '0 10 * * *':'1800','15 10 * * *':'1800','30 10 * * *':'1800',
                 '0 13 * * *':'2100'}
          if expr and expr not in slots: raise RuntimeError('UNKNOWN_SCHEDULE')
          slot=slots.get(expr) or datetime.now(ZoneInfo('Asia/Shanghai')).strftime('%H%M')
          print('REPORT_SLOT='+slot)
          PY
          git pull --ff-only origin main
          marker="reports/pushplus-sent/${TARGET_DATE}/${REPORT_SLOT}.json"
          if test -f "$marker"; then
            echo "ALREADY_SENT_FOR_SLOT $marker"
            echo "REPORT_ALREADY_SENT=true" >> "$GITHUB_ENV"
          else
            echo "REPORT_ALREADY_SENT=false" >> "$GITHUB_ENV"
          fi
      - name: Archive analysis in repository
        if: ${{ success() && env.REPORT_ALREADY_SENT != 'true' }}
        run: |
          count=$(python3 -c "import json; print(len(json.load(open('titan007_three_joined.json')).get('nba_cba_games',[])))")
          if [ "$count" -gt 0 ]; then
            dir="reports/daily/${TARGET_DATE}/${REPORT_SLOT}"
            mkdir -p "$dir"
            cp titan007_three_joined.json titan007_three_report.html titan007_three_report.csv titan007_three_market.json titan007_three_decision.json titan007_three_movement.json "$dir"/
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add "$dir"
            git diff --cached --quiet || { git commit -m "Archive Titan007 analysis ${TARGET_DATE} ${REPORT_SLOT}" && git push; }
          else
            echo "NO_MATCHED_GAMES_SKIP_ARCHIVE"
          fi
      - name: Send compact iPhone PushPlus three-times-daily model report
        if: ${{ success() && env.REPORT_ALREADY_SENT != 'true' }}
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          python3 scripts/pushplus_mobile.py --mode three --joined titan007_three_joined.json --model nba_model_analysis.json --movement titan007_slot_movement.json --dynamic nba_slot_dynamic_review.json --preview pushplus_mobile_preview.html --status pushplus_status.json --send --require-token
      - name: Save confirmed accepted notification slot
        if: ${{ success() && env.REPORT_ALREADY_SENT != 'true' }}
        run: |
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          p=Path('pushplus_status.json')
          if not p.exists():raise RuntimeError('MISSING_DELIVERY_STATUS')
          status=json.loads(p.read_text())
          if status.get('state')!='API_ACCEPTED_NOT_DEVICE_CONFIRMED':
              print('NOT_SENT_NO_DEDUP_MARKER',status.get('state'))
          else:
              output=Path('reports/pushplus-sent')/os.environ['TARGET_DATE']/(os.environ['REPORT_SLOT']+'.json')
              output.parent.mkdir(parents=True,exist_ok=True)
              output.write_text(json.dumps({'state':status['state'],'target_date':os.environ['TARGET_DATE'],
                  'slot':os.environ['REPORT_SLOT'],'run_id':os.environ['GITHUB_RUN_ID']})+'\n')
              print('PUSHPLUS_SLOT_MARKED',output)
          PY
          git add reports/pushplus-sent/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Mark PushPlus accepted ${TARGET_DATE} ${REPORT_SLOT}"
            for i in 1 2 3; do
              if git push; then exit 0; fi
              git pull --rebase origin main
            done
            exit 1
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan007-three-analysis-${{ env.TARGET_DATE }}
          path: |
            titan007_three_joined.json
            titan007_three_report.html
            titan007_three_report.csv
            titan007_three_market.json
            titan007_three_decision.json
            nba_independent_predictions_gate.json
            nba_model_analysis.json
            nba_capture_audit.json
            nba_market_bc_diagnostics.json
            nba_injury_context.json
            nba_official_injuries.json
            nba_model_analysis.html
            titan007_three_movement.json
            titan007_slot_movement.json
            nba_slot_dynamic_review.json
            pushplus_mobile_preview.html
            pushplus_status.json
          if-no-files-found: warn
          retention-days: 14
