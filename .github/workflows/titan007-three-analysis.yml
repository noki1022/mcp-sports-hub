name: Titan007 daily three analysis before lottery cutoff
on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Next-day display date YYYY-MM-DD; default is tomorrow in Asia/Shanghai"
        required: false
        type: string
  schedule:
    # 06:00, 12:00, 21:00 Asia/Shanghai, then hourly 21:30–06:30
    - cron: "0 22 * * *"
    - cron: "0 4 * * *"
    - cron: "0 13 * * *"
    - cron: "30 13 * * *"
    - cron: "30 14 * * *"
    - cron: "30 15 * * *"
    - cron: "30 16 * * *"
    - cron: "30 17 * * *"
    - cron: "30 18 * * *"
    - cron: "30 19 * * *"
    - cron: "30 20 * * *"
    - cron: "30 21 * * *"
    - cron: "30 22 * * *"
permissions:
  contents: write
concurrency:
  group: titan007-three-analysis-${{ github.ref }}
  cancel-in-progress: false
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      REQUESTED_DATE: ${{ inputs.target_date || '' }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Select next-day display date
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import os,re
          from datetime import datetime,timedelta
          from zoneinfo import ZoneInfo
          x=os.environ.get('REQUESTED_DATE','').strip()
          if x:
              if not re.fullmatch(r'\d{4}-\d{2}-\d{2}',x): raise ValueError('invalid target date')
              target=x
          else:
              target=(datetime.now(ZoneInfo('Asia/Shanghai')).date()+timedelta(days=1)).isoformat()
          print('TARGET_DATE='+target)
          PY
      - name: Fetch next-day 007 schedule and markets
        run: |
          for attempt in 1 2 3; do
            if python3 scripts/titan007_join_daily.py --date "$TARGET_DATE" --out titan007_three_joined.json; then exit 0; fi
            sleep 8
          done
          exit 1
      - name: Generate odds-blind NBA prediction artifact
        run: |
          python3 analysis/nba_prediction_adapter.py --self-test
          python3 analysis/nba_prediction_adapter.py --joined titan007_three_joined.json --out nba_independent_predictions_gate.json
      - name: Render mobile report and market analysis
        run: |
          python3 scripts/titan007_report.py --joined titan007_three_joined.json --html titan007_three_report.html --csv titan007_three_report.csv
          python3 analysis/titan007_daily_market.py --joined titan007_three_joined.json --out titan007_three_market.json
          python3 analysis/market_decision_gate.py --market titan007_three_market.json --predictions nba_independent_predictions_gate.json --out titan007_three_decision.json
          python3 analysis/market_value_policy.py --self-test
          python3 analysis/market_value_policy.py --market-decision titan007_three_decision.json --out market_value_policy.json
          python3 analysis/nba_model_report.py --joined titan007_three_joined.json --predictions nba_independent_predictions_gate.json --out-json nba_model_analysis.json --out-html nba_model_analysis.html
          python3 analysis/market_movement_tracker.py --current titan007_three_joined.json --history-root reports/daily/$TARGET_DATE --out titan007_three_movement.json
      - name: Archive analysis in repository
        if: ${{ success() }}
        run: |
          count=$(python3 -c "import json; print(len(json.load(open('titan007_three_joined.json')).get('nba_cba_games',[])))")
          if [ "$count" -gt 0 ]; then
            slot=$(TZ=Asia/Shanghai date +%H%M)
            dir="reports/daily/${TARGET_DATE}/${slot}"
            mkdir -p "$dir"
            cp titan007_three_joined.json titan007_three_report.html titan007_three_report.csv titan007_three_market.json titan007_three_decision.json titan007_three_movement.json "$dir"/
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add "$dir"
            git commit -m "Archive Titan007 analysis ${TARGET_DATE} ${slot}"
            git push
          else
            echo "No NBA/CBA games; no repository archive commit"
          fi
      - name: Push this analysis to WeChat
        if: env.PUSHPLUS_TOKEN != ''
        run: |
          python3 - <<'PY'
          import json,os,urllib.parse,urllib.request
          from pathlib import Path
          board=json.loads(Path('titan007_three_joined.json').read_text())
          games=board.get('nba_cba_games',[])
          if not games: print('NO_NEXT_DAY_GAMES_NO_PUSH'); raise SystemExit(0)
          model=json.loads(Path('nba_model_analysis.json').read_text(encoding='utf-8'))
          by_game={str(x.get('game_id')):x for x in model.get('games',[])}
          rows=[]
          for g in games:
              m=by_game.get(str(g.get('game_id')), {})
              p=m.get('model_probability') or {}
              rows.append("\n".join([
                  f"【{g.get('display_clock','—')}】",
                  f"主队：{g.get('home_team','—')}",
                  f"客队：{g.get('away_team','—')}",
                  f"模型独赢：{p.get('home','—')} / {p.get('away','—')}",
                  f"模型分差（主−客）：{m.get('margin_mean_home_minus_away','—')}",
                  f"模型总分：{m.get('total_mean','—')}",
                  "盘口与模型：未同时通过盘口方向、时间戳和校准验证，NO_BET",
                  "数据质量："+str((m.get('data_quality') or {}).get('quality','NO_MODEL_DATA'))
              ]))
          content=f"目标日期：{board.get('requested_display_date')}\n\n"+'\n\n'.join(rows)
          data=urllib.parse.urlencode({'token':os.environ['PUSHPLUS_TOKEN'],'title':'NBA/CBA 次日模型分析（手机适配）','content':content,'template':'txt'}).encode()
          req=urllib.request.Request('https://www.pushplus.plus/send',data=data,method='POST')
          with urllib.request.urlopen(req,timeout=15) as r:
              body=r.read().decode('utf-8','replace')
              if r.status!=200 or '200' not in body: raise RuntimeError('PushPlus rejected request')
          print('PUSHPLUS_SENT',len(rows))
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan007-three-analysis-${{ env.TARGET_DATE }}
          path: |
            titan007_three_joined.json
            titan007_three_report.html
            titan007_three_report.csv
            titan007_three_market.json
            titan007_three_decision.json
            nba_independent_predictions_gate.json
            nba_model_analysis.json
            nba_model_analysis.html
            titan007_three_movement.json
          if-no-files-found: warn
          retention-days: 14
