name: Titan007 daily three analysis before lottery cutoff
on:
  workflow_dispatch:
    inputs:
      report_slot:
        description: "Canonical Beijing slot: 1200, 1400, 1500, 1800, 2100"
        required: false
        type: string
      target_date:
        description: "Next-day Beijing tipoff date YYYY-MM-DD; default is tomorrow in Asia/Shanghai"
        required: false
        type: string
  schedule:
    # 12:00, 14:00, 15:00, 18:00, 21:00 Beijing; 06:00 removed.
    - cron: "0 4 * * *"
    # Retry opportunities when GitHub drops/delays the 12:00 scheduled event.
    - cron: "15 4 * * *"
    - cron: "30 4 * * *"
    # Beijing 14:00 full-board report, plus delayed recovery triggers.
    - cron: "0 6 * * *"
    - cron: "15 6 * * *"
    - cron: "30 6 * * *"
    # Full-board dynamic market and model reviews: 15:00/18:00 Beijing, recover at :15/:30.
    - cron: "0 7 * * *"
    - cron: "15 7 * * *"
    - cron: "30 7 * * *"
    - cron: "0 10 * * *"
    - cron: "15 10 * * *"
    - cron: "30 10 * * *"
    - cron: "0 13 * * *"
permissions:
  contents: write
concurrency:
  group: titan007-three-analysis-${{ github.ref }}
  cancel-in-progress: false
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      REQUESTED_DATE: ${{ inputs.target_date || '' }}
      SCHEDULE_EXPR: ${{ github.event.schedule || '' }}
      EXTERNAL_REPORT_SLOT: ${{ inputs.report_slot || '' }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select next-day display date
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import os,re
          from datetime import datetime,timedelta
          from zoneinfo import ZoneInfo
          x=os.environ.get('REQUESTED_DATE','').strip()
          if x:
              if not re.fullmatch(r'\d{4}-\d{2}-\d{2}',x): raise ValueError('invalid target date')
              target=x
          else:
              target=(datetime.now(ZoneInfo('Asia/Shanghai')).date()+timedelta(days=1)).isoformat()
          print('TARGET_DATE='+target)
          PY
      - name: Preflight canonical slot and verified acceptance
        id: preflight
        run: |
          # Remote ledger is authoritative; completed retries must not refetch 007 or recalculate.
          git fetch --quiet origin main
          python3 scripts/nba_fixed_slot_gate.py --phase preflight
      - name: Install locked NBA numerical dependency
        if: steps.preflight.outputs.skip != 'true'
        run: python3 -m pip install --disable-pip-version-check --quiet "numpy==2.2.6"
      - name: Join independent UTC fixture to 007 dated NBA markets
        if: steps.preflight.outputs.skip != 'true'
        run: |
          git fetch --quiet origin main
          git pull --ff-only origin main
          fetched=false
          for attempt in 1 2 3; do
            if python3 scripts/titan007_join_beijing_verified.py --date "$TARGET_DATE" --out titan007_three_joined.json --allow-schedule-only; then
              fetched=true
              break
            fi
            sleep 8
          done
          if [ "$fetched" = true ]; then
            python3 scripts/nba_capture_recovery.py --joined titan007_three_joined.json --out titan007_three_recovered.json
          else
            python3 scripts/nba_capture_recovery.py --target "$TARGET_DATE" --out titan007_three_recovered.json
          fi
          mv titan007_three_recovered.json titan007_three_joined.json
          python3 - <<'PY'
          import json
          b=json.load(open('titan007_three_joined.json'))
          print('OFFICIAL_FIXTURE_RECOVERY',b['quote_recovery'])
          PY
      - name: Lock the noon official NBA slate or enforce the locked cohort
        if: steps.preflight.outputs.skip != 'true'
        run: |
          git pull --ff-only origin main
          mkdir -p "reports/noon-cohorts/$TARGET_DATE"
          if [ "$EXTERNAL_REPORT_SLOT" = "1200" ] || [ "$SCHEDULE_EXPR" = "0 4 * * *" ] || [ "$SCHEDULE_EXPR" = "15 4 * * *" ] || [ "$SCHEDULE_EXPR" = "30 4 * * *" ]; then
            if [ -f "reports/noon-cohorts/$TARGET_DATE/1200.json" ]; then
              echo "EXISTING_NOON_COHORT_RETAINED"
              python3 scripts/nba_noon_slate.py enforce --joined titan007_three_joined.json --lock "reports/noon-cohorts/$TARGET_DATE/1200.json" --out nba_same_slate.json
            elif python3 scripts/nba_noon_slate.py freeze --joined titan007_three_joined.json --out "reports/noon-cohorts/$TARGET_DATE/1200.json"; then
              echo "ON_TIME_NOON_COHORT"
            else
              echo "LATE_NOON_CAPTURE_RECORDED_AT_ACTUAL_TIME"
              python3 scripts/nba_noon_slate.py late-freeze --joined titan007_three_joined.json --out "reports/noon-cohorts/$TARGET_DATE/1200.json"
            fi
            git add "reports/noon-cohorts/$TARGET_DATE/1200.json"
            if ! git diff --cached --quiet; then
              git config user.name github-actions[bot]
              git config user.email 41898282+github-actions[bot]@users.noreply.github.com
              git commit -m "Freeze next-day official NBA slate at noon"
              for i in 1 2 3; do
                if git push origin HEAD:main; then break; fi
                git pull --rebase origin main
                if [ "$i" -eq 3 ]; then exit 1; fi
              done
            fi
          else
            if [ ! -f "reports/noon-cohorts/$TARGET_DATE/1200.json" ]; then
              archive="reports/daily/$TARGET_DATE/1200/titan007_three_joined.json"
              if [ -f "$archive" ]; then
                python3 scripts/nba_noon_slate.py recover --joined titan007_three_joined.json --archive "$archive" --out "reports/noon-cohorts/$TARGET_DATE/1200.json"
              else
                echo "NO_NOON_ARCHIVE_USE_ACTUAL_VERIFIED_PRETIP_CAPTURE"
                python3 scripts/nba_noon_slate.py late-freeze --joined titan007_three_joined.json --out "reports/noon-cohorts/$TARGET_DATE/1200.json"
                echo "RECOVERED_FROM_ACTUAL_LATE_CAPTURE=true" >> "$GITHUB_ENV"
              fi
              git add "reports/noon-cohorts/$TARGET_DATE/1200.json"
              git config user.name github-actions[bot]
              git config user.email 41898282+github-actions[bot]@users.noreply.github.com
              git commit -m "Recover verified archived noon cohort $TARGET_DATE"
              for i in 1 2 3; do
                if git push origin HEAD:main; then break; fi
                git pull --rebase origin main
                if [ "$i" -eq 3 ]; then exit 1; fi
              done
            fi
            anchor_args=()
            if [ "${RECOVERED_FROM_ACTUAL_LATE_CAPTURE:-false}" = "true" ]; then anchor_args=(--allow-anchor); fi
            python3 scripts/nba_noon_slate.py enforce --joined titan007_three_joined.json --lock "reports/noon-cohorts/$TARGET_DATE/1200.json" --out nba_same_slate.json "${anchor_args[@]}"
          fi
      - name: Enforce Beijing date identity and report market coverage
        if: steps.preflight.outputs.skip != 'true'
        run: |
          python3 - <<'PY'
          import json,os
          from datetime import datetime
          from pathlib import Path
          d=json.loads(Path('titan007_three_joined.json').read_text())
          target=os.environ['TARGET_DATE']
          assert d['requested_display_date']==target
          assert d['date_standard']=='Asia/Shanghai derived from UTC start'
          assert len({g['nba_game_id'] for g in d['nba_cba_games']})==len(d['nba_cba_games'])
          for game in d['nba_cba_games']:
            assert datetime.fromisoformat(game['start_time_beijing']).date().isoformat()==target
            assert game['display_date']==target
            assert game['game_id'].isdigit()
          if not d['nba_cba_games']:
            raise RuntimeError('SCHEDULE_RETRIEVED_BUT_NO_VERIFIED_007_MARKETS')
          print('BEIJING_MARKETS_ACCEPTED',len(d['nba_cba_games']),
                'MISSING',d['nba_markets_missing'])
          PY
      - name: Generate odds-blind NBA prediction artifact
        if: steps.preflight.outputs.skip != 'true'
        run: |
          python3 analysis/nba_prediction_adapter.py --joined titan007_three_joined.json --out nba_independent_predictions_gate.json
      - name: Collect official injury status, fail closed if unavailable
        if: steps.preflight.outputs.skip != 'true'
        run: |
          python3 -m pip install --disable-pip-version-check --quiet "pdfplumber==0.11.7"
          python3 analysis/nba_official_injury.py --date "$TARGET_DATE" --out nba_official_injuries.json || echo "OFFICIAL_INJURY_UNAVAILABLE_NO_INFERRED_HEALTH"
          python3 analysis/nba_injury_context.py --joined titan007_three_joined.json --injuries nba_official_injuries.json --out nba_injury_context.json
      - name: Render mobile report and market analysis
        if: steps.preflight.outputs.skip != 'true'
        run: |
          python3 scripts/titan007_report.py --joined titan007_three_joined.json --html titan007_three_report.html --csv titan007_three_report.csv
          python3 analysis/titan007_daily_market.py --joined titan007_three_joined.json --out titan007_three_market.json
          python3 analysis/market_decision_gate.py --market titan007_three_market.json --predictions nba_independent_predictions_gate.json --out titan007_three_decision.json
          python3 analysis/market_value_policy.py --market-decision titan007_three_decision.json --out market_value_policy.json
          python3 analysis/nba_model_report.py --joined titan007_three_joined.json --predictions nba_independent_predictions_gate.json --out-json nba_model_analysis.json --out-html nba_model_analysis.html --injury-context nba_injury_context.json
          python3 analysis/market_movement_tracker.py --current titan007_three_joined.json --history-root reports/daily/$TARGET_DATE --out titan007_three_movement.json
      - name: Capture full-board point-in-time snapshot and compare prior slots
        if: steps.preflight.outputs.skip != 'true'
        run: |
          git pull --ff-only origin main
          python3 analysis/titan007_hourly_history.py capture --current titan007_three_joined.json --root reports/hourly --daily-root reports/daily --out-movement titan007_slot_movement.json
          python3 analysis/nba_hourly_dynamic_review.py --movement titan007_slot_movement.json --model nba_model_analysis.json --injury nba_injury_context.json --out nba_slot_dynamic_review.json
      - name: Audit all three user-supplied Jingcai pricing sources before market fusion
        if: steps.preflight.outputs.skip != 'true'
        env:
          MARZDATA_APP_ID: ${{ secrets.MARZDATA_APP_ID }}
          MARZDATA_APP_SECRET: ${{ secrets.MARZDATA_APP_SECRET }}
          MARZDATA_STATIC_EGRESS_CONFIRMED: ${{ vars.MARZDATA_STATIC_EGRESS_CONFIRMED }}
          MARZDATA_SLOT_ORDER_CONFIRMED: ${{ vars.MARZDATA_SLOT_ORDER_CONFIRMED }}
        run: |
          # Authorized data remains disabled unless both secrets and approved fixed egress are set.
          # No credentials are ever written to artifacts or logs.
          python3 scripts/titan007_jingcai_three_market.py --joined titan007_three_joined.json --out nba_jingcai_three_market.json
          python3 - <<'PY'
          import json
          x=json.load(open("nba_jingcai_three_market.json"))
          assert set(x["source_status"])==set(("WIN_LOSE","HANDICAP_WIN_LOSE","TOTAL"))
          assert x["game_count"]==len(x["games"])
          print("JINGCAI_REQUIRED_SOURCE_AUDIT",x["status"],x["verified_games_with_all_three"])
          PY
      - name: Capture 007 visible top-ten companies and compare last stored sample
        if: steps.preflight.outputs.skip != 'true'
        run: |
          python3 scripts/titan007_top10_companies.py --joined titan007_three_joined.json --out nba_top10_companies.json --analysis nba_top10_comparison.json --history-root reports/top10
      - name: Persist top-ten institution snapshots for next scheduled comparison
        if: steps.preflight.outputs.skip != 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/top10/
          if ! git diff --cached --quiet; then
            git commit -m "Archive 007 top-ten company market capture $TARGET_DATE"
            for n in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              git pull --rebase origin main
              if [ "$n" -eq 3 ]; then exit 1; fi
            done
          fi
      - name: Freeze five independent Jingcai/Crown NBA research directions
        if: steps.preflight.outputs.skip != 'true'
        run: |
          python3 analysis/nba_five_markets.py \
            --joined titan007_three_joined.json \
            --model nba_model_analysis.json \
            --jingcai nba_jingcai_three_market.json \
            --top10 nba_top10_comparison.json \
            --out nba_five_market_forecast.json
          python3 analysis/nba_injury_prerequisite.py --five nba_five_market_forecast.json --injury nba_injury_context.json --model nba_model_analysis.json --out nba_five_market_forecast_gated.json
          mv nba_five_market_forecast_gated.json nba_five_market_forecast.json
          python3 - <<'PY'
          import json
          x=json.load(open("nba_five_market_forecast.json"))
          assert x["game_count"]>0 and len(x["market_keys"])==5
          assert all(set(g["markets"])==set(x["market_keys"]) for g in x["games"])
          print("FIVE_MARKET_SNAPSHOT_FROZEN",x["game_count"],x["ready_counts"])
          PY
      - name: P0 fail-closed five-market source and team identity integrity
        if: steps.preflight.outputs.skip != 'true'
        run: |
          python3 analysis/nba_five_market_integrity_gate.py --joined titan007_three_joined.json --five nba_five_market_forecast.json --jingcai nba_jingcai_three_market.json --out nba_five_market_integrity.json
      - name: Generate mandatory NBA spread and total research verdicts from ten institutions
        if: steps.preflight.outputs.skip != 'true'
        run: |
          python3 analysis/nba_two_market_forecast.py --joined titan007_three_joined.json --model nba_model_analysis.json --top10 nba_top10_comparison.json --out nba_two_market_forecast.json
      - name: Enforce seven-stage 007 NBA analysis SOP before PushPlus
        if: steps.preflight.outputs.skip != 'true'
        run: |
          python3 analysis/nba_analysis_sop.py \
            --joined titan007_three_joined.json \
            --model nba_model_analysis.json \
            --prediction-gate nba_independent_predictions_gate.json \
            --movement titan007_slot_movement.json \
            --jingcai nba_jingcai_three_market.json \
            --top10 nba_top10_comparison.json \
            --injury nba_injury_context.json \
            --out nba_analysis_sop.json
          python3 - <<'PY'
          import json
          x=json.load(open('nba_analysis_sop.json'))
          assert x['game_count']>0
          assert x['candidate_count']==0 and x['decision']=='NO_BET'
          assert all(v['recommendation']=='NO_BET' for v in x['games'])
          assert len(x['stages'])==7
          print('NBA_SOP_PRESEND_EVIDENCE_GATE_PASS',x['game_count'],x['verified_jingcai_ids'])
          PY
      - name: Enforce analyzed same-capture market and independent model
        if: steps.preflight.outputs.skip != 'true'
        run: |
          python3 scripts/verify_nba_capture_analysis.py --joined titan007_three_joined.json --movement titan007_slot_movement.json --model nba_model_analysis.json --dynamic nba_slot_dynamic_review.json --out nba_capture_audit.json
      - name: Publish point-in-time snapshots for next run
        if: steps.preflight.outputs.skip != 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/hourly/
          if ! git diff --cached --quiet; then
            git commit -m "Save fixed-slot NBA market snapshots $TARGET_DATE"
            for n in 1 2 3; do
              if git push; then exit 0; fi
              git pull --rebase origin main
            done
            exit 1
          fi
      - name: Audit market B and fusion C without directional assumptions
        if: steps.preflight.outputs.skip != 'true'
        run: |
          python3 analysis/nba_market_bc_diagnostics.py --joined titan007_three_joined.json --movement titan007_slot_movement.json --model nba_model_analysis.json --out nba_market_bc_diagnostics.json
      - name: Recheck verified acceptance before PushPlus
        id: recheck
        if: steps.preflight.outputs.skip != 'true'
        run: |
          git fetch --quiet origin main
          python3 scripts/nba_fixed_slot_gate.py --phase recheck
      - name: Archive analysis in repository
        if: ${{ success() && env.REPORT_ALREADY_SENT != 'true' }}
        run: |
          count=$(python3 -c "import json; print(len(json.load(open('titan007_three_joined.json')).get('nba_cba_games',[])))")
          if [ "$count" -gt 0 ]; then
            dir="reports/daily/${TARGET_DATE}/${REPORT_SLOT}"
            mkdir -p "$dir"
            cp titan007_three_joined.json titan007_three_report.html titan007_three_report.csv titan007_three_market.json titan007_three_decision.json titan007_three_movement.json nba_two_market_forecast.json nba_five_market_forecast.json "$dir"/
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add "$dir"
            git diff --cached --quiet || { git commit -m "Archive Titan007 analysis ${TARGET_DATE} ${REPORT_SLOT}" && git push; }
          else
            echo "NO_MATCHED_GAMES_SKIP_ARCHIVE"
          fi
      - name: Validate cross-artifact delivery contract before PushPlus
        if: ${{ success() && env.REPORT_ALREADY_SENT != 'true' }}
        run: |
          python3 scripts/nba_delivery_contract.py \
            --joined titan007_three_joined.json \
            --movement titan007_slot_movement.json \
            --dynamic nba_slot_dynamic_review.json \
            --five nba_five_market_forecast.json
      - name: Send compact iPhone PushPlus three-times-daily model report
        if: ${{ success() && env.REPORT_ALREADY_SENT != 'true' }}
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          python3 scripts/pushplus_mobile.py --mode three --joined titan007_three_joined.json --model nba_model_analysis.json --movement titan007_slot_movement.json --dynamic nba_slot_dynamic_review.json --top10 nba_top10_comparison.json --jingcai nba_jingcai_three_market.json --verdict nba_two_market_forecast.json --sop nba_analysis_sop.json --five nba_five_market_forecast.json --preview pushplus_mobile_preview.html --status pushplus_status.json --send --require-token --require-delivery
      - name: Save confirmed accepted notification slot
        if: ${{ success() && env.REPORT_ALREADY_SENT != 'true' }}
        run: |
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          p=Path('pushplus_status.json')
          if not p.exists():raise RuntimeError('MISSING_DELIVERY_STATUS')
          status=json.loads(p.read_text())
          if status.get('state')!='API_ACCEPTED_NOT_DEVICE_CONFIRMED':
              print('NOT_SENT_NO_DEDUP_MARKER',status.get('state'))
          else:
              output=Path('reports/pushplus-sent')/os.environ['TARGET_DATE']/(os.environ['REPORT_SLOT']+'.json')
              output.parent.mkdir(parents=True,exist_ok=True)
              from hashlib import sha256
              preview=Path('pushplus_mobile_preview.html')
              if not preview.is_file():raise RuntimeError('PUSHPLUS_SENT_BUT_NO_ARCHIVED_PREVIEW')
              output.write_text(json.dumps({'state':status['state'],'target_date':os.environ['TARGET_DATE'],
                  'slot':os.environ['REPORT_SLOT'],'run_id':os.environ['GITHUB_RUN_ID'],
                  'message_id':status.get('message_id'),'games_considered':status.get('games_considered'),
                  'preview_sha256':sha256(preview.read_bytes()).hexdigest()})+'\n')
              print('PUSHPLUS_SLOT_MARKED',output)
          PY
          git add reports/pushplus-sent/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Mark PushPlus accepted ${TARGET_DATE} ${REPORT_SLOT}"
            for i in 1 2 3; do
              if git push; then exit 0; fi
              git pull --rebase origin main
            done
            exit 1
          fi
      - name: Failsafe verified NBA schedule PushPlus when full report fails
        if: ${{ failure() && steps.preflight.outcome == 'success' && steps.recheck.outcome != 'failure' }}
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          FALLBACK_SLOT="${REPORT_SLOT:-}"
          case "$FALLBACK_SLOT" in
            1200|1400|1500|1800|2100) ;;
            *) echo "FALLBACK_UNKNOWN_SLOT" >&2; exit 1 ;;
          esac
          git fetch --quiet origin main
          python3 scripts/nba_fixed_slot_gate.py --phase recheck >> /tmp/fallback_gate_status
          if grep -q 'API_ALREADY_ACCEPTED' /tmp/fallback_gate_status; then
            echo "Full report already accepted; suppress fallback"
            exit 0
          fi
          python3 scripts/nba_schedule_fallback_push.py --target "$TARGET_DATE" --slot "$FALLBACK_SLOT"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/schedule-fallback-sent/
          if ! git diff --cached --quiet; then
            git commit -m "Record verified NBA schedule fallback PushPlus acceptance"
            for n in 1 2 3; do
              if git push origin HEAD:main; then exit 0; fi
              git pull --rebase origin main
            done
            exit 1
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan007-three-analysis-${{ env.TARGET_DATE }}
          path: |
            titan007_three_joined.json
            titan007_three_report.html
            titan007_three_report.csv
            titan007_three_market.json
            titan007_three_decision.json
            nba_independent_predictions_gate.json
            nba_model_analysis.json
            nba_top10_companies.json
            nba_top10_comparison.json
            nba_jingcai_three_market.json
            nba_two_market_forecast.json
            nba_capture_audit.json
            nba_market_bc_diagnostics.json
            nba_injury_context.json
            nba_official_injuries.json
            nba_model_analysis.html
            titan007_three_movement.json
            titan007_slot_movement.json
            nba_slot_dynamic_review.json
            pushplus_mobile_preview.html
            pushplus_status.json
            schedule_fallback_status.json
          if-no-files-found: warn
          retention-days: 14
