name: Verify NBA 007 extreme probability disagreement warning
on:
  pull_request:
    branches: [main]
    paths:
      - 'analysis/nba_model_report.py'
      - 'scripts/pushplus_mobile_v2.py'
      - '.github/workflows/verify-nba-extreme-probability-audit.yml'
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python3 -m py_compile analysis/nba_model_report.py scripts/pushplus_mobile_v2.py
          python3 scripts/pushplus_mobile.py --mode three --self-test
          python3 analysis/nba_model_report.py --self-test
