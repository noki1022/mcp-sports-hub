name: NBA official-final-triggered five-market postgame review
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.cloudflare_slot_utc != '' && format('Cloudflare | slot={0}', inputs.cloudflare_slot_utc) || github.workflow }}
on:
  pull_request:
    paths:
      - '.github/workflows/nba-two-market-nightly-2200.yml'
      - 'scheduler/**'
      - 'analysis/nba_final_review_gate.py'
  workflow_dispatch:
    inputs:
      cloudflare_slot_utc:
        description: 'Original Cloudflare cron timestamp in UTC'
        required: false
        type: string
  schedule:
    # Check for official finals on the existing postgame ticks.
    - cron: "25,50 * * * *"
permissions:
  contents: write
jobs:
  verify-frozen-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Rehearse the missed review against the original 21:00 forecast
        run: |
          python3 -B analysis/nba_final_review_gate.py --self-test
          python3 -B analysis/nba_final_review_gate.py --day 2026-11-09
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          doc=json.loads(Path("nba_final_review_readiness.json").read_text())
          assert doc["state"]=="READY_ALL_FINAL", doc
          assert doc["source"]=="reports/daily/2026-11-09/2100/nba_five_market_forecast.json", doc
          frozen=json.loads(Path(doc["source"]).read_text())
          capture=datetime.fromisoformat(frozen["board_capture_utc"]).astimezone(ZoneInfo("Asia/Shanghai"))
          assert frozen["target_date"]=="2026-11-09" and capture.date().isoformat()=="2026-11-08"
          PY
          python3 -B analysis/nba_five_market_settlement.py \
            --forecast reports/daily/2026-11-09/2100/nba_five_market_forecast.json \
            --day 2026-11-09 --scores nba_final_review_scores.json --out nba-review-preview.json
          python3 -B analysis/nba_five_market_review_push.py --settlement nba-review-preview.json \
            --preview nba-review-preview.html --status nba-review-preview-status.json
      - uses: actions/upload-artifact@v4
        with:
          name: nba-original-2100-review-preview
          path: nba-review-preview.html

  settle-and-notify:
    env:
      CLOUDFLARE_SLOT_UTC: ${{ inputs.cloudflare_slot_utc }}
      POSTGAME_CRON: ${{ github.event.schedule }}
    concurrency:
      group: nba-five-market-review-2200
      cancel-in-progress: false
    if: github.ref == 'refs/heads/main' && github.run_attempt == '1' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.cloudflare_slot_utc != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate original scheduler slot
        run: python -B scripts/sports_postgame_slot.py nba-review
      - name: Check last frozen game has official Final before review
        run: |
          git pull --ff-only origin main
          day="$(TZ=Asia/Shanghai date +%F)"
          python3 analysis/nba_final_review_gate.py --day "$day" --include-pending --github-env "$GITHUB_ENV" \
            --status-out nba_final_review_readiness.json \
            --scores-out nba_final_review_scores.json
      - name: Record the active cohort while official finals are pending
        if: env.NBA_REVIEW_WAITING_DAY != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          day="$NBA_REVIEW_WAITING_DAY"
          marker="reports/five-market-settled/$day/awaiting-finals.json"
          if [ ! -f "$marker" ]; then
            evidence="$(printf '{"review_day_beijing":"%s","run_id":"%s"}\n' "$day" "$GITHUB_RUN_ID" | base64 -w0)"
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$marker" \
              --silent --field branch=main --field message="Track pending NBA finals $day" \
              --field content="$evidence"
          fi
      - name: Settle five locked directions against official completed NBA scores
        if: env.RUN_REPORT == 'true'
        run: |
          mkdir -p "reports/five-market-settled/$REVIEW_DAY"
          python3 analysis/nba_five_market_settlement.py --self-test
          python3 analysis/nba_five_market_settlement.py --forecast "$FROZEN_FORECAST" --day "$REVIEW_DAY" \
            --scores nba_final_review_scores.json --out "reports/five-market-settled/$REVIEW_DAY/settlement.json"
      - name: Send one iPhone five-market review
        if: env.RUN_REPORT == 'true'
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="reports/five-market-settled/$REVIEW_DAY"
          test -n "$PUSHPLUS_TOKEN"
          python3 analysis/nba_five_market_review_push.py --settlement "$dir/settlement.json" \
            --preview "$dir/report.html" --status nba-review-preview-status.json
          python -B scripts/sports_postgame_slot.py nba-review
          # A create-only Contents API write is atomic across both trigger sources.
          claim="$(printf '{"review_day_beijing":"%s","run_id":"%s"}\n' "$REVIEW_DAY" "$GITHUB_RUN_ID" | base64 -w0)"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$dir/push.claim.json" \
            --silent --field branch=main --field message="Claim NBA review delivery $REVIEW_DAY" \
            --field content="$claim"
          python -B scripts/sports_postgame_slot.py nba-review
          python3 analysis/nba_five_market_review_push.py --settlement "$dir/settlement.json" \
            --preview "$dir/report.html" --status "$dir/2200.json" --send
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=os.environ["REVIEW_DAY"]
          p=Path("reports/five-market-settled")/d/"2200.json"
          assert json.loads(p.read_text())["state"]=="API_ACCEPTED_NOT_DEVICE_CONFIRMED"
          PY
      - name: Replay chronological five-market shadow probabilities against official finals
        if: env.RUN_REPORT == 'true'
        continue-on-error: true
        run: |
          python3 analysis/nba_dynamic_five_market_replay.py \
            --daily-root reports/daily \
            --settled-root reports/five-market-settled \
            --out "reports/five-market-settled/$REVIEW_DAY/dynamic_probability_scorecard.json"
          python3 - <<'PY'
          import json
          p="reports/five-market-settled/"+__import__("os").environ["REVIEW_DAY"]+"/dynamic_probability_scorecard.json"
          x=json.load(open(p))
          assert x["production_model_modified"] is False
          assert x["probability_fusion_enabled"] is False
          readiness=x.get("sample_readiness",{})
          print("DYNAMIC_FIVE_MARKET_OOS_SCORECARD",
                readiness.get("status",x.get("status","REPLAY_UNAVAILABLE")),
                readiness.get("smallest_market_sample_n",0),
                readiness.get("smallest_market_distinct_days",0))
          PY
      - name: Score multi-company consensus against exact frozen pretip captures
        if: env.RUN_REPORT == 'true'
        continue-on-error: true
        run: |
          python3 analysis/nba_market_consensus_backtest.py --self-test
          python3 analysis/nba_market_consensus_backtest.py \
            --intraday-root reports/five-market-intraday \
            --settled-root reports/five-market-settled \
            --out "reports/five-market-settled/$REVIEW_DAY/market_consensus_scorecard.json"
      - name: Score frozen independent model probabilities against official Final (read-only)
        if: env.RUN_REPORT == 'true'
        continue-on-error: true
        run: |
          folder="${FROZEN_FORECAST%/*}"
          slot="${folder##*/}"
          model="$folder/nba_priority_model.json"
          if [ -f "$model" ] && { [ "$slot" = "0630" ] || [ "$slot" = "2130" ]; }; then
            python3 analysis/nba_frozen_probability_scorecard.py \
              --frozen "$model" --scores nba_final_review_scores.json \
              --day "$REVIEW_DAY" --slot "$slot" \
              --out "reports/five-market-settled/$REVIEW_DAY/independent_model_scorecard.json"
          else
            echo "NO_FROZEN_INDEPENDENT_MODEL_TO_SCORE"
          fi
      - name: Archive frozen five-market settlement and any acceptance receipt
        if: always() && env.RUN_REPORT == 'true'
        run: |
          dir="reports/five-market-settled/$REVIEW_DAY"
          if [ ! -s "$dir/settlement.json" ]; then
            echo "NBA_REVIEW_SETTLEMENT_NOT_GENERATED $REVIEW_DAY"
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "reports/five-market-settled/$REVIEW_DAY"
          git diff --cached --quiet && exit 0
          git commit -m "Archive five-market NBA settlement $REVIEW_DAY"
          git pull --rebase origin main
          for n in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-five-market-2200
          path: |
            reports/five-market-settled/
            nba_final_review_readiness.json
            nba_final_review_scores.json
          if-no-files-found: ignore
          retention-days: 14
