name: NBA official-final-triggered five-market postgame review
on:
  workflow_dispatch:
  schedule:
    # Check every 15 minutes across late-night/late-start games, Beijing 08:00–23:45.
    # Official FINAL, not local clock, is the condition for pushing a review.
    - cron: "*/15 0-15 * * *"
    # Catch any overnight delayed NBA final without missing the previous Beijing slate.
    - cron: "*/15 16-23 * * *"
permissions:
  contents: write
concurrency:
  group: nba-five-market-review-2200
  cancel-in-progress: false
jobs:
  settle-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Check last frozen game has official Final before review
        run: |
          git pull --ff-only origin main
          python3 analysis/nba_final_review_gate.py --github-env "$GITHUB_ENV" \
            --status-out nba_final_review_readiness.json \
            --scores-out nba_final_review_scores.json
      - name: Settle five locked directions against official completed NBA scores
        if: env.RUN_REPORT == 'true'
        run: |
          mkdir -p "reports/five-market-settled/$REVIEW_DAY"
          python3 analysis/nba_five_market_settlement.py --self-test
          python3 analysis/nba_five_market_settlement.py --forecast "$FROZEN_FORECAST" --day "$REVIEW_DAY" \
            --scores nba_final_review_scores.json --out "reports/five-market-settled/$REVIEW_DAY/settlement.json"
      - name: Replay chronological five-market shadow probabilities against official finals
        if: env.RUN_REPORT == 'true'
        run: |
          python3 analysis/nba_dynamic_five_market_replay.py \
            --daily-root reports/daily \
            --settled-root reports/five-market-settled \
            --out "reports/five-market-settled/$REVIEW_DAY/dynamic_probability_scorecard.json"
          python3 - <<'PY'
          import json
          p="reports/five-market-settled/"+__import__("os").environ["REVIEW_DAY"]+"/dynamic_probability_scorecard.json"
          x=json.load(open(p))
          assert x["production_model_modified"] is False
          assert x["probability_fusion_enabled"] is False
          readiness=x.get("sample_readiness",{})
          print("DYNAMIC_FIVE_MARKET_OOS_SCORECARD",
                readiness.get("status",x.get("status","REPLAY_UNAVAILABLE")),
                readiness.get("smallest_market_sample_n",0),
                readiness.get("smallest_market_distinct_days",0))
          PY
      - name: Score multi-company consensus against exact frozen pretip captures
        if: env.RUN_REPORT == 'true'
        run: |
          python3 analysis/nba_market_consensus_backtest.py --self-test
          python3 analysis/nba_market_consensus_backtest.py \
            --intraday-root reports/five-market-intraday \
            --settled-root reports/five-market-settled \
            --out "reports/five-market-settled/$REVIEW_DAY/market_consensus_scorecard.json"
      - name: Score frozen independent model probabilities against official Final (read-only)
        if: env.RUN_REPORT == 'true'
        run: |
          folder="${FROZEN_FORECAST%/*}"
          slot="${folder##*/}"
          model="$folder/nba_priority_model.json"
          if [ -f "$model" ] && { [ "$slot" = "0630" ] || [ "$slot" = "2130" ]; }; then
            python3 analysis/nba_frozen_probability_scorecard.py \
              --frozen "$model" --scores nba_final_review_scores.json \
              --day "$REVIEW_DAY" --slot "$slot" \
              --out "reports/five-market-settled/$REVIEW_DAY/independent_model_scorecard.json"
          else
            echo "NO_FROZEN_INDEPENDENT_MODEL_TO_SCORE"
          fi
      - name: Send one iPhone five-market review
        if: env.RUN_REPORT == 'true'
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          dir="reports/five-market-settled/$REVIEW_DAY"
          python3 analysis/nba_five_market_review_push.py --settlement "$dir/settlement.json" \
            --preview "$dir/report.html" --status "$dir/2200.json" --send
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=os.environ["REVIEW_DAY"]
          p=Path("reports/five-market-settled")/d/"2200.json"
          assert json.loads(p.read_text())["state"]=="API_ACCEPTED_NOT_DEVICE_CONFIRMED"
          PY
      - name: Archive frozen five-market settlement and accepted marker
        if: env.RUN_REPORT == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "reports/five-market-settled/$REVIEW_DAY"
          git diff --cached --quiet && exit 0
          git commit -m "Archive 22:00 five-market NBA settlement $REVIEW_DAY"
          for n in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-five-market-2200
          path: |
            reports/five-market-settled/
            nba_final_review_readiness.json
            nba_final_review_scores.json
          if-no-files-found: ignore
          retention-days: 14
