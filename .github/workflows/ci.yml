name: CI

on:
  push:
    paths-ignore:
      - 'reports/**'
      - 'data/snapshots/**'
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify priority accepted-marker gating and fixed-slot regression
        run: |
          python3 scripts/nba_fixed_slot_gate.py --self-test
          python3 - <<'PY'
          from pathlib import Path
          for slot in ('2130','0630'):
              s=Path(f'.github/workflows/nba-priority-{slot}.yml').read_text()
              assert f'--phase preflight --priority-slot {slot}' in s
              assert s.index(f'--priority-slot {slot}') < s.index('Install pinned model dependencies')
              assert "if: steps.gate.outputs.sent != 'true'" in s
          print('PRIORITY_ACCEPTED_MARKER_GATE_PASS')
          PY

      - name: Verify one-time manual delivery mode and truthful 007 quote coverage
        run: |
          python3 -m py_compile scripts/nba_fixed_slot_gate.py scripts/nba_schedule_fallback_push.py scripts/titan007_join_beijing_verified.py
          python3 scripts/nba_fixed_slot_gate.py --self-test
          python3 scripts/nba_schedule_fallback_push.py --self-test --target 2026-11-02 --slot ONCE
          python3 scripts/titan007_join_beijing_verified.py --self-test
          python3 -m py_compile scripts/titan007_join_beijing_verified.py scripts/titan007_top10_companies.py scripts/titan007_jingcai_three_market.py scripts/parse_007_jc_three_market.py scripts/pushplus_five_compact.py analysis/nba_five_markets.py analysis/nba_market_consensus.py analysis/nba_market_consensus_backtest.py
          python3 scripts/pushplus_five_compact.py --self-test
          python3 scripts/titan007_top10_companies.py --self-test
          python3 analysis/nba_market_consensus.py --self-test
          python3 analysis/nba_market_consensus_backtest.py --self-test
          python3 - <<'PY'
          from scripts.pushplus_mobile_v2 import self_test
          self_test()
          print("PUSHPLUS_FIVE_MARKET_PROBABILITY_AND_MULTI_COMPANY_SHADOW_PASS")
          PY
          python3 scripts/parse_007_jc_three_market.py --self-test
          python3 scripts/titan007_jingcai_three_market.py --self-test
          python3 analysis/nba_five_markets.py --self-test
          python3 - <<'PY'
          from pathlib import Path
          w=Path('.github/workflows/titan007-three-analysis.yml').read_text()
          assert 'ONE_TIME_MANUAL_CAPTURE_NO_NOON_LOCK' in w
          assert '2100|ONCE' in w
          assert 'GITHUB_EVENT_NAME' in Path('scripts/nba_fixed_slot_gate.py').read_text()
          print('ONE_TIME_MANUAL_DELIVERY_AND_MARKET_COVERAGE_PASS')
          PY

      - name: Verify NBA official injury PDF parser and pretip watch safety
        run: |
          python3 analysis/nba_official_injury.py --self-test
          python3 analysis/nba_injury_watch.py --mode self-test

      - name: Verify fail-closed market policy, probability calibration gate and delivery contract
        run: |
          python3 analysis/nba_calibration_evidence.py
          python3 -m py_compile analysis/nba_independent_predictions.py
          python3 analysis/market_value_policy.py --self-test
          python3 scripts/nba_delivery_contract.py --self-test

  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify external scheduler expiry and dispatch safety
        run: node scheduler/test-scheduler.mjs

      - name: Run smoke tests
        run: npm test

      - name: Verify default preset loads
        run: node -e "import('./dist/index.js').then(() => setTimeout(() => process.exit(0), 2000))" 2>&1 | grep "providers loaded"
