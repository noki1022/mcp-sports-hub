name: CI

on:
  push:
    paths-ignore:
      - 'reports/**'
      - 'data/snapshots/**'
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify priority accepted-marker gating and fixed-slot regression
        run: |
          python3 scripts/nba_fixed_slot_gate.py --self-test
          python3 - <<'PY'
          from pathlib import Path
          for slot in ('2130','0630'):
              s=Path(f'.github/workflows/nba-priority-{slot}.yml').read_text()
              assert f'--phase preflight --priority-slot {slot}' in s
              assert s.index(f'--priority-slot {slot}') < s.index('Install pinned model dependencies')
              assert "if: steps.gate.outputs.sent != 'true'" in s
          print('PRIORITY_ACCEPTED_MARKER_GATE_PASS')
          PY

      - name: Verify NBA official injury watch pretip safety
        run: python3 analysis/nba_injury_watch.py --mode self-test

  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify external scheduler expiry and dispatch safety
        run: node scheduler/test-scheduler.mjs

      - name: Run smoke tests
        run: npm test

      - name: Verify default preset loads
        run: node -e "import('./dist/index.js').then(() => setTimeout(() => process.exit(0), 2000))" 2>&1 | grep "providers loaded"
