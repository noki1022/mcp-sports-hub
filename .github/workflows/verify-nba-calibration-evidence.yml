name: Verify odds-blind NBA calibration support evidence
on:
  pull_request:
    branches: [main]
    paths:
      - 'analysis/nba_calibration_evidence.py'
      - 'analysis/nba_independent_predictions.py'
      - 'analysis/nba_model_report.py'
      - '.github/workflows/verify-nba-calibration-evidence.yml'
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python3 -m py_compile analysis/nba_calibration_evidence.py analysis/nba_independent_predictions.py analysis/nba_model_report.py
          python3 analysis/nba_calibration_evidence.py
          python3 - <<'PY'
          from pathlib import Path
          text=Path("analysis/nba_independent_predictions.py").read_text()
          assert "p_home_evidence = calibration_evidence" in text
          assert '"moneyline_home_probability": p_home' in text
          assert "p_home = select_production_probability(" in text
          assert "p_over_225_5 = select_production_probability(" in text
          assert "USE_ISOTONIC_PRODUCTION = False" in text
          assert '"moneyline_home_probability_isotonic_shadow": isotonic_p_home_shadow' in text
          assert '"total_over_225_5_probability_isotonic_shadow": isotonic_p_over_225_5_shadow' in text
          assert '"moneyline_calibration_evidence": p_home_evidence' in text
          assert '"model_calibration_evidence": p.get(' in Path('analysis/nba_model_report.py').read_text()
          print('NBA_CALIBRATION_SHADOW_ONLY_GATE_PASS')
          PY
