name: NBA team enriched historical training package
on:
  push:
    branches: [research/sbr-archive-parser-20261029]
    paths:
      - analysis/nba_team_enriched_training.py
      - .github/workflows/nba-team-enriched-training.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 analysis/nba_team_enriched_training.py --self-test
      - run: python3 analysis/nba_team_enriched_training.py
      - run: test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        with:
          name: nba-team-enriched-training-research
          path: /tmp/nba-team-stats-train-ready/
          retention-days: 7
          if-no-files-found: error
