name: Kaggle betting data per-game crosscheck without ingestion
on:
  push:
    branches: [research/sbr-archive-parser-20261029]
    paths:
      - analysis/nba_kaggle_betting_cross_audit.py
      - .github/workflows/kaggle-betting-crosscheck.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 analysis/nba_kaggle_betting_cross_audit.py
      - name: Confirm repository pristine
        if: always()
        run: test -z "$(git status --porcelain)"
