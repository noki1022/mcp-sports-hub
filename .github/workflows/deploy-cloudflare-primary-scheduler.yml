name: Deploy Cloudflare primary NBA scheduler
on:
  push:
    branches: [main]
    paths:
      - 'scheduler/**'
      - '.github/workflows/deploy-cloudflare-primary-scheduler.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-primary-nba-scheduler-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check Cloudflare deployment credentials
        id: credentials
        env:
          CF_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_GITHUB_TOKEN: \${{ secrets.CLOUDFLARE_SCHEDULER_GITHUB_TOKEN }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ] || [ -z "$CF_GITHUB_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_DEPLOY_PENDING: add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_SCHEDULER_GITHUB_TOKEN as repository Actions secrets."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy Worker and three Cron Triggers
        if: steps.credentials.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config scheduler/wrangler.toml
      - name: Store GitHub dispatch token as Cloudflare Worker secret
        if: steps.credentials.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_GITHUB_TOKEN: \${{ secrets.CLOUDFLARE_SCHEDULER_GITHUB_TOKEN }}
        run: |
          printf '%s' "$CF_GITHUB_TOKEN" | npx --yes wrangler@4 secret put GITHUB_TOKEN --config scheduler/wrangler.toml
      - name: Report deployment state
        if: always()
        run: |
          if [ "\${{ steps.credentials.outputs.configured }}" = "true" ]; then
            echo "Cloudflare Worker deployment and secret provisioning steps completed."
          else
            echo "Cloudflare deployment was not attempted; GitHub native Cron fallback remains active."
          fi
