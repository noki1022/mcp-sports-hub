name: Titan007 basketball schedule page script audit
on:
  push:
    branches: ["audit/titan007-live-20261028"]
    paths: [".github/workflows/titan007-bf-script-audit.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Identify scripts and inline data calls from published schedule page
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.robotparser,re,json
          from html.parser import HTMLParser
          from datetime import datetime,timezone
          ua='Titan007DataResearch/1.0';base='https://bf.titan007.com'
          with urllib.request.urlopen(urllib.request.Request(base+'/robots.txt',headers={'User-Agent':ua}),timeout=10) as r:rtext=r.read(100000).decode('utf-8','replace')
          rp=urllib.robotparser.RobotFileParser();rp.parse(rtext.splitlines())
          url=base+'/NBA_SC.aspx';report={'url':url,'allowed':rp.can_fetch(ua,url),'robots':rtext[:800]}
          if report['allowed']:
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':ua}),timeout=12) as r:
                s=r.read(150000).decode('gb18030','replace')
              report['length']=len(s)
              report['scripts']=re.findall(r'<script\b[^>]*src=["\x27]([^"\x27]+)',s,re.I)
              report['requests_or_data_file_mentions']=list(dict.fromkeys(re.findall(r'[\w/.\-]+(?:\.xml|\.js|\.aspx|\.txt)(?:\?[^" \x27<>]*)?',s,re.I)))[:50]
              report['inline_relevant']=[x.strip()[:350] for x in re.split(r'[;\n]',s) if re.search(r'(score|xml|match|nba|load|request|ajax|date)',x,re.I)][:70]
              report['oddslinks']=re.findall(r'(?:/odds/|/analysis/|oddslist/)(\d{4,12})',s,re.I)[:30]
            except Exception as e:report['error']=str(e)[:200]
          with open('bf_html_scripts.json','w') as f:json.dump(report,f,ensure_ascii=False,indent=2)
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan007-bf-schedule-scripts
          path: bf_html_scripts.json
