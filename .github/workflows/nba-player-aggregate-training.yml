name: NBA lagged player aggregate training research
on:
  push:
    branches: [research/sbr-archive-parser-20261029]
    paths:
      - analysis/nba_player_aggregate_training.py
      - .github/workflows/nba-player-aggregate-training.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 analysis/nba_player_aggregate_training.py --self-test
      - run: python3 analysis/nba_player_aggregate_training.py
      - run: test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        with:
          name: nba-player-aggregates-lagged-research-only
          path: /tmp/nba-player-aggregate-research/
          retention-days: 7
          if-no-files-found: error
