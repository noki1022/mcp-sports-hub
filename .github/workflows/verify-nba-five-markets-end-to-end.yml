name: Verify five-market scheduled PushPlus and nightly settlement
on:
  pull_request:
    branches: [main]
    paths:
      - 'analysis/nba_five_markets.py'
      - 'analysis/nba_market_consensus.py'
      - 'analysis/nba_market_consensus_backtest.py'
      - 'scripts/titan007_top10_companies.py'
      - 'scripts/optional_007_enrichment.py'
      - 'scripts/pushplus_five_compact.py'
      - 'analysis/nba_five_market_settlement.py'
      - 'analysis/nba_five_market_review_push.py'
      - 'scripts/pushplus_mobile_v2.py'
      - '.github/workflows/nba-two-market-nightly-2200.yml'
      - '.github/workflows/nba-priority-2130.yml'
      - '.github/workflows/nba-priority-0630.yml'
      - '.github/workflows/titan007-three-analysis.yml'
      - '.github/workflows/titan007-final-hourly.yml'
      - '.github/workflows/verify-nba-five-markets-end-to-end.yml'
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify five market signs, outcomes and iPhone format
        run: |
          python3 -m py_compile scripts/optional_007_enrichment.py analysis/nba_five_markets.py analysis/nba_market_consensus.py analysis/nba_market_consensus_backtest.py analysis/nba_five_market_settlement.py analysis/nba_five_market_review_push.py scripts/pushplus_mobile_v2.py scripts/pushplus_five_compact.py
          python3 scripts/optional_007_enrichment.py --self-test
          python3 analysis/nba_market_consensus.py --self-test
          python3 analysis/nba_market_consensus_backtest.py --self-test
          python3 analysis/nba_five_markets.py --self-test
          python3 analysis/nba_five_market_settlement.py --self-test
          python3 analysis/nba_final_review_gate.py --self-test
          python3 analysis/nba_five_market_review_push.py --self-test
          python3 scripts/pushplus_mobile.py --mode three --self-test
      - name: Enforce five market artifact in all four scheduled workflows
        run: |
          python3 - <<'PY'
          from pathlib import Path
          paths=[
            '.github/workflows/titan007-three-analysis.yml',
            '.github/workflows/titan007-final-hourly.yml',
            '.github/workflows/nba-priority-2130.yml',
            '.github/workflows/nba-priority-0630.yml']
          for path in paths:
              content=Path(path).read_text()
              assert 'analysis/nba_five_markets.py' in content,path
              assert 'scripts/optional_007_enrichment.py consensus' in content,path
              assert '--consensus nba_market_consensus.json' in content,path
              assert '--five nba_five_market_forecast.json' in content,path
              assert 'nba_five_market_forecast.json' in content,path
          nightly=Path('.github/workflows/nba-two-market-nightly-2200.yml').read_text()
          assert 'analysis/nba_five_market_settlement.py' in nightly
          assert 'analysis/nba_final_review_gate.py' in nightly
          assert '--scores nba_final_review_scores.json' in nightly
          assert 'analysis/nba_five_market_review_push.py' in nightly
          assert 'nba_final_review_readiness.json' in nightly
          # Multi-company capture and consensus are optional enrichment only.
          wrapper=Path('scripts/optional_007_enrichment.py').read_text()
          assert 'nba_market_consensus.py' in wrapper
          for path in paths:
              content=Path(path).read_text()
              assert 'scripts/optional_007_enrichment.py collect' in content,path
              assert 'scripts/optional_007_enrichment.py consensus' in content,path
              for label in ('Persist top-ten institution snapshot',
                            'Persist top-ten institution snapshots'):
                  pos=content.find('name: '+label)
                  if pos >= 0:
                      assert 'continue-on-error: true' in content[pos:pos+260],path
                      break
              else:
                  raise AssertionError('MISSING_BEST_EFFORT_ARCHIVE_STEP: '+path)
          print('OPTIONAL_007_ENRICHMENT_FAIL_OPEN_ALL_SCHEDULES_PASS')
          print('NBA_FIVE_MARKET_FOUR_SCHEDULED_AND_NIGHTLY_WIRED_PASS')
          PY
      - name: Audit 10 pretip real 007 lottery games without posting PushPlus
        run: |
          python3 scripts/titan007_jingcai_three_market.py \
            --joined reports/daily/2026-10-31/1800/titan007_three_joined.json \
            --out sampled-jingcai.json
          python3 - <<'PY'
          import json
          src=json.load(open('sampled-jingcai.json'))
          labels=src['jc_007_match_numbers']
          assert labels['total_games']==src['game_count']==10
          assert 0<=labels['verified']<=labels['total_games']
          verified=[v for v in labels['games'].values()
                    if v['status']=='VERIFIED_JC_NUMBER']
          assert labels['verified']==len(verified)
          assert all(v.get('label') and v.get('match_no') for v in verified)
          assert all(not v.get('label') for v in labels['games'].values()
                     if v['status']!='VERIFIED_JC_NUMBER')
          assert src['verified_games_with_all_three']==0
          print('JC_FIVE_MARKET_REAL_TEN_AUDITED',
                labels['verified'],'VERIFIED',
                labels['total_games']-labels['verified'],'UNVERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nba-five-market-integration-verify
          path: sampled-jingcai.json
          if-no-files-found: ignore
          retention-days: 2
