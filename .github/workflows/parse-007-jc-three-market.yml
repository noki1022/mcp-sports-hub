name: Parse real 007 JC three-market NBA lottery odds
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/parse_007_jc_three_market.py'
      - '.github/workflows/parse-007-jc-three-market.yml'
permissions: {contents: read}
jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python3 scripts/parse_007_jc_three_market.py --self-test
          PYTHONPATH=scripts python3 -c "from pushplus_mobile_v2 import self_test; self_test()"
      - run: |
          python3 scripts/parse_007_jc_three_market.py \
            --board reports/daily/2026-10-31/1800/titan007_three_joined.json \
            --output 007-jc-three-real-prices.json
      - name: Confirm Celtics is user-confirmed not-on-sale in the win-loss pool
        run: |
          python3 - <<'PY'
          import json,sys
          sys.path.insert(0,"scripts")
          from parse_007_jc_three_market import parse
          from probe_007_jc_scripts import ORIGIN,UA,get_bytes,robots_policy
          board=json.load(open("reports/daily/2026-10-31/1800/titan007_three_joined.json"))
          rp,status=robots_policy()
          assert rp is not False and (rp is None or rp.can_fetch(UA,ORIGIN+"/xml/odds_jc_lq.txt"))
          d=parse(get_bytes(ORIGIN+"/xml/odds_jc_lq.txt",300000),board)
          rows=[g for g in d["matches"] if g["game_id"]=="728166"]
          assert len(rows)==1
          m=rows[0]["markets"]
          assert m["win_lose"]["status"]=="NOT_ON_SALE_USER_CONFIRMED",m
          assert m["handicap"]["status"]=="OBSERVED"
          assert m["total"]["status"]=="OBSERVED"
          assert d["007_jingcai_reference_user_confirmed"]
          print("CELTICS_WIN_LOSE_USER_CONFIRMED_NOT_ON_SALE_PASS")
          PY
      - name: Check existing source-audit workflow receives independent JC price shadow
        run: |
          python3 scripts/titan007_jingcai_three_market.py \
            --joined reports/daily/2026-10-31/1800/titan007_three_joined.json \
            --out nba-jc-shadow-verified.json
          python3 - <<'PY'
          import json
          d=json.load(open("nba-jc-shadow-verified.json"))
          assert "jc_007_public_odds_shadow" in d
          assert not d["jc_007_public_odds_shadow"]["eligible_for_model_fusion"]
          print("JC_007_SHADOW_STATUS",d["jc_007_public_odds_shadow"]["status"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 007-jc-three-real-prices
          path: |
            007-jc-three-real-prices.json
            jc-three-source-user-confirmed.json
            nba-jc-shadow-verified.json
          retention-days: 3
          if-no-files-found: ignore
