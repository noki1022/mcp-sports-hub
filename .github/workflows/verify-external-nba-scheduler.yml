name: Verify external NBA scheduler
on:
  pull_request:
    branches: [main]
    paths:
      - 'scheduler/**'
      - '.github/workflows/titan007-three-analysis.yml'
      - '.github/workflows/nba-priority-0630.yml'
      - '.github/workflows/nba-priority-2130.yml'
      - '.github/workflows/nba-two-market-nightly-2200.yml'
      - '.github/workflows/nba-injury-change-watch.yml'
      - '.github/workflows/nba-delivery-health-watchdog.yml'
      - '.github/workflows/odds-results-settlement.yml'
      - '.github/workflows/nba-full-chain-e2e.yml'
      - '.github/workflows/deploy-cloudflare-primary-scheduler.yml'
      - '.github/workflows/verify-external-nba-scheduler.yml'
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scheduler/test-scheduler.mjs
      - name: Check Cloudflare is the primary clock and workflow engines remain intact
        run: |
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          cfg=tomllib.loads(Path('scheduler/wrangler.toml').read_text())
          crons=cfg['triggers']['crons']
          expected=[
              '*/15 * * * *',
              '*/5 22-23,0-13 * * *',
              '0,1,5,6,7,8,10,11,16,18,20,28,30,35,40,45,50,55 0-8,10,13,20,22-23 * * *',
          ]
          assert crons==expected,(crons,expected)
          assert len(crons)==3
          worker=Path('scheduler/worker.mjs').read_text()
          for name in ('titan007-three-analysis.yml','nba-priority-2130.yml',
                       'nba-priority-0630.yml','nba-injury-change-watch.yml',
                       'nba-delivery-health-watchdog.yml','nba-two-market-nightly-2200.yml',
                       'odds-results-settlement.yml','nba-full-chain-e2e.yml'):
              assert name in worker, 'MISSING_SCHEDULED_WORKFLOW_'+name
          assert 'Automatic overnight hourly market' in Path('scheduler/README.md').read_text()
          deploy=Path('.github/workflows/deploy-cloudflare-primary-scheduler.yml').read_text()
          for secret in ('CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID',
                         'CLOUDFLARE_SCHEDULER_GITHUB_TOKEN'):
              assert secret in deploy, 'MISSING_DEPLOY_SECRET_'+secret
          print('CLOUDFLARE_PRIMARY_SCHEDULER_WIRING_PASS')
          PY
