name: Verify external NBA scheduler
on:
  pull_request:
    branches: [main]
    paths:
      - 'scheduler/**'
      - '.github/workflows/titan007-three-analysis.yml'
      - '.github/workflows/nba-priority-0630.yml'
      - '.github/workflows/nba-priority-2130.yml'
      - '.github/workflows/titan007-final-hourly.yml'
      - '.github/workflows/nba-delivery-health-watchdog.yml'
      - '.github/workflows/verify-external-nba-scheduler.yml'
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scheduler/test-scheduler.mjs
      - name: Check noon dispatch freezes cohort and passes explicit report slot
        run: |
          python3 - <<'PY'
          from pathlib import Path
          w=Path('.github/workflows/titan007-three-analysis.yml').read_text()
          assert 'report_slot:' in w
          assert 'EXTERNAL_REPORT_SLOT' in w
          assert '"$EXTERNAL_REPORT_SLOT" = "1200"' in w
          for slot in ('0630','2130'):
              p=Path(f'.github/workflows/nba-priority-{slot}.yml').read_text()
              assert 'workflow_dispatch:' in p
          print('EXTERNAL_NOON_AND_PRIORITY_DISPATCH_INPUT_PASS')
          PY
      - name: Ensure Cloudflare cron has no overnight monitoring wakeups
        run: |
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          cfg=tomllib.loads(Path('scheduler/wrangler.toml').read_text())
          crons=cfg['triggers']['crons']
          expected=[
              '0,8,18,28 4,6,7,10 * * *',
              '0,7,16,20,30,40 13 * * *',
              '0,10,20 14 * * *',
              '20,30,40 22 * * *',
          ]
          assert crons==expected,(crons,expected)
          # UTC 14:30–21:30 is Beijing 22:30–05:30: no cron is scheduled there.
          assert all(not any(14 <= h <= 21 for h in
              (range(int(expr.split()[1].split('-')[0]),int(expr.split()[1].split('-')[-1])+1)
               if '-' in expr.split()[1] else [int(x) for x in expr.split()[1].split(',')]))
              for expr in crons if expr.split()[1] not in ('4,6,7,10','13','14','22'))
          print('CLOUDFLARE_NO_OVERNIGHT_CRON_WAKEUPS_PASS')
          PY
