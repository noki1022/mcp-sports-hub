name: Verify exact-time Cloudflare and GitHub scheduler
on:
  pull_request:
    branches: [main]
    paths:
      - 'scheduler/**'
      - 'scripts/sports_postgame_slot.py'
      - '.github/workflows/football-review-push-1300.yml'
      - '.github/workflows/nba-two-market-nightly-2200.yml'
      - '.github/workflows/sports-per-match-finalizer.yml'
      - '.github/workflows/sports-verified-results.yml'
      - '.github/workflows/titan007-three-analysis.yml'
      - '.github/workflows/football-007-live-capture.yml'
      - '.github/workflows/nba-priority-0630.yml'
      - '.github/workflows/nba-priority-2130.yml'
      - '.github/workflows/verify-external-nba-scheduler.yml'
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scheduler/test-scheduler.mjs
      - name: Verify one Worker and no retry Cron
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import tomllib
          c=tomllib.loads(Path('scheduler/wrangler.toml').read_text())
          assert c['name']=='nba-external-schedule-watchdog'
          assert c['triggers']['crons']==["0 4-15 * * *", "25,50 * * * *"]
          worker=Path('scheduler/worker.mjs').read_text()
          assert 'export async function dispatchAt(' in worker
          assert 'export async function dispatchFootballAt(' in worker
          assert 'CANONICAL_RUN_EXISTS_NO_RETRY' in worker
          assert 'FOOTBALL_CANONICAL_RUN_EXISTS_NO_RETRY' in worker
          assert not Path('.github/workflows/deploy-cloudflare-secondary-scheduler.yml').exists()
          assert 'export async function dispatchPostgameAt(' in worker
          import sys
          from datetime import datetime
          sys.path.insert(0, "scripts")
          from sports_postgame_slot import validate
          now=datetime.fromisoformat("2026-11-06T07:00:15+00:00")
          ref="refs/heads/main"
          validate("nba-review","schedule","",now,ref)
          validate("nba-review","workflow_dispatch","2026-11-06T07:00:00Z",now,ref)
          try:
              validate("nba-review","workflow_dispatch","2026-11-06T16:30:00Z",now,ref)
          except ValueError as exc:
              assert str(exc)=="POSTGAME_CLOUDFLARE_NONCANONICAL_SLOT"
          else:
              raise AssertionError("OLD_NBA_REVIEW_SLOT_ACCEPTED")
          print('EXACT_TIME_EXISTING_CLOUDFLARE_WORKER_NO_RESEND_PASS')
          PY
