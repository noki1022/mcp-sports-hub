name: Verify external NBA scheduler
on:
  pull_request:
    branches: [main]
    paths:
      - 'scheduler/**'
      - '.github/workflows/titan007-three-analysis.yml'
      - '.github/workflows/nba-priority-0630.yml'
      - '.github/workflows/nba-priority-2130.yml'
      - '.github/workflows/titan007-final-hourly.yml'
      - '.github/workflows/nba-delivery-health-watchdog.yml'
      - '.github/workflows/verify-external-nba-scheduler.yml'
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scheduler/test-scheduler.mjs
      - name: Check noon dispatch freezes cohort and passes explicit report slot
        run: |
          python3 - <<'PY'
          from pathlib import Path
          w=Path('.github/workflows/titan007-three-analysis.yml').read_text()
          assert 'report_slot:' in w
          assert 'EXTERNAL_REPORT_SLOT' in w
          assert '"$EXTERNAL_REPORT_SLOT" = "1200"' in w
          for slot in ('0630','2130'):
              p=Path(f'.github/workflows/nba-priority-{slot}.yml').read_text()
              assert 'workflow_dispatch:' in p
          print('EXTERNAL_NOON_AND_PRIORITY_DISPATCH_INPUT_PASS')
          PY
