name: Verify external NBA scheduler
on:
  pull_request:
    branches: [main]
    paths:
      - 'scheduler/**'
      - '.github/workflows/titan007-three-analysis.yml'
      - '.github/workflows/nba-priority-0630.yml'
      - '.github/workflows/nba-priority-2130.yml'
      - '.github/workflows/titan007-final-hourly.yml'
      - '.github/workflows/nba-delivery-health-watchdog.yml'
      - '.github/workflows/verify-external-nba-scheduler.yml'
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scheduler/test-scheduler.mjs
      - name: Check noon dispatch freezes cohort and passes explicit report slot
        run: |
          python3 - <<'PY'
          from pathlib import Path
          w=Path('.github/workflows/titan007-three-analysis.yml').read_text()
          assert 'report_slot:' in w
          assert 'EXTERNAL_REPORT_SLOT' in w
          assert '"$EXTERNAL_REPORT_SLOT" = "1200"' in w
          for slot in ('0630','2130'):
              p=Path(f'.github/workflows/nba-priority-{slot}.yml').read_text()
              assert 'workflow_dispatch:' in p
          print('EXTERNAL_NOON_AND_PRIORITY_DISPATCH_INPUT_PASS')
          PY
      - name: Allow Cloudflare 00:30 and 03:30 full reports but no hourly overnight monitoring
        run: |
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          cfg=tomllib.loads(Path('scheduler/wrangler.toml').read_text())
          crons=cfg['triggers']['crons']
          assert len(crons) <= 5, "CLOUDFLARE_FREE_PLAN_CRON_LIMIT"
          assert crons == [
              '0,7,8,10,16,18,20,28,30,35,40,42,52 4-14 * * *',
              '20,30,35,40,42,50,52 16-22 * * *',
          ], crons
          def expand(expr):
              minutes, hours, *_ = expr.split()
              def field(value):
                  return {n for part in value.split(',') for n in
                          range(int(part.split('-')[0]), int(part.split('-')[-1])+1)}
              return {(h,m) for h in field(hours) for m in field(minutes)}
          ticks=set().union(*(expand(expr) for expr in crons))
          # Every NBA and football planned backup minute must be present.
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          for h in range(24):
              for m in range(60):
                  local=datetime(2026,11,6,h,m,tzinfo=timezone.utc).astimezone(ZoneInfo('Asia/Shanghai'))
                  lh,lm=local.hour,local.minute
                  nba=((lh in (12,14,15,18) and lm in (0,8,18,28)) or
                       (lh==21 and lm in (0,7,16,30,40)) or
                       (lh==22 and lm in (0,10,20)) or
                       (lh==6 and lm in (20,30,40)) or
                       (lh in (0,3) and lm in (30,40,50)))
                  football=(((12<=lh<=21 or 0<=lh<=6) and lm in (20,35)) or
                           (lh in (21,6) and lm in (42,52)))
                  if nba or football:
                      assert (h,m) in ticks, (h,m,lh,lm)
          assert len(ticks)==11*13+7*7, len(ticks)
          print('CLOUDFLARE_TWO_FULL_REPORTS_NO_HOURLY_OVERNIGHT_PASS')
          PY
      - name: Confirm existing Worker identity and GitHub build integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import tomllib
          worker=Path("scheduler/worker.mjs").read_text()
          config=tomllib.loads(Path("scheduler/wrangler.toml").read_text())
          assert config["name"]=="nba-external-schedule-watchdog"
          assert 'const OWNER="noki1022";' in worker
          assert 'const REPO="mcp-sports-hub";' in worker
          assert 'const MIDNIGHT_REPORTS=[' in worker
          assert '"titan007-three-analysis.yml"' in worker
          assert 'slot:f.slot' in worker
          assert 'export async function dispatchFootballAt(' in worker
          assert 'FOOTBALL_DISPATCH_ACCEPTED_NOT_COMPLETED' in worker
          assert 'football-007-live-capture.yml' in worker
          assert not Path(".github/workflows/deploy-cloudflare-secondary-scheduler.yml").exists()
          print("EXISTING_CLOUDFLARE_WORKERS_BUILDS_INTEGRATION_PRESERVED")
          PY
