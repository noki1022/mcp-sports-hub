name: Verify exact-time Cloudflare and GitHub scheduler
on:
  pull_request:
    branches: [main]
    paths:
      - 'scheduler/**'
      - 'scripts/sports_postgame_slot.py'
      - '.github/workflows/football-review-push-1300.yml'
      - '.github/workflows/nba-two-market-nightly-2200.yml'
      - '.github/workflows/sports-per-match-finalizer.yml'
      - '.github/workflows/sports-verified-results.yml'
      - '.github/workflows/titan007-three-analysis.yml'
      - '.github/workflows/football-007-live-capture.yml'
      - '.github/workflows/nba-priority-0630.yml'
      - '.github/workflows/nba-priority-2130.yml'
      - '.github/workflows/verify-external-nba-scheduler.yml'
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scheduler/test-scheduler.mjs
      - name: Verify one Worker and no retry Cron
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import tomllib
          c=tomllib.loads(Path('scheduler/wrangler.toml').read_text())
          assert c['name']=='nba-external-schedule-watchdog'
          assert c['triggers']['crons']==["0 4-15 * * *", "25,50 * * * *"]
          worker=Path('scheduler/worker.mjs').read_text()
          assert 'export async function dispatchAt(' in worker
          assert 'export async function dispatchFootballAt(' in worker
          assert 'CANONICAL_RUN_EXISTS_NO_RETRY' in worker
          assert 'FOOTBALL_CANONICAL_RUN_EXISTS_NO_RETRY' in worker
          assert not Path('.github/workflows/deploy-cloudflare-secondary-scheduler.yml').exists()
          assert 'export async function dispatchPostgameAt(' in worker
          import sys
          from datetime import datetime
          sys.path.insert(0, "scripts")
          from sports_postgame_slot import validate
          def moment(s):
              return datetime.fromisoformat(s)
          ref="refs/heads/main"
          # Exact time and the original native runs from the 12 November incident.
          validate("football-review","schedule","",moment("2026-11-12T05:52:02+00:00"),ref,"0 5 * * *")
          validate("football-review","workflow_dispatch","2026-11-12T05:00:00Z",moment("2026-11-12T05:00:57+00:00"),ref)
          validate("nba-review","schedule","",moment("2026-11-12T08:17:12+00:00"),ref,"25,50 * * * *")
          validate("nba-review","workflow_dispatch","2026-11-12T03:25:00Z",moment("2026-11-12T03:25:57+00:00"),ref)
          for sport,event,stamp,now,cron,reason in (
              ("nba-review","workflow_dispatch","2026-11-12T07:00:00Z","2026-11-12T07:00:57+00:00","","POSTGAME_CLOUDFLARE_NONCANONICAL_SLOT"),
              ("football-review","workflow_dispatch","2026-11-12T05:00:00Z","2026-11-12T16:00:00+00:00","","POSTGAME_ORIGINAL_SLOT_EXPIRED"),
              ("football-review","schedule","","2026-11-12T04:59:59+00:00","0 5 * * *","POSTGAME_ORIGINAL_SLOT_EXPIRED"),
              ("football-review","workflow_dispatch","","2026-11-12T05:30:00+00:00","","POSTGAME_SEND_REQUIRES_ORIGINAL_SCHEDULE"),
              ("nba-review","schedule","","2026-11-12T07:00:00+00:00","0 7 * * *","POSTGAME_SEND_REQUIRES_ORIGINAL_SCHEDULE"),
          ):
              try:
                  validate(sport,event,stamp,moment(now),ref,cron)
              except ValueError as exc:
                  assert str(exc)==reason, exc
              else:
                  raise AssertionError((sport,event,stamp,now))
          print('EXACT_TIME_EXISTING_CLOUDFLARE_WORKER_NO_RESEND_PASS')
          PY
