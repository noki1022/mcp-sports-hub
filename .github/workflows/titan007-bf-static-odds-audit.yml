name: Titan007 BF advertised static odds feed audit
on:
  push:
    branches: ["audit/titan007-live-20261028"]
    paths: [".github/workflows/titan007-bf-static-odds-audit.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test only explicitly page-referenced no-query static resources
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,urllib.robotparser,re,json,time
          from datetime import datetime,timezone
          UA='Titan007DataResearch/1.0';base='https://bf.titan007.com/'
          with urllib.request.urlopen(urllib.request.Request(base+'robots.txt',headers={'User-Agent':UA}),timeout=10) as r:
            s=r.read(20000).decode('utf-8','replace')
          rp=urllib.robotparser.RobotFileParser();rp.parse(s.splitlines())
          paths=['NBA/sbOddsDataBsk.js','NBA/ch_nbaGoal3.xml','NBA/ch_sbOddsBsk.xml']
          outcomes=[]
          for path in paths:
            url=base+path;z={'url':url,'allowed':rp.can_fetch(UA,url)}
            if not z['allowed']:
              z['status']='DENIED';outcomes.append(z);continue
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':UA}),timeout=12) as r:
                b=r.read(300001);z.update(status=r.status,content_type=r.headers.get('Content-Type'),bytes=len(b))
              if len(b)>300000:z['status']='TOO_LARGE'
              else:
                t=b.decode('gb18030','replace')
                z['prefix']=t[:450]
                z['possible_script_id_count']=len(set(re.findall(r'\[(\d{5,12})\]\s*=',t)))
                z['possible_script_ids']=list(dict.fromkeys(re.findall(r'\[(\d{5,12})\]\s*=',t)))[:25]
                z['numeric_candidates']=list(dict.fromkeys(re.findall(r'(?<!\d)\d{6,8}(?!\d)',t)))[:20]
            except urllib.error.HTTPError as e:z.update(status=e.code,error='HTTP_ERROR')
            except Exception as e:z.update(status='ERROR',error=type(e).__name__+':'+str(e)[:150])
            outcomes.append(z);time.sleep(1)
          o={'utc':datetime.now(timezone.utc).isoformat(),'tests':outcomes}
          with open('bf_static_odds.json','w') as f:json.dump(o,f,ensure_ascii=False,indent=2)
          print(json.dumps(o,ensure_ascii=False,indent=2))
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan007-bf-static-odds
          path: bf_static_odds.json
