name: Kaggle historical NBA odds season batches acceptance
on:
  push:
    branches: [research/sbr-archive-parser-20261029]
    paths:
      - scripts/kaggle_nba_odds_year_batches.py
      - .github/workflows/kaggle-nba-odds-year-batches.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/kaggle_nba_odds_year_batches.py --self-test
      - run: python3 scripts/kaggle_nba_odds_year_batches.py
      - name: Assert zero raw files written
        if: always()
        run: test -z "$(git status --porcelain)"
