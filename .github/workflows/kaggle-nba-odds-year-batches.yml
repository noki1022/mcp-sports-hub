name: Kaggle historical NBA odds season batches acceptance
on:
  push:
    branches: [research/sbr-archive-parser-20261029]
    paths:
      - scripts/kaggle_nba_odds_year_batches.py
      - .github/workflows/kaggle-nba-odds-year-batches.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      KAGGLE_CANDIDATE_OUT: /tmp/kaggle_timestamp_qualified_odds.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/kaggle_nba_odds_year_batches.py --self-test
      - run: python3 scripts/kaggle_nba_odds_year_batches.py
      - name: Commit timestamp-qualified odds candidate file
        run: |
          mkdir -p reports/odds
          cp /tmp/kaggle_timestamp_qualified_odds.json reports/odds/kaggle_timestamp_qualified_odds.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/odds/kaggle_timestamp_qualified_odds.json
          git commit -m "Save timestamp-qualified odds candidate file"
          git push
      - name: Upload timestamp-qualified odds candidates
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-timestamp-qualified-odds
          path: /tmp/kaggle_timestamp_qualified_odds.json
          retention-days: 14
      - name: Assert zero raw files written
        if: always()
        run: test -z "$(git status --porcelain)"
