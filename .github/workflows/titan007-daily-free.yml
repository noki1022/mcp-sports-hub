name: Free Titan007 NBA and CBA daily odds report
on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "007 display date YYYY-MM-DD (optional; default based on Beijing time)"
        required: false
        type: string
  schedule:
    # Beijing 22:00 for next morning; 05:30 for pre-game follow-up.
    - cron: "0 14 * * *"
    - cron: "30 21 * * *"
  push:
    branches: ["feature/nba-daily-form-h2h-efficiency"]
    paths: [".github/workflows/titan007-daily-free.yml"]
permissions:
  contents: read
concurrency:
  group: titan007-daily-free-${{ github.ref }}
  cancel-in-progress: false
jobs:
  public-market-report:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      REQUESTED_DATE: ${{ inputs.target_date || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select source display date, using Asia/Shanghai UTC+8
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import os,re
          from datetime import datetime,timedelta,date
          from zoneinfo import ZoneInfo
          specified=os.environ.get('REQUESTED_DATE','').strip()
          if specified:
              if not re.fullmatch(r'\d{4}-\d{2}-\d{2}',specified):
                  raise ValueError('Target date must be YYYY-MM-DD')
              date.fromisoformat(specified)
              target=specified
          else:
              local=datetime.now(ZoneInfo('Asia/Shanghai'))
              d=local.date()+timedelta(days=1 if local.hour>=12 else 0)
              target=d.isoformat()
          print('TARGET_DATE='+target)
          PY
      - name: Validate ID and Crown row parsers
        run: |
          python3 scripts/titan007_bf_snapshot.py --self-test
          python3 scripts/titan007_join_daily.py --self-test
          python3 scripts/titan007_crown_crossverify.py --self-test
      - name: Join currently published match IDs with public odds
        run: |
          python3 scripts/titan007_join_daily.py --date "$TARGET_DATE" --out titan007_joined_nba_cba.json
      - name: Generate odds-blind NBA prediction artifact
        run: |
          python3 analysis/nba_prediction_adapter.py --self-test
          python3 analysis/nba_prediction_adapter.py --joined titan007_joined_nba_cba.json --out nba_independent_predictions_gate.json
      - name: Refresh NBA recent five games, possession efficiency, and five historical H2H
        shell: bash
        run: |
          python3 analysis/nba_rolling_form_h2h.py --self-test
          python3 analysis/nba_rolling_form_h2h.py --date "$TARGET_DATE" \
            --joined titan007_joined_nba_cba.json --out nba_recent_form_h2h.json
          python3 analysis/nba_form_h2h_report.py --source nba_recent_form_h2h.json
      - name: Validate daily form and H2H before publication
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from datetime import date
          with open('nba_recent_form_h2h.json',encoding='utf-8') as f: x=json.load(f)
          assert x['target_date']==__import__('os').environ['TARGET_DATE']
          assert x['verified_distinct_games']>1000
          cutoff=date.fromisoformat(x['target_date'])
          for game in x['nba_games']:
              if game['status']=='UNMAPPED_TEAM': continue
              for side in ('home_recent','away_recent'):
                  form=game[side]
                  assert len(form['last_five'])<=5
                  assert all(date.fromisoformat(row['date'])<cutoff for row in form['last_five'])
              h=game['head_to_head']
              assert len(h['recent_five'])<=5
              assert all(date.fromisoformat(row['date'])<cutoff for row in h['recent_five'])
          print('DAILY_NBA_LAST5_H2H_ACCEPTED',len(x['nba_games']))
          PY
      - name: Sample-check current Crown labeled source, without login
        run: python3 scripts/titan007_crown_crossverify.py
      - name: Produce phone-friendly HTML and CSV
        run: python3 scripts/titan007_report.py
      - name: Verify report integrity
        run: |
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          joined=json.loads(Path('titan007_joined_nba_cba.json').read_text(encoding='utf-8'))
          quality=json.loads(Path('titan007_crown_quality_check.json').read_text(encoding='utf-8'))
          with open('titan007_nba_cba_report.csv',encoding='utf-8-sig') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==joined['nba_cba_joined_for_date']
          assert Path('titan007_nba_cba_report.html').stat().st_size>700
          if rows:
              assert quality.get('matching_markets',0)>0
              if quality.get('mismatching_markets',0):
                  print('DEGRADED_CROWN_QUOTES',quality['mismatching_markets'],'sample markets changed between fetches')
          print('DAILY_REPORT_ACCEPTED',len(rows),'games date',joined['requested_display_date'],'quality',quality.get('matching_markets',0))
          PY
      - name: Install PDF reader for NBA official injury report
        if: success()
        run: python3 -m pip install --disable-pip-version-check --quiet --user "pdfplumber==0.11.7"
      - name: Load official matchup-specific NBA injury status
        if: success()
        shell: bash
        run: |
          python3 analysis/nba_official_injury.py --date "$TARGET_DATE" --out nba_official_injuries.json || {
            echo "Official injury source not yet accessible; continue with NOT_LISTED flags, not inferred health."
            rm -f nba_official_injuries.json
          }
      - name: Produce strict market-only analysis without stale efficiency inputs
        run: |
          python3 analysis/titan007_daily_market.py --self-test
          python3 analysis/titan007_daily_market.py --joined titan007_joined_nba_cba.json --out daily_market_analysis.json
          python3 analysis/market_decision_gate.py --market daily_market_analysis.json --predictions nba_independent_predictions_gate.json --out daily_market_decision.json
      - name: Verify zero betting signals and valid live de-vig rows
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          o=json.loads(Path('daily_market_analysis.json').read_text(encoding='utf-8'))
          assert o['recommendations']==[]
          assert o['real_ev_status'].startswith('DISABLED')
          for row in o['row_data']:
            if row.get('market_status')=='OK':
              assert abs(row['devig_side1']+row['devig_side2']-1)<1e-10
          print('DAILY_MARKET_QUALITY_PASS',o['games'])
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan007-basketball-daily-${{ env.TARGET_DATE }}
          path: |
            titan007_joined_nba_cba.json
            titan007_crown_quality_check.json
            titan007_nba_cba_report.csv
            titan007_nba_cba_report.html
            daily_market_analysis.json
            daily_market_decision.json
            nba_independent_predictions_gate.json
            daily_market_analysis.csv
            daily_market_analysis.html
            nba_official_injuries.json
            nba_recent_form_h2h.json
            nba_recent_form_h2h.csv
            nba_recent_form_h2h.html
          if-no-files-found: warn
          retention-days: 14
