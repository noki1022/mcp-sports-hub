name: Verify official NBA four factors data contract
on:
  pull_request:
    branches: [main]
    paths:
      - 'analysis/nba_official_four_factors_integrity.py'
      - '.github/workflows/verify-nba-official-four-factors-integrity.yml'
permissions: {contents: read}
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify missing factors never silently inferred
        run: |
          python3 -m py_compile analysis/nba_official_four_factors_integrity.py
          python3 analysis/nba_official_four_factors_integrity.py
