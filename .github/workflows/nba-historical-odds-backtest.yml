name: NBA historical odds feature backtest
on:
  workflow_dispatch:
  push:
    paths:
      - "analysis/nba_odds_feature_backtest.py"
      - "scripts/fetch_historical_odds_candidates.py"
      - "data/odds/**"
      - "data/results/**"
      - "reports/odds/**"
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --quiet numpy
      - name: Validate source fetcher
        run: python scripts/fetch_historical_odds_candidates.py --self-test
      - name: Fetch licensed public candidate files for audit
        run: python scripts/fetch_historical_odds_candidates.py --out tmp/historical-odds-candidates
      - name: Run deterministic odds feature self-test
        run: python analysis/nba_odds_feature_backtest.py --self-test
      - name: Run settled historical odds backtest
        run: |
          python analysis/nba_odds_feature_backtest.py             --odds reports/odds/latest_settlement.json             --scores data/results/odds_api_scores.json             --out odds_feature_backtest_report.json
      - uses: actions/upload-artifact@v4
        with:
          name: nba-odds-feature-backtest
          path: |
            odds_feature_backtest_report.json
            tmp/historical-odds-candidates/download_manifest.json
          retention-days: 14
