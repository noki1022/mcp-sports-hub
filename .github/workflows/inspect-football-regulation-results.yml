name: Inspect 007 football regulation result evidence
on:
  push:
    branches: [codex/inspect-football-regulation-results]
    paths: ['.github/workflows/inspect-football-regulation-results.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read 007 match pages and their public event scripts
        run: |
          python3 - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          import re
          from urllib.request import Request, urlopen
          pages = {str(i):f"https://live.titan007.com/detail/{i}cn.htm" for i in range(3110400,3110404)}
          def inspect(item):
              name,url=item
              try:
                  req=Request(url,headers={"User-Agent":"Sports-Verified-Postgame/1.0"})
                  with urlopen(req,timeout=12) as response:
                      raw=response.read(1000000)
                  html=raw.decode("utf-8-sig",errors="replace")
                  from pathlib import Path
                  Path(name + ".html").write_bytes(raw)
                  hits=re.findall(r".{0,90}(?:加时|点球|常规时间|90分钟|首回合|第一回合|下半场结束|ShowLiveHead|url\s*:|\.ashx|\.aspx|homeScore|guestScore).{0,125}",html,re.I)
                  return name,len(raw),hits[:35]
              except Exception as error:
                  return name,type(error).__name__,str(error)
          with ThreadPoolExecutor(max_workers=5) as pool:
              for row in pool.map(inspect,pages.items()):
                  print(row,flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: 007-desktop-match-evidence
          path: '*.html'
          if-no-files-found: error
