name: Inspect 007 football regulation result evidence
on:
  push:
    branches: [codex/inspect-football-regulation-results]
    paths: ['.github/workflows/inspect-football-regulation-results.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read 007 match pages and their public event scripts
        run: |
          python3 - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          import re
          from urllib.request import Request, urlopen
          pages = {
              "mobile-3110400":"https://m.titan007.com/analy/Analysis/3110400.htm",
              "mobile-3110401":"https://m.titan007.com/analy/Analysis/3110401.htm",
              "mobile-3110402":"https://m.titan007.com/analy/Analysis/3110402.htm",
              "mobile-3110403":"https://m.titan007.com/analy/Analysis/3110403.htm",
              "desktop":"https://zq.titan007.com/analysis/3110400cn.htm",
              "detail-script":"https://m.titan007.com/script/DetailLive.js?ver=9",
              "event-script":"https://m.titan007.com/script/eventNew.js?ver=5",
          }
          def inspect(item):
              name,url=item
              try:
                  req=Request(url,headers={"User-Agent":"Mozilla/5.0","Referer":"https://m.titan007.com/analy/Analysis/3110400.htm"})
                  with urlopen(req,timeout=12) as response:
                      raw=response.read(1000000)
                  html=raw.decode("utf-8-sig",errors="replace")
                  hits=re.findall(r".{0,90}(?:加时|点球|常规时间|90分钟|首回合|第一回合|下半场结束|ShowLiveHead|url\s*:|\.ashx|\.aspx|homeScore|guestScore).{0,125}",html,re.I)
                  return name,len(raw),hits[:35]
              except Exception as error:
                  return name,type(error).__name__,str(error)
          with ThreadPoolExecutor(max_workers=5) as pool:
              for row in pool.map(inspect,pages.items()):
                  print(row,flush=True)
          PY
