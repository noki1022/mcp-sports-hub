name: Football 007 live JC capture + isolated analysis (no delivery)
on:
  pull_request:
    paths:
      - 'scripts/football_007_live_capture.py'
      - 'scripts/football_007_mobile_probe.py'
      - 'scripts/football_007_deep_probe.py'
      - 'scripts/football_007_jc_market_probe.py'
      - 'tests/test_football_007_live_capture.py'
      - '.github/workflows/football-007-live-capture.yml'
  workflow_dispatch:
  schedule:
    # Beijing 12:00, 18:00, 21:30, 06:30; source-only, no prediction push.
    - cron: "0 4 * * *"
    - cron: "0 10 * * *"
    - cron: "30 13 * * *"
    - cron: "30 22 * * *"
permissions:
  contents: read
concurrency:
  group: football-007-capture-${{ github.ref }}
  cancel-in-progress: false
jobs:
  live-football:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate 007 real fixture and official odds record contracts offline
        run: |
          python3 -B -m unittest discover -s tests -p test_football_007_live_capture.py -v
          python3 -B -m unittest discover -s tests -p test_football_jc.py -v
      - name: Capture actual public 007 soccer schedule and JC 1X2 / integer handicap
        run: |
          python3 -B scripts/football_007_live_capture.py --out football-output/football_007_snapshot.json --raw-dir football-output/raw
      - name: Audit actual 007 mobile H2H recent-form and injury source structure
        if: github.event_name != 'schedule'
        run: python3 -B scripts/football_007_mobile_probe.py
      - name: Forensic inspect live 007 football analysis script loaders (PR only)
        if: github.event_name == 'pull_request'
        run: python3 -B scripts/football_007_deep_probe.py
      - name: Inspect verified JC site scripts for total-goals market endpoints (PR only)
        if: github.event_name == 'pull_request'
        run: python3 -B scripts/football_007_jc_market_probe.py
      - name: Analyze captured board without inventing missing form, injuries or TTG quotes
        run: |
          python3 -B analysis/football_jc_probability.py --input football-output/football_007_snapshot.json --out football-output/football_jc_forecast.json
          python3 -B analysis/football_jc_report.py --forecast football-output/football_jc_forecast.json --html football-output/football_jc_mobile.html
      - name: Upload 007 source audit and research outputs, never push basketball or football
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-007-live-source-evidence
          path: football-output/
          retention-days: 90

  archive-football-raw-release:
    needs: live-football
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: football-007-live-source-evidence
          path: football-output
      - name: Persist immutable football-only raw evidence in GitHub Release assets
        run: |
          test -s football-output/raw/fixtures.txt.gz
          test -s football-output/raw/jc_odds.txt.gz
          test -s football-output/raw/manifest.json
          bj_day="$(TZ=Asia/Shanghai date +%Y%m%d)"
          tag="football-007-raw-$bj_day"
          archive="football-007-raw-$bj_day-run-${{ github.run_id }}.zip"
          zip -q -r "$archive" football-output/
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target main --title "Football 007 raw $bj_day" \
              --notes "Independent soccer JC raw source vault. No NBA data or prediction delivery."
          fi
          gh release upload "$tag" "$archive"
          echo "FOOTBALL_007_RAW_RELEASE_ARCHIVED=$tag/$archive"
