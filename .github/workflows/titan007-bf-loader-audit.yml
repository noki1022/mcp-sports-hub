name: Titan007 BF schedule loader audit
on:
  push:
    branches: ["audit/titan007-live-20261028"]
    paths: [".github/workflows/titan007-bf-loader-audit.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Examine publicly referenced schedule JS data path logic
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.robotparser,re,json
          from datetime import datetime,timezone
          ua='Titan007DataResearch/1.0';root='https://bf.titan007.com'
          with urllib.request.urlopen(urllib.request.Request(root+'/robots.txt',headers={'User-Agent':ua}),timeout=10) as r:robots=r.read(30000).decode('utf-8','replace')
          rp=urllib.robotparser.RobotFileParser();rp.parse(robots.splitlines())
          url=root+'/funcNba.js'
          report={'url':url,'robots_permits':rp.can_fetch(ua,url)}
          if report['robots_permits']:
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':ua}),timeout=12) as r:
                js=r.read(400001).decode('gb18030','replace')
                report.update(status=r.status,bytes=len(js))
              patterns=['function loadScore','function seldate','function selectDate','ScoreFile','NBA/','nba_','sc_date','getXmlData','function getXmlData']
              report['matches']={}
              for pat in patterns:
                ms=list(re.finditer(re.escape(pat),js,re.I))
                report['matches'][pat]={'count':len(ms),'context':[js[max(0,m.start()-280):m.start()+1100] for m in ms[:5]]}
              report['path_literals']=list(dict.fromkeys(re.findall(r'["\x27]([^"\x27]{1,140}(?:\.xml|\.aspx|\.txt|\.js))["\x27]',js,re.I)))[:35]
            except Exception as e:report['error']=type(e).__name__+': '+str(e)[:200]
          with open('bf_loader_audit.json','w') as f:json.dump(report,f,ensure_ascii=False,indent=2)
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan007-bf-loader-audit
          path: bf_loader_audit.json
