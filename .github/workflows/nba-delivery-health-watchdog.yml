name: NBA read-only delivery receipt audit (never retry or send)
on:
  workflow_dispatch:
    inputs:
      slot:
        description: Canonical Beijing slot
        required: true
        type: string
      target_date:
        description: Beijing game display date YYYY-MM-DD
        required: true
        type: string
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      HEALTH_INPUT_SLOT: ${{ inputs.slot || '' }}
      HEALTH_INPUT_DATE: ${{ inputs.target_date || '' }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Audit acceptance marker without dispatching or messaging
        run: |
          python3 scripts/nba_delivery_health.py --self-test
          test -n "$HEALTH_INPUT_SLOT" && test -n "$HEALTH_INPUT_DATE"
          python3 scripts/nba_delivery_health.py --slot "$HEALTH_INPUT_SLOT" --target-date "$HEALTH_INPUT_DATE" --out nba_delivery_health.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-delivery-audit-${{ github.run_id }}
          path: nba_delivery_health.json
          if-no-files-found: ignore
          retention-days: 14
