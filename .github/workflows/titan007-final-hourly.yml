name: Titan007 NBA/CBA final one-hour report
on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Display date YYYY-MM-DD; default is today in Asia/Shanghai"
        required: false
        type: string
  schedule:
    - cron: "*/10 * * * *"
permissions:
  contents: write
concurrency:
  group: titan007-final-hourly-${{ github.ref }}
  cancel-in-progress: true
jobs:
  final-window:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      REQUESTED_DATE: ${{ inputs.target_date || '' }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Select current Asia/Shanghai display date
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import os,re
          from datetime import datetime
          from zoneinfo import ZoneInfo
          x=os.environ.get('REQUESTED_DATE','').strip()
          if x and not re.fullmatch(r'\d{4}-\d{2}-\d{2}',x): raise ValueError('invalid target date')
          print('TARGET_DATE='+ (x or datetime.now(ZoneInfo('Asia/Shanghai')).date().isoformat()))
          PY
      - name: Join current 007 markets with bounded retries
        run: |
          for attempt in 1 2 3; do
            if python3 scripts/titan007_join_daily.py --date "$TARGET_DATE" --out titan007_joined_today.json; then
              exit 0
            fi
            echo "007 fetch attempt $attempt failed; retrying"
            sleep 8
          done
          echo "007 source unavailable after 3 attempts"
          exit 1
      - name: Select 25–35 minute final window centered on 30 minutes
        run: python3 scripts/titan007_final_window.py --infile titan007_joined_today.json --outfile titan007_final_window.json
      - name: Render final mobile report when a game is in window
        run: |
          python3 scripts/titan007_report.py --joined titan007_final_window.json --html titan007_final_hour_report.html --csv titan007_final_hour_report.csv
          python3 analysis/titan007_daily_market.py --joined titan007_final_window.json --out titan007_final_hour_market.json
      - name: Restore PushPlus sent-state cache
        uses: actions/cache@v4
        with:
          path: .pushplus-state
          key: pushplus-state-${{ github.run_id }}
          restore-keys: pushplus-state-
      - name: Push final report to WeChat via PushPlus
        if: env.PUSHPLUS_TOKEN != ''
        run: |
          python3 - <<'PY'
          import json,os,urllib.parse,urllib.request
          from pathlib import Path
          src=json.loads(Path('titan007_final_window.json').read_text())
          games=src.get('nba_cba_games',[])
          if not games:
              print('NO_FINAL_WINDOW_GAME_NO_PUSH'); raise SystemExit(0)
          state=Path('.pushplus-state/sent.json'); state.parent.mkdir(parents=True,exist_ok=True)
          sent=set(json.loads(state.read_text()) if state.exists() else [])
          fresh=[g for g in games if g.get('game_id') not in sent]
          if not fresh:
              print('FINAL_WINDOW_ALREADY_SENT_NO_PUSH'); raise SystemExit(0)
          market_rows=json.loads(Path('titan007_final_hour_market.json').read_text()).get('row_data',[]) if Path('titan007_final_hour_market.json').exists() else []
          by_game={}
          for r in market_rows:
              if r.get('stage')=='current': by_game.setdefault(r.get('game_id'),{})[r.get('market')]=r
          rows=[]
          for g in fresh:
              m=by_game.get(g.get('game_id'),{})
              sp=m.get('full_spread',{}); tt=m.get('full_total',{})
              rows.append(f"{g.get('display_clock')} 主队：{g.get('home_team')} vs 客队：{g.get('away_team')}\\n让分：{sp.get('line','—')}（主/客去水 {sp.get('devig_side1','—')} / {sp.get('devig_side2','—')}）\\n总分：{tt.get('line','—')}（大/小去水 {tt.get('devig_side1','—')} / {tt.get('devig_side2','—')}）")
          title='NBA/CBA 开赛前30分钟临场报告'
          content='\\n\\n'.join(rows)+'\\n\\n盘口已重新抓取；以上为市场倾向，不是独立校准模型，统一 NO_BET。'
          data=urllib.parse.urlencode({'token':os.environ['PUSHPLUS_TOKEN'],'title':title,'content':content,'template':'txt'}).encode()
          req=urllib.request.Request('https://www.pushplus.plus/send',data=data,method='POST')
          with urllib.request.urlopen(req,timeout=15) as r:
              body=r.read().decode('utf-8','replace')
              if r.status != 200 or '200' not in body: raise RuntimeError('PushPlus rejected request')
          state.write_text(json.dumps(sorted(sent|{g.get('game_id') for g in fresh})))
          print('PUSHPLUS_SENT_GAMES',len(fresh))
          PY
      - name: Archive final report in repository when games exist
        if: ${{ success() }}
        run: |
          count=$(python3 -c "import json; print(len(json.load(open('titan007_final_window.json')).get('nba_cba_games',[])))")
          if [ "$count" -gt 0 ]; then
            stamp=$(date -u +%Y%m%dT%H%M%SZ)
            dir="reports/final-window/${TARGET_DATE}/${stamp}"
            mkdir -p "$dir"
            cp titan007_final_window.json titan007_final_hour_report.html titan007_final_hour_report.csv titan007_final_hour_market.json "$dir"/
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add "$dir"
            git commit -m "Archive Titan007 final window ${TARGET_DATE} ${stamp}"
            git push
          else
            echo "No final-window games; no repository archive commit"
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan007-final-window-${{ env.TARGET_DATE }}
          path: |
            titan007_joined_today.json
            titan007_final_window.json
            titan007_final_hour_report.html
            titan007_final_hour_report.csv
            titan007_final_hour_market.json
          if-no-files-found: warn
          retention-days: 14
