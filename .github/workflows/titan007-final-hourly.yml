name: Titan007 NBA/CBA final one-hour report
on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Beijing NBA tipoff date YYYY-MM-DD; defaults to next morning"
        required: false
        type: string
  schedule:
    # 21:30 belongs exclusively to priority pre-22:00 full report.
    # 06:30 is exclusively the highest-priority complete morning report.
    # Ordinary hourly conditional alerts run Beijing 22:30-05:30.
    - cron: "30 14-21 * * *"
permissions:
  contents: write
concurrency:
  group: titan007-final-hourly-${{ github.ref }}
  cancel-in-progress: false
jobs:
  final-window:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      REQUESTED_DATE: ${{ inputs.target_date || '' }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked NBA numerical dependency
        run: python3 -m pip install --disable-pip-version-check --quiet "numpy==2.2.6"
      - name: Select current Asia/Shanghai display date
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import os,re
          from datetime import datetime,timedelta,time,date
          from zoneinfo import ZoneInfo
          x=os.environ.get('REQUESTED_DATE','').strip()
          if x:
              if not re.fullmatch(r'\d{4}-\d{2}-\d{2}',x): raise ValueError('invalid target date')
              date.fromisoformat(x)
              target=x
          else:
              now=datetime.now(ZoneInfo('Asia/Shanghai'))
              target=(now.date()+timedelta(days=1) if now.time()>=time(21,30) else now.date()).isoformat()
          print('TARGET_DATE='+target)
          PY
      - name: Resolve canonical hourly slot; skip if API already accepted
        id: hourly_gate
        run: |
          python3 scripts/nba_delivery_health.py --print-hourly-slot >> "$GITHUB_ENV"
          git pull --ff-only origin main
          slot=$(sed -n 's/^HOURLY_REPORT_SLOT=//p' "$GITHUB_ENV" | tail -1)
          echo "HOURLY_REPORT_SLOT=$slot" >> "$GITHUB_ENV"
          if test -f "reports/pushplus-sent/$TARGET_DATE/$slot.json"; then
            python3 - <<'PY'
          import os,json
          from pathlib import Path
          p=Path('reports/pushplus-sent')/os.environ['TARGET_DATE']/(os.environ['HOURLY_REPORT_SLOT']+'.json')
          try: good=json.loads(p.read_text()).get('state')=='API_ACCEPTED_NOT_DEVICE_CONFIRMED'
          except (OSError,ValueError):good=False
          print('HOURLY_MARKER_VERIFIED',good)
          if good:Path('/tmp/hourly_already_accepted').touch()
          PY
          fi
          if test -f /tmp/hourly_already_accepted; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Join Beijing NBA fixtures to dated 007 markets with bounded retries
        if: steps.hourly_gate.outputs.skip != 'true'
        run: |
          for attempt in 1 2 3; do
            if python3 scripts/titan007_join_beijing_verified.py --date "$TARGET_DATE" --out titan007_joined_today.json; then
              exit 0
            fi
            echo "007 fetch attempt $attempt failed; retrying"
            sleep 8
          done
          echo "007 source unavailable after 3 attempts"
          exit 1
      - name: Verify all included NBA tipoffs are on requested Beijing day
        if: steps.hourly_gate.outputs.skip != 'true'
        run: |
          python3 - <<'PY'
          import json,os
          from datetime import datetime
          data=json.load(open('titan007_joined_today.json'))
          for game in data['nba_cba_games']:
            assert game['display_date']==os.environ['TARGET_DATE']
            assert datetime.fromisoformat(game['start_time_beijing']).date().isoformat()==os.environ['TARGET_DATE']
          print('HOURLY_BEIJING_GAME_DAY_VALIDATED',len(data['nba_cba_games']))
          PY
      - name: Refresh committed history before comparison
        if: steps.hourly_gate.outputs.skip != 'true'
        run: git pull --ff-only origin main
      - name: Enforce same official NBA slate locked at noon
        if: steps.hourly_gate.outputs.skip != 'true'
        run: |
          python3 scripts/nba_noon_slate.py enforce --joined titan007_joined_today.json --lock "reports/noon-cohorts/$TARGET_DATE/1200.json" --out nba_same_slate.json
      - name: Preserve full-board snapshot and compare prior market movement
        if: steps.hourly_gate.outputs.skip != 'true'
        run: |
          python3 analysis/titan007_hourly_history.py capture --current titan007_joined_today.json --root reports/hourly --daily-root reports/daily --out-movement titan007_hourly_movement.json
      - name: Commit valid compact snapshot for next hour
        if: steps.hourly_gate.outputs.skip != 'true'
        run: |
          if [ -n "$(find reports/hourly -type f -name '*.json' -print -quit 2>/dev/null)" ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add reports/hourly/
            if ! git diff --cached --quiet; then
              git commit -m "Store hourly NBA market snapshot for $TARGET_DATE"
              for n in 1 2 3; do
                if git push; then exit 0; fi
                git pull --rebase origin main
                sleep 3
              done
              echo 'Failed to persist required hourly snapshot' >&2
              exit 1
            fi
          fi
      - name: Select 3–30 minute final window
        if: steps.hourly_gate.outputs.skip != 'true'
        run: python3 scripts/titan007_final_window.py --infile titan007_joined_today.json --outfile titan007_final_window.json
      - name: Generate independent model for entire hourly board
        if: steps.hourly_gate.outputs.skip != 'true'
        run: |
          python3 analysis/nba_prediction_adapter.py --self-test
          python3 analysis/nba_prediction_adapter.py --joined titan007_joined_today.json --out nba_independent_predictions_gate.json
      - name: Collect official injury status, fail closed if unavailable
        if: steps.hourly_gate.outputs.skip != 'true'
        run: |
          python3 -m pip install --disable-pip-version-check --quiet "pdfplumber==0.11.7"
          python3 analysis/nba_official_injury.py --date "$TARGET_DATE" --out nba_official_injuries.json || echo "OFFICIAL_INJURY_UNAVAILABLE_NO_INFERRED_HEALTH"
          python3 analysis/nba_injury_context.py --joined titan007_joined_today.json --injuries nba_official_injuries.json --out nba_injury_context.json
      - name: Render final mobile report when a game is in window
        if: steps.hourly_gate.outputs.skip != 'true'
        run: |
          python3 scripts/titan007_report.py --joined titan007_final_window.json --html titan007_final_hour_report.html --csv titan007_final_hour_report.csv
          python3 analysis/titan007_daily_market.py --joined titan007_final_window.json --out titan007_final_hour_market.json
          python3 analysis/market_decision_gate.py --market titan007_final_hour_market.json --predictions nba_independent_predictions_gate.json --out titan007_final_decision.json
          python3 analysis/market_value_policy.py --self-test
          python3 analysis/market_value_policy.py --market-decision titan007_final_decision.json --out market_value_policy.json
          python3 analysis/nba_model_report.py --joined titan007_joined_today.json --predictions nba_independent_predictions_gate.json --out-json nba_model_analysis.json --out-html nba_model_analysis.html --injury-context nba_injury_context.json
      - name: Audit market B and fusion C without directional assumptions
        if: steps.hourly_gate.outputs.skip != 'true'
        run: |
          python3 analysis/nba_market_bc_diagnostics.py --joined titan007_joined_today.json --movement titan007_hourly_movement.json --model nba_model_analysis.json --out nba_market_bc_diagnostics.json
      - name: Assess full-board hourly market dynamics against independent model
        if: steps.hourly_gate.outputs.skip != 'true'
        run: |
          python3 analysis/nba_hourly_dynamic_review.py --movement titan007_hourly_movement.json --model nba_model_analysis.json --injury nba_injury_context.json --out nba_hourly_dynamic_review.json
      - name: Audit all three user-supplied Jingcai pricing sources before market fusion
        if: steps.hourly_gate.outputs.skip != 'true'
        env:
          MARZDATA_APP_ID: ${{ secrets.MARZDATA_APP_ID }}
          MARZDATA_APP_SECRET: ${{ secrets.MARZDATA_APP_SECRET }}
          MARZDATA_STATIC_EGRESS_CONFIRMED: ${{ vars.MARZDATA_STATIC_EGRESS_CONFIRMED }}
          MARZDATA_SLOT_ORDER_CONFIRMED: ${{ vars.MARZDATA_SLOT_ORDER_CONFIRMED }}
        run: |
          # Authorized data remains disabled unless both secrets and approved fixed egress are set.
          # No credentials are ever written to artifacts or logs.
          python3 scripts/titan007_jingcai_three_market.py --joined titan007_joined_today.json --out nba_jingcai_three_market.json
          python3 - <<'PY'
          import json
          x=json.load(open("nba_jingcai_three_market.json"))
          assert set(x["source_status"])==set(("WIN_LOSE","HANDICAP_WIN_LOSE","TOTAL"))
          assert x["game_count"]==len(x["games"])
          print("JINGCAI_REQUIRED_SOURCE_AUDIT",x["status"],x["verified_games_with_all_three"])
          PY
      - name: Capture 007 visible top-ten companies and compare last stored sample
        if: steps.hourly_gate.outputs.skip != 'true'
        run: |
          python3 scripts/titan007_top10_companies.py --joined titan007_joined_today.json --out nba_top10_companies.json --analysis nba_top10_comparison.json --history-root reports/top10
      - name: Persist top-ten institution snapshots for next scheduled comparison
        if: steps.hourly_gate.outputs.skip != 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/top10/
          if ! git diff --cached --quiet; then
            git commit -m "Archive 007 top-ten company market capture $TARGET_DATE"
            for n in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              git pull --rebase origin main
              if [ "$n" -eq 3 ]; then exit 1; fi
            done
          fi
      - name: Freeze five independent Jingcai/Crown NBA research directions
        if: steps.hourly_gate.outputs.skip != 'true'
        run: |
          python3 analysis/nba_five_markets.py \
            --joined titan007_joined_today.json \
            --model nba_model_analysis.json \
            --jingcai nba_jingcai_three_market.json \
            --top10 nba_top10_comparison.json \
            --out nba_five_market_forecast.json
          python3 analysis/nba_injury_prerequisite.py --five nba_five_market_forecast.json --injury nba_injury_context.json --out nba_five_market_forecast_gated.json
          mv nba_five_market_forecast_gated.json nba_five_market_forecast.json
          python3 - <<'PY'
          import json
          x=json.load(open("nba_five_market_forecast.json"))
          assert x["game_count"]>0 and len(x["market_keys"])==5
          assert all(set(g["markets"])==set(x["market_keys"]) for g in x["games"])
          print("FIVE_MARKET_SNAPSHOT_FROZEN",x["game_count"],x["ready_counts"])
          PY
      - name: Generate mandatory NBA spread and total research verdicts from ten institutions
        if: steps.hourly_gate.outputs.skip != 'true'
        run: |
          python3 analysis/nba_two_market_forecast.py --joined titan007_joined_today.json --model nba_model_analysis.json --top10 nba_top10_comparison.json --out nba_two_market_forecast.json
      - name: Enforce seven-stage 007 NBA analysis SOP before PushPlus
        if: steps.hourly_gate.outputs.skip != 'true'
        run: |
          python3 analysis/nba_analysis_sop.py \
            --joined titan007_joined_today.json \
            --model nba_model_analysis.json \
            --prediction-gate nba_independent_predictions_gate.json \
            --movement titan007_hourly_movement.json \
            --jingcai nba_jingcai_three_market.json \
            --top10 nba_top10_comparison.json \
            --injury nba_injury_context.json \
            --out nba_analysis_sop.json
          python3 - <<'PY'
          import json
          x=json.load(open('nba_analysis_sop.json'))
          assert x['game_count']>0
          assert x['candidate_count']==0 and x['decision']=='NO_BET'
          assert all(v['recommendation']=='NO_BET' for v in x['games'])
          assert len(x['stages'])==7
          print('NBA_SOP_PRESEND_EVIDENCE_GATE_PASS',x['game_count'],x['verified_jingcai_ids'])
          PY
      - name: Enforce analyzed same-capture market and independent model
        if: steps.hourly_gate.outputs.skip != 'true'
        run: |
          python3 scripts/verify_nba_capture_analysis.py --joined titan007_joined_today.json --movement titan007_hourly_movement.json --model nba_model_analysis.json --dynamic nba_hourly_dynamic_review.json --out nba_capture_audit.json
      - name: Render iPhone market movement with independent model
        if: steps.hourly_gate.outputs.skip != 'true'
        run: python3 analysis/titan007_hourly_history.py render --movement titan007_hourly_movement.json --model nba_model_analysis.json --out-html titan007_hourly_movement.html
      - name: Save full hourly review for next-hour model context
        if: steps.hourly_gate.outputs.skip != 'true'
        run: |
          mkdir -p "reports/hourly-reviews/$TARGET_DATE"
          cp nba_hourly_dynamic_review.json "reports/hourly-reviews/$TARGET_DATE/${GITHUB_RUN_ID}.json"
          mkdir -p "reports/two-market-intraday/$TARGET_DATE"
          cp nba_two_market_forecast.json "reports/two-market-intraday/$TARGET_DATE/${GITHUB_RUN_ID}.json"
          mkdir -p "reports/five-market-intraday/$TARGET_DATE"
          cp nba_five_market_forecast.json "reports/five-market-intraday/$TARGET_DATE/${GITHUB_RUN_ID}.json"
          git add "reports/two-market-intraday/$TARGET_DATE/"
          git add "reports/five-market-intraday/$TARGET_DATE/"
          git add reports/hourly-reviews/
          if ! git diff --cached --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m "Archive full-board hourly dynamic model review $TARGET_DATE"
            for n in 1 2 3; do
              if git push; then exit 0; fi
              git pull --rebase origin main
            done
            exit 1
          fi
      - name: Send concise iPhone PushPlus alert on significant changes or final window
        if: ${{ success() }}
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          python3 scripts/pushplus_mobile.py --mode hourly --movement titan007_hourly_movement.json --window titan007_final_window.json --model nba_model_analysis.json --dynamic nba_hourly_dynamic_review.json --top10 nba_top10_comparison.json --jingcai nba_jingcai_three_market.json --verdict nba_two_market_forecast.json --sop nba_analysis_sop.json --five nba_five_market_forecast.json --preview pushplus_mobile_preview.html --status pushplus_status.json --send --require-token --require-delivery
      # Final-hour snapshots are short-retention artifacts. No scheduled commits
      # to main, and never archive incomplete runs.
      - name: Persist actual hourly PushPlus API acceptance for dedup and monitoring
        if: ${{ success() && steps.hourly_gate.outputs.skip != 'true' }}
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads(Path('pushplus_status.json').read_text())
          if data.get('state')!='API_ACCEPTED_NOT_DEVICE_CONFIRMED':
              raise RuntimeError('HOURLY_NOTIFICATION_NOT_API_ACCEPTED')
          p=Path('reports/pushplus-sent')/os.environ['TARGET_DATE']/(os.environ['HOURLY_REPORT_SLOT']+'.json')
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps({'state':data['state'],'slot':os.environ['HOURLY_REPORT_SLOT'],
              'target_date':os.environ['TARGET_DATE'],'run_id':os.environ['GITHUB_RUN_ID']})+'\n')
          print('HOURLY_DELIVERY_MARKED',p)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "reports/pushplus-sent/$TARGET_DATE/$HOURLY_REPORT_SLOT.json"
          git commit -m "Mark verified hourly PushPlus acceptance $TARGET_DATE $HOURLY_REPORT_SLOT"
          for n in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
      - name: Check final report completeness before publication
        if: success()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ("titan007_final_window.json", "titan007_final_hour_market.json",
                       "titan007_final_decision.json", "nba_independent_predictions_gate.json",
                       "nba_model_analysis.json", "titan007_final_hour_report.html"):
              p=Path(name)
              if not p.is_file() or p.stat().st_size==0:
                  raise RuntimeError(f"INCOMPLETE_FINAL_WINDOW_REPORT: {name}")
          games=json.loads(Path("titan007_final_window.json").read_text(encoding="utf-8")).get("nba_cba_games", [])
          print("FINAL_REPORT_COMPLETE",len(games))
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan007-final-window-${{ env.TARGET_DATE }}
          path: |
            titan007_joined_today.json
            reports/hourly/**/*.json
            titan007_final_window.json
            titan007_final_hour_report.html
            titan007_final_hour_report.csv
            titan007_final_hour_market.json
            titan007_final_decision.json
            nba_independent_predictions_gate.json
            nba_model_analysis.json
            nba_top10_companies.json
            nba_top10_comparison.json
            nba_jingcai_three_market.json
            nba_two_market_forecast.json
            nba_capture_audit.json
            nba_market_bc_diagnostics.json
            nba_hourly_dynamic_review.json
            reports/hourly-reviews/**/*.json
            nba_injury_context.json
            nba_official_injuries.json
            nba_model_analysis.html
            titan007_hourly_movement.json
            titan007_hourly_movement.html
            pushplus_mobile_preview.html
            pushplus_status.json
          if-no-files-found: warn
          retention-days: 7
