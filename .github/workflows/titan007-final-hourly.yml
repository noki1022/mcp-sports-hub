name: Titan007 NBA/CBA final one-hour report
on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Display date YYYY-MM-DD; default is today in Asia/Shanghai"
        required: false
        type: string
  schedule:
    # Beijing 21:30 through next-day 06:30, hourly (UTC 13:30-22:30).
    - cron: "30 13-22 * * *"
permissions:
  contents: write
concurrency:
  group: titan007-final-hourly-${{ github.ref }}
  cancel-in-progress: false
jobs:
  final-window:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      REQUESTED_DATE: ${{ inputs.target_date || '' }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked NBA numerical dependency
        run: python3 -m pip install --disable-pip-version-check --quiet "numpy==2.2.6"
      - name: Select current Asia/Shanghai display date
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import os,re
          from datetime import datetime,timedelta,time,date
          from zoneinfo import ZoneInfo
          x=os.environ.get('REQUESTED_DATE','').strip()
          if x:
              if not re.fullmatch(r'\d{4}-\d{2}-\d{2}',x): raise ValueError('invalid target date')
              date.fromisoformat(x)
              target=x
          else:
              now=datetime.now(ZoneInfo('Asia/Shanghai'))
              target=(now.date()+timedelta(days=1) if now.time()>=time(21,30) else now.date()).isoformat()
          print('TARGET_DATE='+target)
          PY
      - name: Join current 007 markets with bounded retries
        run: |
          for attempt in 1 2 3; do
            if python3 scripts/titan007_join_daily.py --date "$TARGET_DATE" --out titan007_joined_today.json; then
              exit 0
            fi
            echo "007 fetch attempt $attempt failed; retrying"
            sleep 8
          done
          echo "007 source unavailable after 3 attempts"
          exit 1
      - name: Preserve full-board snapshot and compare prior market movement
        run: |
          python3 analysis/titan007_hourly_history.py capture --current titan007_joined_today.json --root reports/hourly --daily-root reports/daily --out-movement titan007_hourly_movement.json
      - name: Commit valid compact snapshot for next hour
        run: |
          if [ -n "$(find reports/hourly -type f -name '*.json' -print -quit 2>/dev/null)" ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add reports/hourly/
            if ! git diff --cached --quiet; then
              git commit -m "Store hourly NBA market snapshot for $TARGET_DATE"
              for n in 1 2 3; do
                if git push; then exit 0; fi
                git pull --rebase origin main
                sleep 3
              done
              echo 'Failed to persist required hourly snapshot' >&2
              exit 1
            fi
          fi
      - name: Select 3–30 minute final window
        run: python3 scripts/titan007_final_window.py --infile titan007_joined_today.json --outfile titan007_final_window.json
      - name: Generate odds-blind NBA prediction artifact
        run: |
          python3 analysis/nba_prediction_adapter.py --self-test
          python3 analysis/nba_prediction_adapter.py --joined titan007_final_window.json --out nba_independent_predictions_gate.json
      - name: Render final mobile report when a game is in window
        run: |
          python3 scripts/titan007_report.py --joined titan007_final_window.json --html titan007_final_hour_report.html --csv titan007_final_hour_report.csv
          python3 analysis/titan007_daily_market.py --joined titan007_final_window.json --out titan007_final_hour_market.json
          python3 analysis/market_decision_gate.py --market titan007_final_hour_market.json --predictions nba_independent_predictions_gate.json --out titan007_final_decision.json
          python3 analysis/market_value_policy.py --self-test
          python3 analysis/market_value_policy.py --market-decision titan007_final_decision.json --out market_value_policy.json
          python3 analysis/nba_model_report.py --joined titan007_final_window.json --predictions nba_independent_predictions_gate.json --out-json nba_model_analysis.json --out-html nba_model_analysis.html
      - name: Render iPhone market movement with independent model
        run: python3 analysis/titan007_hourly_history.py render --movement titan007_hourly_movement.json --model nba_model_analysis.json --out-html titan007_hourly_movement.html
      - name: Restore PushPlus sent-state cache
        uses: actions/cache@v4
        with:
          path: .pushplus-state
          key: pushplus-state-${{ github.run_id }}
          restore-keys: pushplus-state-
      - name: Push readable final report to WeChat via PushPlus
        if: ${{ success() && env.PUSHPLUS_TOKEN != '' }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.parse,urllib.request
          from pathlib import Path
          src=json.loads(Path('titan007_final_window.json').read_text(encoding='utf-8'))
          games=src.get('nba_cba_games',[])
          if not games:
              print('NO_FINAL_WINDOW_GAME_NO_PUSH')
              raise SystemExit(0)
          state=Path('.pushplus-state/sent.json')
          state.parent.mkdir(parents=True,exist_ok=True)
          sent=set(json.loads(state.read_text()) if state.exists() else [])
          fresh=[g for g in games if g.get('game_id') not in sent]
          if not fresh:
              print('FINAL_WINDOW_ALREADY_SENT_NO_PUSH')
              raise SystemExit(0)
          market_rows=json.loads(Path('titan007_final_hour_market.json').read_text(encoding='utf-8')).get('row_data',[])
          by_game={}
          for row in market_rows:
              if row.get('stage')=='current':
                  by_game.setdefault(str(row.get('game_id')),{})[row.get('market')]=row
          messages=[]
          for game in fresh:
              game_id=str(game.get('game_id'))
              markets=by_game.get(game_id,{})
              spread=markets.get('full_spread',{})
              total=markets.get('full_total',{})
              opening=game.get('markets',{})
              opening_spread=opening.get('full_spread',{}).get('opening',{})
              opening_total=opening.get('full_total',{}).get('opening',{})
              spread_move=f"{opening_spread.get('line','—')} → {spread.get('line','—')}"
              total_move=f"{opening_total.get('line','—')} → {total.get('line','—')}"
              messages.append("\n".join([
                  f"比赛：{game.get('display_clock','—')}",
                  f"主队：{game.get('home_team','—')}",
                  f"客队：{game.get('away_team','—')}",
                  f"距离开赛：{game.get('final_window_minutes_to_tip','—')} 分钟",
                  f"让分变化：{spread_move}",
                  f"让分市场去水：原始槽位1 {spread.get('devig_side1','—')} / 原始槽位2 {spread.get('devig_side2','—')}",
                  f"总分变化：{total_move}",
                  f"大小分市场去水：原始槽位1 {total.get('devig_side1','—')} / 原始槽位2 {total.get('devig_side2','—')}",
                  "独赢：本次007临场源未提供可验证的独赢市场",
                  "伤停：本次临场工作流未取得匹配的官方临场伤停确认",
                  "数据质量：主客队和比赛ID已匹配；007显示时区及水位方向仍未独立核验",
                  "结论：独立模型已生成；盘口原始槽位方向未核验，NO_BET"
              ]))
          title='NBA/CBA 开赛前3–30分钟临场报告'
          content="\n\n".join(messages)
          data=urllib.parse.urlencode({'token':os.environ['PUSHPLUS_TOKEN'],'title':title,'content':content,'template':'txt'}).encode()
          request=urllib.request.Request('https://www.pushplus.plus/send',data=data,method='POST')
          try:
              with urllib.request.urlopen(request,timeout=15) as response:
                  body=response.read().decode('utf-8','replace')
                  print('PUSHPLUS_HTTP_STATUS',response.status)
                  print('PUSHPLUS_RESPONSE_CODE',body[:300])
                  if response.status != 200 or '"code":200' not in body and '"code": "200"' not in body:
                      raise RuntimeError('PushPlus rejected request')
          except Exception as exc:
              print('PUSHPLUS_ERROR',type(exc).__name__,str(exc)[:300])
              raise
          state.write_text(json.dumps(sorted(sent|{g.get('game_id') for g in fresh}),ensure_ascii=False))
          print('PUSHPLUS_SENT_GAMES',len(fresh))
          PY
      # Final-hour snapshots are short-retention artifacts. No scheduled commits
      # to main, and never archive incomplete runs.
      - name: Check final report completeness before publication
        if: success()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ("titan007_final_window.json", "titan007_final_hour_market.json",
                       "titan007_final_decision.json", "nba_independent_predictions_gate.json",
                       "nba_model_analysis.json", "titan007_final_hour_report.html"):
              p=Path(name)
              if not p.is_file() or p.stat().st_size==0:
                  raise RuntimeError(f"INCOMPLETE_FINAL_WINDOW_REPORT: {name}")
          games=json.loads(Path("titan007_final_window.json").read_text(encoding="utf-8")).get("nba_cba_games", [])
          print("FINAL_REPORT_COMPLETE",len(games))
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan007-final-window-${{ env.TARGET_DATE }}
          path: |
            titan007_joined_today.json
            titan007_final_window.json
            titan007_final_hour_report.html
            titan007_final_hour_report.csv
            titan007_final_hour_market.json
            titan007_final_decision.json
            nba_independent_predictions_gate.json
            nba_model_analysis.json
            nba_model_analysis.html
            titan007_hourly_movement.json
            titan007_hourly_movement.html
          if-no-files-found: warn
          retention-days: 7
