name: Verify hourly NBA market snapshot movement
on:
  push:
    branches: [fix/hourly-market-snapshots-and-movement-20261030, fix/hourly-snapshot-stability-full-model-20261030]
  pull_request:
    branches: [main]
    paths:
      - 'analysis/titan007_hourly_history.py'
      - 'analysis/nba_hourly_dynamic_review.py'
      - 'analysis/nba_prediction_adapter.py'
      - 'scripts/verify_nba_capture_analysis.py'
      - 'scripts/pushplus_mobile.py'
      - 'scripts/pushplus_mobile_v2.py'
      - '.github/workflows/titan007-three-analysis.yml'
      - '.github/workflows/titan007-final-hourly.yml'
      - '.github/workflows/nba-priority-2130.yml'
      - '.github/workflows/verify-hourly-market-movement.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Snapshot and historical movement tests
        run: python3 analysis/titan007_hourly_history.py self-test
      - name: Dynamic multi-snapshot and iPhone narrative tests
        run: |
          python3 analysis/nba_hourly_dynamic_review.py --self-test
          python3 scripts/verify_nba_capture_analysis.py --self-test
          python3 scripts/pushplus_mobile.py --mode smoke --self-test
          python3 -m py_compile analysis/titan007_hourly_history.py analysis/nba_hourly_dynamic_review.py scripts/pushplus_mobile.py scripts/pushplus_mobile_v2.py
      - name: Confirm persistence occurs before 3-30 minute final window filtering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/titan007-final-hourly.yml').read_text()
          assert s.index('titan007_hourly_history.py capture') < s.index('Select 3–30 minute final window')
          assert 'git add reports/hourly/' in s
          assert 'cancel-in-progress: false' in s
          assert 'titan007_hourly_movement.html' in s
          assert s.index('git pull --ff-only origin main') < s.index('titan007_hourly_history.py capture')
          assert 'nba_prediction_adapter.py --joined titan007_joined_today.json' in s
          assert 'nba_model_report.py --joined titan007_joined_today.json' in s
          assert 'reports/hourly/**/*.json' in s
          for workflow in ('.github/workflows/titan007-three-analysis.yml',
                           '.github/workflows/titan007-final-hourly.yml',
                           '.github/workflows/nba-priority-2130.yml'):
              src=Path(workflow).read_text()
              assert 'scripts/verify_nba_capture_analysis.py --joined' in src
              assert 'nba_capture_audit.json' in src
              assert src.index('verify_nba_capture_analysis.py --joined')<src.index('pushplus_mobile.py --mode')
          print('ALL_CAPTURE_DYNAMIC_GATES_PASS')
          assert 'nba_hourly_dynamic_review.py' in s
          assert 'reports/hourly-reviews/' in s
          assert '--dynamic nba_hourly_dynamic_review.json' in s
          print('HOURLY_PERSISTENCE_WIRING_PASS')
          PY
