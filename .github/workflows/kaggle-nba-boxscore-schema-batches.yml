name: Kaggle NBA player team boxscore batch schema audit
on:
  push:
    branches: [research/sbr-archive-parser-20261029]
    paths:
      - scripts/kaggle_nba_boxscore_schema_batch.py
      - .github/workflows/kaggle-nba-boxscore-schema-batches.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/kaggle_nba_boxscore_schema_batch.py
      - run: test -z "$(git status --porcelain)"
