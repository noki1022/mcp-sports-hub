name: Kaggle NBA betting ZIP actual files inspection
on:
  push:
    branches: [research/sbr-archive-parser-20261029]
    paths:
      - scripts/probe_kaggle_betting_zip.py
      - .github/workflows/kaggle-betting-zip-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/probe_kaggle_betting_zip.py
      - name: Verify no dataset stored
        if: always()
        run: test -z "$(git status --porcelain)"
