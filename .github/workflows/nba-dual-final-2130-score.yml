name: NBA final 21:30 original vs independent shadow scoreboard (research only)
on:
  schedule:
    # One quiet audit after completed NBA Beijing-date games, not a push.
    - cron: '25 14 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: Optional completed Beijing game date YYYY-MM-DD
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: nba-2130-dual-model-score-${{ github.ref }}
  cancel-in-progress: false
jobs:
  score-original-vs-independent-shadow-21-30-only:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read frozen audit branch in separate checkout, never rerun either model
        run: |
          git fetch --quiet origin audit/dual-model-slot-evidence
          git worktree add --detach "$RUNNER_TEMP/dual-frozen-ledger" origin/audit/dual-model-slot-evidence
      - name: Grade all available frozen finals, including previously missed dates
        env:
          REQUESTED_DAY: ${{ inputs.target_date || '' }}
        run: |
          EXTRA=()
          if [ -n "$REQUESTED_DAY" ]; then EXTRA+=(--day "$REQUESTED_DAY"); fi
          python3 analysis/nba_dual_model_score_backlog.py \
            --ledger-worktree "$RUNNER_TEMP/dual-frozen-ledger" \
            --repo . --out "$RUNNER_TEMP/dual-2130-score" "${EXTRA[@]}"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads((Path(os.environ['RUNNER_TEMP'])/'dual-2130-score/summary.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('Frozen 21:30 paired fixtures: '+str(data['independent_fixture_count'])+'\n\n')
              f.write('| Market | Paired games | Dates | Original hits | Shadow hits | Original Brier | Shadow Brier |\n')
              f.write('|---|---:|---:|---:|---:|---:|---:|\n')
              for name,row in data['five_markets'].items():
                  f.write('| '+name+' | '+' | '.join(str(row[k]) for k in ('paired_games','independent_beijing_dates','original_hits','shadow_hits','original_brier','shadow_brier'))+' |\n')
              f.write('\nResearch only; no production promotion. Missing finals remain ungraded.\n')
          PY
      - name: Upload historical 21:30 model versus independent shadow outcome score
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-two-independent-models-2130-official-score-${{ github.run_id }}
          path: ${{ runner.temp }}/dual-2130-score/
          retention-days: 90
          if-no-files-found: warn

