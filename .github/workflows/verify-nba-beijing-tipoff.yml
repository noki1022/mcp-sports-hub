name: Verify NBA US game day to Beijing tipoff mapping
on:
  push:
    branches: [fix/nba-us-day-beijing-fixture-reconcile-20261030, fix/permanent-nba-beijing-market-coverage-20261030]
    paths:
      - scripts/nba_official_beijing_schedule.py
      - scripts/titan007_join_beijing_verified.py
      - .github/workflows/verify-nba-beijing-tipoff.yml
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  timezone:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/nba_official_beijing_schedule.py --self-test
      - run: python3 scripts/titan007_join_beijing_verified.py --self-test
      - name: Compile UTC/007 integration
        run: python3 -m py_compile scripts/titan007_join_beijing_verified.py
      - name: Regression on 007 source windows and deterministic missing-price behavior
        run: |
          python3 - <<'PY'
          import sys
          from unittest.mock import patch
          sys.path.insert(0,"scripts")
          import titan007_join_beijing_verified as m
          official={"nba_game_id":"one","home":"WAS","away":"CHA",
            "beijing_tip":"2026-10-31T07:00+08:00","beijing_date":"2026-10-31",
            "utc_tip":"2026-10-30T23:00:00+00:00","us_eastern_date":"2026-10-30"}
          site={"game_id":"55555","league":"NBA","home_team":"华盛顿奇才","away_team":"夏洛特黄蜂",
            "display_date":"2026-10-31","display_clock":"07:00"}
          def fetch(url,limit=0):
            from urllib.parse import urlparse,parse_qs
            date=parse_qs(urlparse(url).query)["date"][0]
            if date=="2026-10-30":raise OSError("neighbor outage")
            if "Oddsdata" in url:return b'<c><match><m>55555,1.5,0.88,0.88,220.5,0.88,0.88,1</m></match></c>'
            row=("55555^NBA,NBA^4^#fff^10月31日<br>07:00^0^^13^华盛顿奇才,Washington Wizards^3^夏洛特黄蜂,Charlotte Hornets^0^2026")
            if date!="2026-10-31":row=row.replace("55555","99999").replace("31日","01日")
            return ('<c><m><h><![CDATA['+row+']]></h></m></c>').encode("gb18030")
          with patch.object(m,"public_get",side_effect=fetch):
            ids,odds,coverage,_,errors=m.source_for_date("2026-10-31")
            assert "2026-10-31" in coverage and errors and errors[0]["site_date"]=="2026-10-30"
            matches,reasons=m.reconcile([official],ids,odds,"2026-10-31")
            assert len(matches)==1 and reasons.get("SITE_CLOCK_OR_DATE_UNVERIFIED")==1, (matches,reasons)
          print("PERMANENT_BEIJING_DATE_AND_PARTIAL_007_OUTAGE_PASS")
          PY
      # Historical CI must not depend on a live 007 website remaining available
      # after the match date. The mocked source-window regression above tests
      # the outage behavior; this fixture tests the archived full-chain path.
      - name: Use immutable archived verified 007 snapshot for historical E2E
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          date='2026-10-31'
          candidates=sorted(Path('reports/daily').glob(date+'/*/titan007_three_joined.json'))
          valid=[]
          for p in candidates:
              x=json.loads(p.read_text())
              if x.get('requested_display_date')==date and x.get('nba_cba_games'):
                  valid.append(p)
          if not valid:
              raise RuntimeError('HISTORICAL_VERIFIED_007_FIXTURE_MISSING')
          source=valid[0]
          Path('/tmp/verified-titan-20261031.json').write_bytes(source.read_bytes())
          print('HISTORICAL_007_ARCHIVE',source)
          PY
      - run: python3 -m pip install --disable-pip-version-check --quiet numpy==2.2.6
      - name: Validate full model and mobile-report chain on verified Beijing games
        run: |
          python3 analysis/nba_prediction_adapter.py --joined /tmp/verified-titan-20261031.json --out /tmp/verified-predictions.json
          python3 analysis/titan007_daily_market.py --joined /tmp/verified-titan-20261031.json --out /tmp/verified-market.json
          python3 analysis/market_decision_gate.py --market /tmp/verified-market.json --predictions /tmp/verified-predictions.json --out /tmp/verified-decision.json
          python3 analysis/nba_model_report.py --joined /tmp/verified-titan-20261031.json --predictions /tmp/verified-predictions.json --out-json /tmp/verified-model.json --out-html /tmp/verified-model.html
          python3 analysis/market_movement_tracker.py --current /tmp/verified-titan-20261031.json --history-root /tmp/unpopulated-007-daily/ --out /tmp/verified-movement.json
          python3 scripts/pushplus_mobile.py --mode three --joined /tmp/verified-titan-20261031.json --model /tmp/verified-model.json --movement /tmp/verified-movement.json --preview /tmp/verified-pushplus-preview.html --status /tmp/verified-pushplus-status.json
      - name: Validate next-morning schedule without quote fabrication
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime
          d=json.load(open('/tmp/verified-titan-20261031.json'))
          assert d['official_schedule_count']>=d['nba_cba_joined_for_date']>0
          assert d['market_opening_not_available'] is True
          assert d['recommendations']==[]
          for row in d['nba_cba_games']:
            assert datetime.fromisoformat(row['start_time_beijing']).date().isoformat()=='2026-10-31'
            assert not row['markets']['full_total']['opening']
          status=json.load(open('/tmp/verified-pushplus-status.json'))
          assert status['state']=='DRY_RUN_NOT_SENT'
          print('BEIJING_GAME_DAY_MODEL_REPORT_E2E_PASS',d['nba_cba_joined_for_date'])
          PY
