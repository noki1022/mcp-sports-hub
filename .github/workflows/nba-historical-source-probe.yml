name: NBA historical source real-data probe
on:
  push:
    branches: [research/sbr-archive-parser-20261029]
    paths:
      - scripts/probe_nba_historical_sources.py
      - .github/workflows/nba-historical-source-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Fetch and inspect external source files in memory only
        run: python3 scripts/probe_nba_historical_sources.py
      - name: Check no tracked repository data changed
        if: always()
        run: |
          git diff --exit-code
          git status --short
