name: P0 prospective injury shadow capture integrity
on:
  pull_request:
    paths:
      - analysis/nba_injury_prospective_capture.py
      - .github/workflows/nba-priority-2130.yml
      - .github/workflows/nba-priority-0630.yml
      - .github/workflows/nba-prospective-shadow-integrity.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet numpy==2.2.6
      - run: python3 analysis/nba_injury_prospective_capture.py --self-test
      - run: python3 analysis/nba_injury_prospective_acceptance.py --self-test
      - name: Validate scheduled workflow capture placement and archive
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for slot in ['2130','0630']:
              s=Path(f'.github/workflows/nba-priority-{slot}.yml').read_text()
              assert s.index('name: Complete per-game dynamic model interpretation')<s.index('name: Seal prospective original versus injury research shadow before kickoff')<s.index('name: Push full-board priority analysis to iPhone')
              assert f'nba_injury_prospective_{slot}.json' in s
              assert 'name: Archive snapshot, complete analysis and successful PushPlus marker' in s
          print("INJURY_SHADOW_PRESEND_CAPTURE_AND_ARCHIVE_GATES_PASS")
          PY
