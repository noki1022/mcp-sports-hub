name: 007-exclusive public lottery path discovery
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/probe_007_only_public_pages.py'
      - '.github/workflows/probe-007-only-public-pages.yml'
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python3 scripts/probe_007_only_public_pages.py --self-test
          python3 scripts/probe_007_only_public_pages.py
