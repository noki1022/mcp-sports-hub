name: Kaggle NBA game odds ZIP partial schema inspection
on:
  push:
    branches: [research/sbr-archive-parser-20261029]
    paths:
      - scripts/probe_kaggle_stats_game_odds_schema.py
      - .github/workflows/kaggle-stats-game-odds-schema.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/probe_kaggle_stats_game_odds_schema.py
      - name: Assert no repository mutations
        if: always()
        run: test -z "$(git status --porcelain)"
