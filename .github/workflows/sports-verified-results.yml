name: Sports verified results to immutable per-match review
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.cloudflare_slot_utc != '' && format('Cloudflare | slot={0}', inputs.cloudflare_slot_utc) || github.workflow }}
on:
  push:
    branches: [main]
    paths: ['analysis/sports_verified_*.py', 'analysis/sport_match_final_grade.py', 'ops/sports_result_to_review.py', 'ops/football_2100_review.py', 'analysis/football_jc_single_final_review.py', '.github/workflows/sports-verified-results.yml']
  pull_request:
    paths: ['analysis/sports_verified_*.py', 'analysis/sport_match_final_grade.py', 'ops/sports_result_to_review.py', 'ops/football_2100_review.py', 'analysis/football_jc_single_final_review.py', 'tests/test_football_2100_review.py', 'analysis/nba_per_match_score_review.py', 'tests/test_sports_verified_results.py', '.github/workflows/sports-verified-results.yml']
  workflow_run:
    workflows: ['Football + NBA immutable per-match latest valid pretip finals']
    types: [completed]
    branches: [main]
  schedule:
    # Fixed hourly verification. No odds or notification job.
    - cron: '50 * * * *'
  workflow_dispatch:
    inputs:
      cloudflare_slot_utc:
        description: 'Original Cloudflare cron timestamp in UTC'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: sports-verified-results-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate original scheduler slot
        env:
          CLOUDFLARE_SLOT_UTC: ${{ inputs.cloudflare_slot_utc }}
        run: python -B scripts/sports_postgame_slot.py verified-results
      - name: Verify raw result replay and reject wrong or unfinished results
        run: |
          python -m unittest discover -s tests -p test_sports_verified_results.py -v
          python -m unittest discover -s tests -p test_nba_per_match_score_review.py -v
          python -m unittest discover -s tests -p test_sport_match_final_grade.py -v
      - name: Read-only live admission rehearsal on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python ops/sports_result_to_review.py --repo "$GH_REPO"
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'pull_request'
        with:
          name: verified-results-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          path: verified-results/
          retention-days: 14
  archive:
    needs: validate
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event != 'pull_request'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Append verified result bytes and replayable per-match reviews
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python ops/sports_result_to_review.py --repo "$GH_REPO" --publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: verified-results/
          retention-days: 14

  validate-football-daily-2100:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate original scheduler slot
        env:
          CLOUDFLARE_SLOT_UTC: ${{ inputs.cloudflare_slot_utc }}
        run: python -B scripts/sports_postgame_slot.py verified-results
      - name: Verify frozen 21:00 settlement and missing result boundaries
        run: python -m unittest discover -s tests -p test_football_2100_review.py -v
      - name: Rehearse daily 21:00 settlement against verified 007 results
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ops/football_2100_review.py --repo "$GITHUB_REPOSITORY" --out football-2100-reviews
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'pull_request'
        with:
          name: football-2100-review-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          path: football-2100-reviews/
          if-no-files-found: ignore
          retention-days: 14
  football-daily-2100:
    needs: validate-football-daily-2100
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event != 'pull_request'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Archive daily 21:00 scorecard with raw 007 result evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ops/football_2100_review.py --repo "$GITHUB_REPOSITORY" --out football-2100-reviews --publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: football-2100-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: football-2100-reviews/
          if-no-files-found: ignore
          retention-days: 14
