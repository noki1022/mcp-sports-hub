name: Audit 007 JC sportsbook-side field orientation from public JS
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/audit_007_jc_side_orientation.py'
      - '.github/workflows/audit-007-jc-side-orientation.yml'
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python3 scripts/audit_007_jc_side_orientation.py --self-test
          python3 scripts/audit_007_jc_side_orientation.py
