name: Football Titan007 form H2H injury source audit
on:
  pull_request:
    paths:
      - 'scripts/football_007_form_h2h_injury_probe.py'
      - 'scripts/football_007_analysis_extract.py'
      - 'scripts/football_007_analysis_live_smoke.py'
      - 'tests/test_football_007_analysis_extract.py'
      - '.github/workflows/football-analysis-source-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify isolated time-safe parsing of 007 historical form and injury JSON
        run: python3 -B -m unittest discover -s tests -p test_football_007_analysis_extract.py -v
      - name: Run exact live future-match 007 embedded-data extraction
        run: python3 -B scripts/football_007_analysis_live_smoke.py
      - name: Audit live 007 football form recent five H2H and injury page links
        run: python3 -B scripts/football_007_form_h2h_injury_probe.py football-output/analysis-source-audit
      - name: Audit actual 007 mobile H2H recent-form and injury source structure
        if: github.event_name == 'workflow_dispatch'
        run: python3 -B scripts/football_007_mobile_probe.py
      - name: Archive source evidence for offline parser engineering
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-007-form-h2h-injury-source-audit
          path: |
            football-output/analysis-source-audit/
            football-output/analysis-smoke/
          retention-days: 30
