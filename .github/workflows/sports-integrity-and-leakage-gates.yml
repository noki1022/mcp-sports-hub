name: Sports NBA and football chain integrity plus no-leakage gates
on:
  pull_request:
    paths:
      - 'scripts/sports_chain_health.py'
      - 'analysis/sports_point_in_time_admission.py'
      - 'tests/test_sports_chain_health.py'
      - 'tests/test_sports_point_in_time_admission.py'
      - '.github/workflows/sports-integrity-and-leakage-gates.yml'
  workflow_dispatch:
  schedule:
    # 4 times/day, UTC; audit completed slots after a 3-hour delivery grace.
    - cron: "35 0,6,12,18 * * *"
permissions:
  contents: read
  actions: read
concurrency:
  group: sports-chain-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate timestamp, leak, embargo and actual-run evidence contracts
        run: |
          python3 -B -m unittest discover -s tests -p test_sports_point_in_time_admission.py -v
          python3 -B -m unittest discover -s tests -p test_sports_chain_health.py -v
          python3 -B -m py_compile scripts/sports_chain_health.py analysis/sports_point_in_time_admission.py
      - name: Retrieve actual scheduled workflow runs and archive state read-only
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p audit-input audit-output
          # Never use "latest" GitHub Actions artifacts as evidence.
          for page in 1 2 3 4; do
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs?event=schedule&per_page=100&page=$page" > "audit-input/native-$page.json"
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs?event=workflow_dispatch&per_page=100&page=$page" > "audit-input/external-$page.json"
            python3 -c 'import json,sys; a=json.load(open(sys.argv[1])); b=json.load(open(sys.argv[2])); print(json.dumps({"workflow_runs":a["workflow_runs"]+b["workflow_runs"]}))' "audit-input/native-$page.json" "audit-input/external-$page.json" > "audit-input/runs-$page.json"
          done
          gh api "/repos/$GITHUB_REPOSITORY/releases?per_page=100" > audit-input/releases.json
          gh api "/repos/$GITHUB_REPOSITORY/branches/archive/nba-market-captures" \
            > audit-input/nba-archive-branch.json
      - name: Inspect actual priority PushPlus jobs, including skipped sends
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p audit-input/priority-jobs
          python3 - <<'PY' > audit-input/priority-run-ids.txt
          import json
          from datetime import datetime,timezone,timedelta
          from pathlib import Path
          import sys
          sys.path.insert(0,"scripts")
          import sports_chain_health as h
          runs=[]
          for f in sorted(Path("audit-input").glob("runs-*.json")):
              runs.extend(json.loads(f.read_text())["workflow_runs"])
          now=datetime.now(timezone.utc)
          slots=list(h.expected_slots(now,24,180))
          grouped=h.chronological_assignments(slots,runs)
          ids=sorted({run["id"] for ix,attempts in grouped.items()
                      for run,_ in attempts if slots[ix]["workflow"] in h.PRIORITY
                      and slots[ix]["planned"].astimezone(h.BJ).strftime("%H:%M")
                      == "21:00"})
          for rid in ids[:16]:
              print(rid)
          PY
          while IFS= read -r id; do
            [ -n "$id" ] || continue
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" \
              > "audit-input/priority-jobs/$id.json"
          done < audit-input/priority-run-ids.txt
      - name: Produce strict shared NBA/football scheduled-capture and raw-evidence scorecard
        if: github.event_name != 'pull_request'
        run: |
          python3 -B scripts/sports_chain_health.py \
            --runs-page audit-input/runs-1.json \
            --runs-page audit-input/runs-2.json \
            --runs-page audit-input/runs-3.json \
            --runs-page audit-input/runs-4.json \
            --releases audit-input/releases.json \
            --archive-branch audit-input/nba-archive-branch.json \
            --priority-jobs-dir audit-input/priority-jobs \
            --nba-receipts-root reports/pushplus-sent \
            --out audit-output/sports-chain-health.json --strict
      - name: Keep read-only diagnostic report, even when the audit detects missing runs
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sports-cross-chain-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: audit-output/sports-chain-health.json
          if-no-files-found: warn
          retention-days: 90

