name: NBA third source route scores match audit
on:
  push:
    branches: [research/sbr-archive-parser-20261029]
    paths:
      - analysis/nba_independent_route_score_audit.py
      - .github/workflows/nba-third-route-score-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 analysis/nba_independent_route_score_audit.py --self-test
      - run: python3 analysis/nba_independent_route_score_audit.py
      - if: always()
        run: test -z "$(git status --porcelain)"
