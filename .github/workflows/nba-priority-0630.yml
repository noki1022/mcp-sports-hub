name: NBA PRIORITY 06:30 Beijing morning full report
on:
  schedule:
    # Beijing 06:30, recovery at 06:40/06:50; same 0630 marker.
    - cron: "30 22 * * *"
    - cron: "40 22 * * *"
    - cron: "50 22 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nba-priority-0630-main
  cancel-in-progress: false
jobs:
  priority:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preflight Beijing morning window; check prior accepted push
        id: gate
        run: |
          python3 scripts/nba_0630_priority_gate.py --phase preflight >> /tmp/priority_gate.txt
          target=$(sed -n 's/^TARGET_DATE=//p' /tmp/priority_gate.txt)
          echo "TARGET_DATE=$target" >> "$GITHUB_ENV"
          git pull --ff-only origin main
          if test -f "reports/pushplus-sent/$target/0630.json"; then
            echo "sent=true" >> "$GITHUB_OUTPUT"
            echo "PRIORITY_0630_ALREADY_ACCEPTED"
          else
            echo "sent=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.sent != 'true'
        name: Install pinned model dependencies
        run: python3 -m pip install --quiet --disable-pip-version-check numpy==2.2.6 pdfplumber==0.11.7
      - if: steps.gate.outputs.sent != 'true'
        name: Refresh same-morning NBA market odds from 007
        run: |
          for n in 1 2; do
            if python3 scripts/titan007_join_beijing_verified.py --date "$TARGET_DATE" --out titan007_priority_joined.json; then exit 0; fi
          done
          exit 1
      - if: steps.gate.outputs.sent != 'true'
        name: Enforce official NBA cohort originally frozen at 12:00
        run: |
          python3 scripts/nba_noon_slate.py enforce --joined titan007_priority_joined.json --lock "reports/noon-cohorts/$TARGET_DATE/1200.json" --out nba_same_slate.json
      - if: steps.gate.outputs.sent != 'true'
        name: Enforce same official games AND 007 IDs as last night's 21:30
        run: |
          git pull --ff-only origin main
          python3 scripts/nba_overnight_cohort.py enforce --cohort "reports/overnight-cohorts/$TARGET_DATE/2130.json" --joined titan007_priority_joined.json --phase morning --out nba_priority_same_slate.json
          mv nba_priority_same_slate.json titan007_priority_joined.json
      - if: steps.gate.outputs.sent != 'true'
        name: Exclude started and wrong-day NBA games
        run: |
          python3 scripts/nba_0630_pretip_filter.py --joined titan007_priority_joined.json --out nba_priority_pretip.json
          mv nba_priority_pretip.json titan007_priority_joined.json
      - if: steps.gate.outputs.sent != 'true'
        name: Verify all official games and Beijing tipoffs
        run: |
          python3 - <<'PY'
          import json,os
          from datetime import datetime
          j=json.load(open('titan007_priority_joined.json'))
          assert j['requested_display_date']==os.environ['TARGET_DATE']
          assert j.get('nba_cba_games'), 'NO_VERIFIED_007_MATCHES'
          for g in j['nba_cba_games']:
              assert datetime.fromisoformat(g['start_time_beijing']).date().isoformat()==os.environ['TARGET_DATE']
          print('PRIORITY_VERIFIED_GAMES',len(j['nba_cba_games']),'MISSING',j.get('nba_markets_missing'))
          PY
      - if: steps.gate.outputs.sent != 'true'
        name: Compare preceding hourly and fixed-slot market snapshots
        run: |
          python3 analysis/titan007_hourly_history.py capture --current titan007_priority_joined.json --root reports/hourly --daily-root reports/daily --out-movement titan007_priority_movement.json
      - if: steps.gate.outputs.sent != 'true'
        name: Independent model, full board
        run: |
          python3 analysis/nba_prediction_adapter.py --joined titan007_priority_joined.json --out nba_priority_predictions.json
      - if: steps.gate.outputs.sent != 'true'
        name: Collect injury quality, unknown on source failure
        run: |
          python3 analysis/nba_official_injury.py --date "$TARGET_DATE" --out nba_priority_injuries.json || echo "OFFICIAL_INJURY_UNAVAILABLE"
          python3 analysis/nba_injury_context.py --joined titan007_priority_joined.json --injuries nba_priority_injuries.json --out nba_priority_injury_context.json
      - if: steps.gate.outputs.sent != 'true'
        name: Complete per-game dynamic model interpretation
        run: |
          python3 analysis/nba_model_report.py --joined titan007_priority_joined.json --predictions nba_priority_predictions.json --injury-context nba_priority_injury_context.json --out-json nba_priority_model.json --impact-catalog config/nba_player_impact_validated.json --out-html nba_priority_model.html
          python3 analysis/nba_hourly_dynamic_review.py --movement titan007_priority_movement.json --model nba_priority_model.json --injury nba_priority_injury_context.json --out nba_priority_dynamic.json
          python3 analysis/nba_market_bc_diagnostics.py --joined titan007_priority_joined.json --movement titan007_priority_movement.json --model nba_priority_model.json --out nba_priority_bc.json
      - if: steps.gate.outputs.sent != 'true'
        name: Seal prospective original versus injury research shadow before kickoff
        run: |
          python3 analysis/nba_injury_prospective_capture.py --joined titan007_priority_joined.json --model nba_priority_model.json --injuries nba_priority_injury_context.json --out nba_injury_prospective_0630.json
      - if: steps.gate.outputs.sent != 'true'
        name: Audit all three user-supplied Jingcai pricing sources before market fusion
        env:
          MARZDATA_APP_ID: ${{ secrets.MARZDATA_APP_ID }}
          MARZDATA_APP_SECRET: ${{ secrets.MARZDATA_APP_SECRET }}
          MARZDATA_STATIC_EGRESS_CONFIRMED: ${{ vars.MARZDATA_STATIC_EGRESS_CONFIRMED }}
          MARZDATA_SLOT_ORDER_CONFIRMED: ${{ vars.MARZDATA_SLOT_ORDER_CONFIRMED }}
        run: |
          # Authorized data remains disabled unless both secrets and approved fixed egress are set.
          # No credentials are ever written to artifacts or logs.
          python3 scripts/titan007_jingcai_three_market.py --joined titan007_priority_joined.json --out nba_jingcai_three_market.json
          python3 - <<'PY'
          import json
          x=json.load(open("nba_jingcai_three_market.json"))
          assert set(x["source_status"])==set(("WIN_LOSE","HANDICAP_WIN_LOSE","TOTAL"))
          assert x["game_count"]==len(x["games"])
          print("JINGCAI_REQUIRED_SOURCE_AUDIT",x["status"],x["verified_games_with_all_three"])
          PY
      - if: steps.gate.outputs.sent != 'true'
        name: Capture 007 visible top-ten companies and compare last stored sample
        run: |
          python3 scripts/titan007_top10_companies.py --joined titan007_priority_joined.json --out nba_top10_companies.json --analysis nba_top10_comparison.json --history-root reports/top10
      - if: steps.gate.outputs.sent != 'true'
        name: Persist top-ten institution snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/top10/
          if ! git diff --cached --quiet; then
            git commit -m "Archive 007 top-ten company market capture $TARGET_DATE"
            for n in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              git pull --rebase origin main
              if [ "$n" -eq 3 ]; then exit 1; fi
            done
          fi
      - if: steps.gate.outputs.sent != 'true'
        name: Freeze five independent Jingcai/Crown NBA research directions
        run: |
          python3 analysis/nba_five_markets.py \
            --joined titan007_priority_joined.json \
            --model nba_priority_model.json \
            --jingcai nba_jingcai_three_market.json \
            --top10 nba_top10_comparison.json \
            --out nba_five_market_forecast.json
          python3 analysis/nba_injury_prerequisite.py --five nba_five_market_forecast.json --injury nba_priority_injury_context.json --model nba_priority_model.json --out nba_five_market_forecast_gated.json
          mv nba_five_market_forecast_gated.json nba_five_market_forecast.json
          python3 - <<'PY'
          import json
          x=json.load(open("nba_five_market_forecast.json"))
          assert x["game_count"]>0 and len(x["market_keys"])==5
          assert all(set(g["markets"])==set(x["market_keys"]) for g in x["games"])
          print("FIVE_MARKET_SNAPSHOT_FROZEN",x["game_count"],x["ready_counts"])
          PY
      - if: steps.gate.outputs.sent != 'true'
        name: Generate mandatory NBA spread and total research verdicts from ten institutions
        run: |
          python3 analysis/nba_two_market_forecast.py --joined titan007_priority_joined.json --model nba_priority_model.json --top10 nba_top10_comparison.json --out nba_two_market_forecast.json
      - if: steps.gate.outputs.sent != 'true'
        name: Enforce same-capture market trend and full-board model review
        run: |
          python3 scripts/verify_nba_capture_analysis.py --joined titan007_priority_joined.json --movement titan007_priority_movement.json --model nba_priority_model.json --dynamic nba_priority_dynamic.json --out nba_capture_audit.json
      - if: steps.gate.outputs.sent != 'true'
        name: Enforce seven-stage 007 NBA model and market SOP
        run: |
          python3 analysis/nba_analysis_sop.py \
            --joined titan007_priority_joined.json \
            --model nba_priority_model.json \
            --prediction-gate nba_priority_predictions.json \
            --movement titan007_priority_movement.json \
            --jingcai nba_jingcai_three_market.json \
            --top10 nba_top10_comparison.json \
            --injury nba_priority_injury_context.json \
            --out nba_analysis_sop.json
          python3 - <<'PY'
          import json
          o=json.load(open('nba_analysis_sop.json'))
          assert o['game_count']>0 and o['decision']=='NO_BET'
          assert len(o['stages'])==7
          print('NBA_SOP_PRIORITY_PRESEND_VALIDATED',o['game_count'],o['verified_jingcai_ids'])
          PY
      - if: steps.gate.outputs.sent != 'true'
        name: Rank verified high-attention NBA games for 0630 priority message
        run: |
          python3 analysis/nba_priority_focus.py --joined titan007_priority_joined.json --model nba_priority_model.json --jingcai nba_jingcai_three_market.json --sop nba_analysis_sop.json --slot 0630 --out nba_priority_focus.json
          python3 - <<'PY'
          import json
          x=json.load(open('nba_priority_focus.json'))
          assert x['slot']=='0630' and x['total_nba_games']>0
          assert x['focus_count']<=3 and x['confidence_threshold'] is None
          print('PRIORITY_MODEL_ATTENTION',x['focus_count'],x['total_nba_games'])
          PY
      - if: steps.gate.outputs.sent != 'true'
        name: Enforce strict presend 06:58 Beijing deadline and dedup
        run: |
          python3 scripts/nba_0630_priority_gate.py --phase presend
          python3 scripts/nba_0630_pretip_filter.py --joined titan007_priority_joined.json --out nba_priority_presend_verified.json
          python3 - <<'PY'
          import json
          a=json.load(open('titan007_priority_joined.json'))
          b=json.load(open('nba_priority_presend_verified.json'))
          assert len(a['nba_cba_games'])==len(b['nba_cba_games']), 'PRETIP_CHANGED_DURING_ANALYSIS_ABORT'
          PY
          git fetch origin main
          if git cat-file -e "origin/main:reports/pushplus-sent/$TARGET_DATE/0630.json" 2>/dev/null; then
             echo 'PRIORITY_ALREADY_ACCEPTED_IN_REMOTE'; exit 1
          fi
      - if: steps.gate.outputs.sent != 'true'
        name: Push full-board priority analysis to iPhone before morning NBA tipoffs
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          python3 scripts/pushplus_mobile.py --mode three --joined titan007_priority_joined.json --movement titan007_priority_movement.json --dynamic nba_priority_dynamic.json --top10 nba_top10_comparison.json --jingcai nba_jingcai_three_market.json --verdict nba_two_market_forecast.json --model nba_priority_model.json --sop nba_analysis_sop.json --five nba_five_market_forecast.json --priority-focus nba_priority_focus.json --preview nba_priority_iphone.html --status nba_priority_pushplus_status.json --send --require-token
          python3 - <<'PY'
          import json
          s=json.load(open('nba_priority_pushplus_status.json'))
          if s.get('state')!='API_ACCEPTED_NOT_DEVICE_CONFIRMED':raise RuntimeError('PRIORITY_PUSH_NOT_ACCEPTED')
          print('PRIORITY_PUSHPLUS_API_ACCEPTED',s.get('games_considered'))
          PY
      - if: steps.gate.outputs.sent != 'true'
        name: Archive snapshot, complete analysis and successful PushPlus marker
        run: |
          mkdir -p "reports/daily/$TARGET_DATE/0630" "reports/pushplus-sent/$TARGET_DATE"
          cp titan007_priority_joined.json titan007_priority_movement.json nba_priority_dynamic.json nba_priority_model.json nba_priority_bc.json nba_jingcai_three_market.json nba_two_market_forecast.json nba_five_market_forecast.json nba_priority_focus.json nba_priority_iphone.html nba_injury_prospective_0630.json "reports/daily/$TARGET_DATE/0630/"
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          Path('reports/pushplus-sent',os.environ['TARGET_DATE'],'0630.json').write_text(json.dumps({'state':'API_ACCEPTED_NOT_DEVICE_CONFIRMED','slot':'0630','run_id':os.environ['GITHUB_RUN_ID']})+'\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/hourly/ "reports/daily/$TARGET_DATE/0630" "reports/pushplus-sent/$TARGET_DATE/0630.json"
          git commit -m "Priority pre-cutoff NBA report $TARGET_DATE"
          for i in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-priority-0630-${{ env.TARGET_DATE }}
          path: |
            titan007_priority_joined.json
            titan007_priority_movement.json
            nba_priority_model.json
            nba_top10_companies.json
            nba_top10_comparison.json
            nba_jingcai_three_market.json
            nba_two_market_forecast.json
            nba_five_market_forecast.json
            nba_priority_focus.json
            nba_capture_audit.json
            reports/overnight-cohorts/**/*.json
            nba_priority_dynamic.json
            nba_priority_injury_context.json
            nba_injury_prospective_0630.json
            nba_priority_bc.json
            nba_priority_iphone.html
            nba_priority_pushplus_status.json
          if-no-files-found: warn
          retention-days: 14
