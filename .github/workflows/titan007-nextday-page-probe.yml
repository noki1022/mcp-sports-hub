name: Inspect Titan007 official next-day schedule entrypoint
on:
  push:
    branches: [diagnostics/titan007-future-date-20261030]
    paths:
      - scripts/titan007_nextday_page_probe.py
      - scripts/titan007_schedule_endpoint_evidence.py
      - scripts/titan007_date_endpoint_probe.py
      - .github/workflows/titan007-nextday-page-probe.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/titan007_date_endpoint_probe.py
