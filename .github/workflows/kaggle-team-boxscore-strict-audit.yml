name: NBA full historical team boxscore strict audit
on:
  push:
    branches: [research/sbr-archive-parser-20261029]
    paths:
      - analysis/kaggle_team_boxscore_strict_audit.py
      - .github/workflows/kaggle-team-boxscore-strict-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 analysis/kaggle_team_boxscore_strict_audit.py --self-test
      - run: python3 analysis/kaggle_team_boxscore_strict_audit.py
      - name: No disk persistence or committed raw data
        if: always()
        run: test -z "$(git status --porcelain)"
