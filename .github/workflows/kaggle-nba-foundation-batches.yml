name: Kaggle NBA foundation two-file batch audit
on:
  push:
    branches: [research/sbr-archive-parser-20261029]
    paths:
      - scripts/kaggle_nba_foundation_batches.py
      - .github/workflows/kaggle-nba-foundation-batches.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/kaggle_nba_foundation_batches.py --self-test
      - run: python3 scripts/kaggle_nba_foundation_batches.py
      - name: Verify clean repository
        if: always()
        run: test -z "$(git status --porcelain)"
