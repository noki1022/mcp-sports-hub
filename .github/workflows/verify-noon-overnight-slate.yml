name: Verify noon-to-06:30 identical NBA slate
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/nba_noon_slate.py'
      - '.github/workflows/titan007-three-analysis.yml'
      - '.github/workflows/titan007-final-hourly.yml'
      - '.github/workflows/nba-priority-2130.yml'
      - '.github/workflows/nba-priority-0630.yml'
      - '.github/workflows/verify-noon-overnight-slate.yml'
permissions: {contents: read}
jobs:
  same-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Strict official slate and variable price availability
        run: |
          python3 scripts/nba_noon_slate.py self-test
          python3 - <<'PY'
          import sys
          from datetime import datetime
          sys.path.insert(0,"scripts")
          from nba_noon_slate import recover
          base={"requested_display_date":"2026-10-31","captured_at_utc":"2026-10-30T05:15:00Z",
                "upcoming_nba_games":[{"nba_game_id":"101","home":"BOS","away":"NYK",
                "beijing_date":"2026-10-31","utc_tip":"2026-10-30T23:00:00Z"}],
                "official_schedule_count":1,"nba_cba_games":[]}
          x=recover(base,"2026-10-31")
          assert x["noon_on_time"] is False and x["captured_at_utc"]==base["captured_at_utc"]
          print("ARCHIVED_NOON_LOCK_RECOVERY_PASS")
          PY
          python3 -m py_compile scripts/nba_noon_slate.py
      - name: All seven capture stages must use the exact noon slate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          daily=Path('.github/workflows/titan007-three-analysis.yml').read_text()
          hourly=Path('.github/workflows/titan007-final-hourly.yml').read_text()
          night=Path('.github/workflows/nba-priority-2130.yml').read_text()
          morning=Path('.github/workflows/nba-priority-0630.yml').read_text()
          assert 'nba_noon_slate.py freeze' in daily
          for text in (daily,hourly,night,morning):
              assert 'nba_noon_slate.py enforce' in text
              assert 'reports/noon-cohorts/$TARGET_DATE/1200.json' in text
          for text in (daily,hourly,night,morning):
              assert text.index('nba_noon_slate.py enforce')<text.index('titan007_hourly_history.py capture')
          assert '- cron: "0 22 * * *"' not in daily
          print('NOON_TO_MORNING_ALL_CAPTURE_SLOTS_LOCKED_PASS')
          PY
