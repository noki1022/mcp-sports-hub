name: Repair npm dependency lockfile safely
on:
  push:
    branches: ["fix/security-and-titan007-daily-analysis"]
    paths: [".github/workflows/repair-dependency-lock.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/security-and-titan007-daily-analysis
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Repair compatible lockfile versions
        run: npm audit fix --package-lock-only --audit-level=low
      - name: Validate audit, types and tests
        run: |
          npm ci
          npm audit --audit-level=low
          npm run typecheck
          npm test
      - name: Commit repair only after passing checks
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'security: upgrade compatible vulnerable transitive dependencies'
            git push origin HEAD:fix/security-and-titan007-daily-analysis
          else
            echo "No lockfile changes needed"
          fi
