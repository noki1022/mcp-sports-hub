name: Verify retired NBA 06:30 automatic report disabled
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/nba-priority-0630.yml'
      - '.github/workflows/nba-silent-overnight-hourly.yml'
      - '.github/workflows/titan007-three-analysis.yml'
      - '.github/workflows/verify-nba-priority-0630.yml'
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No automatic overnight or 06:30 capture or PushPlus
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in ('nba-priority-0630.yml','nba-silent-overnight-hourly.yml',
                       'nba-priority-2130.yml'):
              s=Path('.github/workflows')/path
              assert '  schedule:' not in s.read_text(),path
          main=Path('.github/workflows/titan007-three-analysis.yml').read_text()
          expected=[f'    - cron: "0 {h} * * *"' for h in range(4,16)]
          actual=[l for l in main.splitlines() if l.startswith('    - cron:')]
          assert actual==expected,(actual,expected)
          print('NBA_12_HOURS_NO_0630_NO_OVERNIGHT_PASS')
          PY
