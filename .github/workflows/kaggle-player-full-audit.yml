name: Kaggle complete NBA player score reconciliation
on:
  push:
    branches: [research/sbr-archive-parser-20261029]
    paths:
      - analysis/kaggle_player_full_audit.py
      - scripts/kaggle_player_signed_shard_audit.py
      - .github/workflows/kaggle-player-full-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 analysis/kaggle_player_full_audit.py --self-test
      - run: python3 analysis/kaggle_player_full_audit.py
      - if: always()
        run: test -z "$(git status --porcelain)"
