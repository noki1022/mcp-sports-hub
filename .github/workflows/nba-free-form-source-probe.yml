name: Research permitted daily NBA form and H2H data feeds
on:
  push:
    branches: ["feature/nba-daily-form-h2h-efficiency"]
    paths: [".github/workflows/nba-free-form-source-probe.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Investigate public CSV and documented free API safely
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re,urllib.request,urllib.error,urllib.robotparser,urllib.parse,csv,io
          from html.parser import HTMLParser
          class Parser(HTMLParser):
              def __init__(self):super().__init__();self.links=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='a':
                      z=dict(attrs).get('href')
                      if z:self.links.append(z)
          ua='NBAFreeFormResearch/1.0 (read-only once per endpoint)'
          cache={}
          def fetch(url,limit=400000):
              p=urllib.parse.urlsplit(url);origin=f'{p.scheme}://{p.netloc}'
              if origin not in cache:
                  try:
                      with urllib.request.urlopen(urllib.request.Request(origin+'/robots.txt',headers={'User-Agent':ua}),timeout=8) as r:
                          t=r.read(80000).decode('utf-8','replace')
                      rp=urllib.robotparser.RobotFileParser();rp.parse(t.splitlines())
                      cache[origin]=('present',rp)
                  except urllib.error.HTTPError as e:cache[origin]=(str(e.code),None)
                  except Exception as e:cache[origin]=(type(e).__name__,None)
              st,rp=cache[origin]
              if not (st in ('404','410') or (st=='present' and rp.can_fetch(ua,url))):
                  return {'result':'NO_CONFIRMED_ACCESS','robots':st}
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':ua}),timeout=15) as r:
                      raw=r.read(limit+1)
                      status=r.status;ctype=r.headers.get('Content-Type','')
                  if len(raw)>limit:return {'result':'TOO_LARGE','bytes':len(raw),'status':status}
                  return {'result':'FETCHED','status':status,'type':ctype,'bytes':len(raw),'body':raw.decode('utf-8','replace')}
              except urllib.error.HTTPError as e:return {'result':'HTTP_ERROR','status':e.code}
              except Exception as e:return {'result':'NETWORK_ERROR','error':type(e).__name__+':'+str(e)[:140]}
          out={}
          page='https://boxscorelab.com/downloads/'
          s=fetch(page,350000)
          out['boxscorelab_index']={k:v for k,v in s.items() if k!='body'}
          if 'body' in s:
              pars=Parser();pars.feed(s['body'])
              links=[urllib.parse.urljoin(page,l) for l in pars.links if '.csv' in l.lower()]
              out['csv_links']=links[:35]
              for lookup in ['2026-27-team-game-results','2025-26-team-game-results','2026-27-team-standings']:
                  hit=next((x for x in links if lookup in x),None)
                  if not hit:continue
                  c=fetch(hit,500000)
                  entry={k:v for k,v in c.items() if k!='body'}
                  if 'body' in c:
                      rows=list(csv.DictReader(io.StringIO(c['body'])))
                      entry['rows']=len(rows)
                      entry['fields']=list(rows[0].keys()) if rows else []
                      entry['sample']=rows[:2]
                      if rows and 'date' in rows[0]:
                          entry['dates_last5']=sorted([r['date'] for r in rows if r.get('date')])[-5:]
                  out[lookup]=entry
          ts='https://www.thesportsdb.com/api/v1/json/123/eventspastleague.php?id=4387'
          q=fetch(ts,65000)
          out['thesportsdb_recent']={k:v for k,v in q.items() if k!='body'}
          if 'body' in q:
              try:
                  d=json.loads(q['body']);ev=d.get('events') or []
                  out['thesportsdb_recent'].update(count=len(ev),first_fields=list(ev[0])[:30] if ev else [],sample=[{'date':e.get('dateEvent'),'home':e.get('strHomeTeam'),'away':e.get('strAwayTeam'),'hs':e.get('intHomeScore'),'as':e.get('intAwayScore')} for e in ev[:3]])
              except Exception as e:out['thesportsdb_recent']['json_error']=str(e)[:130]
          with open('nba_free_form_probes.json','w') as f:json.dump(out,f,ensure_ascii=False,indent=2)
          print(json.dumps(out,ensure_ascii=False,indent=2)[:20000])
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-free-form-source-probes
          path: nba_free_form_probes.json
