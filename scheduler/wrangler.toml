name = "nba-external-schedule-watchdog"
main = "worker.mjs"
compatibility_date = "2026-10-30"
[triggers]
# Keep at most five account-level triggers for Cloudflare Workers Free.
# Superset Cron ticks are harmless: worker.mjs accepts only canonical NBA
# and football slots, performing no HTTP calls on non-matching ticks.
crons = ["0,8,18,20,28,35 4,6,7,10 * * *", "0,7,16,20,30,35,40,42,52 13 * * *", "0,10,20,35 14 * * *", "20,30,35,40,42,52 22 * * *", "20,30,35,40,50 5,8,9,11,12,16-21 * * *"]
