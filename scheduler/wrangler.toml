name = "nba-external-schedule-watchdog"
main = "worker.mjs"
compatibility_date = "2026-10-30"

# Three schedules stay below the Cloudflare Free account limit of five Cron Triggers.
# All cron expressions are UTC; worker.mjs converts every decision to Beijing time.
[triggers]
crons = [
  "*/15 * * * *",
  "*/5 22-23,0-13 * * *",
  "0,5,7,8,10,16,18,20,28,30,35,40,45,50,55 0-8,10,13,20,22-23 * * *"
]
