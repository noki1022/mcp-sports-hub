name = "nba-external-schedule-watchdog"
main = "worker.mjs"
compatibility_date = "2026-10-30"
[triggers]
# Original archive slots stay intact. The additional minutes prepare existing
# runners only: hourly/football-review 30m early, NBA final checks 10m early.
# Four cron expressions, within the Workers Free account limit of five.
crons = ["0 4-15 * * *", "25,50 * * * *", "30 3-14 * * *", "15,40 * * * *"]

[vars]
GITHUB_PREWARM = "1"

[observability]
enabled = true
