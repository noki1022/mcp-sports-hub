name = "nba-external-schedule-watchdog"
main = "worker.mjs"
compatibility_date = "2026-10-30"
[triggers]
# Original archive slots stay intact. The additional minutes prepare existing
# runners only: hourly/football-review 30m early, NBA final checks 10m early.
# One combined cron expression reduces existing account trigger usage; each
# route below still executes only at its own original/preparation minute.
crons = ["0,15,25,30,40,50 * * * *"]

[vars]
GITHUB_PREWARM = "1"

[observability]
enabled = true
