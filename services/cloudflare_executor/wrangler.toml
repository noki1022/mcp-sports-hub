name = "noki-sports-independent-executor"
main = "worker.mjs"
compatibility_date = "2026-11-18"
workers_dev = true

[vars]
SPORTS_EXECUTOR_LIVE = "0"

[[containers]]
class_name = "SportsExecutor"
image = "../sports_executor/Dockerfile"
image_build_context = "../.."
instance_type = "basic"
max_instances = 1

[[durable_objects.bindings]]
name = "EXECUTOR"
class_name = "SportsExecutor"

[exports.SportsExecutor]
type = "durable-object"
storage = "sqlite"

[observability]
enabled = true
